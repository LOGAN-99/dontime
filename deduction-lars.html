<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 013 · 라르스 미트탕크 추리 퀴즈 | 셈플리</title><meta name="description" content="라르스 미트탕크 실종 사건의 공개 기록을 바탕으로 사실과 추론을 구분하는 8문제 추리 퀴즈."><link rel="canonical" href="https://dontime.kr/deduction-lars.html"><meta name="robots" content="index,follow"><style>body{margin:0;background:#f1f3f1;color:#1d2925;font:15px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:800px;margin:auto;padding:25px 18px}.nav{display:flex;justify-content:space-between}.nav a{color:inherit;text-decoration:none;font-weight:bold}.card{background:white;border:1px solid #d8dfda;border-radius:16px;padding:23px;margin:18px 0}.eyebrow{font:900 11px monospace;color:#927044;letter-spacing:.15em}h1{font-size:clamp(30px,6vw,46px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #d6ded8;border-radius:10px;background:white;font:inherit;cursor:pointer}.opts button:disabled{opacity:.8}.feedback{display:none;background:#edf2ec;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#203e34;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:bold}.muted{color:#63736a}</style></head><body><main class="wrap"><header class="nav"><a href="/lars-mittank.html">← CASE 013 다큐</a><a href="/mystery.html">다큐 목록</a></header><section class="card"><div class="eyebrow">CASE 013 · LARS MITTANK</div><h1>기록으로 추리하기</h1><p>공개된 사실과 증거의 범위를 바탕으로 답을 골라보세요. 영상이나 행동만으로 동기·진단·범죄를 단정하지 않습니다.</p></section><section class="card"><div id="count" class="muted"></div><p id="q" class="question"></p><div id="opts" class="opts"></div><div id="fb" class="feedback"></div><button id="next" hidden>다음 문제 →</button></section><section class="card"><p class="muted">8문제 · 확인되지 않은 인물이나 가해자를 지목하지 않습니다.</p><a href="/maze17.html">연결 미궁 PART 17</a></section></main><script>const qs=[{q:"라르스 미트탕크가 마지막으로 확인된 장소는?",o:["베를린 중앙역","바르나 공항, 불가리아","골든 샌즈 해변","함부르크 항구"],a:1,e:"공식 경찰 공개 안내는 마지막 장소를 바르나 공항으로 기록합니다."},{q:"공식 경찰 안내에 기록된 마지막 확인 시각은?",o:["2014년 7월 8일 10:11 현지 시각","2014년 7월 7일 10:11","2014년 7월 8일 23:11","2015년 5월 7일"],a:0,e:"슐레스비히홀슈타인 경찰 공개 안내에 2014년 7월 8일 10:11 현지 시각이 기록돼 있습니다."},{q:"친구들이 독일로 돌아간 이유와 관련해 공식 기록이 언급한 것은?",o:["여행 일정이 취소됐다","귀 부상으로 비행을 권하지 않는 의사의 조언","공항이 폐쇄됐다","여권을 잃어버렸다"],a:1,e:"경찰 공개 안내는 귀 부상으로 의사가 비행을 권하지 않았고 친구들은 예정대로 귀국했다고 기록합니다."},{q:"공항 CCTV가 직접 보여 주는 것은?",o:["그가 실제로 추적당했다","그가 터미널 밖으로 달려 나갔다","그가 이후 어디에 살았는지","그가 어떤 범죄를 저질렀는지"],a:1,e:"영상은 움직임을 기록하지만 그 이유나 이후 행방을 보여 주지는 않습니다."},{q:"공항을 떠날 때 남겨진 물품으로 공식 기록에 언급된 것은?",o:["수하물, 휴대전화, 여권","차량과 집","옷장과 호텔 키","가족 사진만"],a:0,e:"공식 경찰 안내는 수하물과 휴대전화 등을 가져가지 않은 상태로 공항을 떠났다고 기록합니다."},{q:"가족에게 전해진 추적당한다는 말은 어떻게 다뤄야 하는가?",o:["실제 추적자가 있다는 증거로 확정한다","진술로 기록하고 독립적인 증거와 구분한다","그 말을 했으므로 범죄가 확정된다","모든 보도를 삭제한다"],a:1,e:"당시의 진술은 중요한 기록이지만, 실제 추적자가 존재했다는 증거와는 구분해야 합니다."},{q:"현재까지 공개된 자료로 확정할 수 없는 것은?",o:["마지막 확인 장소","공항에서 달려 나간 장면","그가 왜 공항을 떠났는지","공식 경찰 안내의 마지막 업데이트 날짜"],a:2,e:"동기와 이후 경위는 공개된 증거로 확정되지 않았습니다."},{q:"가장 타당한 결론은?",o:["자발적 실종이 확정됐다","범죄 피해가 확정됐다","행방은 미확인이고 여러 설명은 가설로 남아 있다","CCTV가 모든 사건을 해결했다"],a:2,e:"공개 기록은 마지막 장면을 확인하지만, 이후 행방과 이유는 미해결입니다."}];let i=0,score=0,locked=false;const $=x=>document.getElementById(x);function draw(){locked=false;$('count').textContent='QUESTION '+(i+1)+' / '+qs.length;$('q').textContent=qs[i].q;$('opts').innerHTML=qs[i].o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$('fb').className='feedback';$('fb').textContent='';$('next').hidden=true;$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.n));}function answer(n){if(locked)return;locked=true;let x=qs[i];if(n===x.a)score++;$('opts').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#4c8b67';if(j===n&&n!==x.a)b.style.borderColor='#b66b61'});$('fb').textContent=(n===x.a?'정답! ':'정답은 '+x.o[x.a]+'. ')+x.e;$('fb').classList.add('show');$('next').hidden=false;$('next').textContent=i===qs.length-1?'결과 보기':'다음 문제 →';}$('next').onclick=()=>{if(i<qs.length-1){i++;draw()}else{$('count').textContent='RESULT';$('q').textContent=qs.length+'문제 중 '+score+'문제 정답';$('opts').innerHTML='<a href="/lars-mittank.html">다큐 다시 보기</a> · <a href="/maze17.html">미궁 PART 17</a>';$('fb').textContent='확인된 사실과 미확인 가설을 분리하는 것이 좋은 추리의 출발점입니다.';$('fb').classList.add('show');$('next').hidden=true;}};draw();</script></body></html>
