<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 009 추리 퀴즈 · 브리아나 메이틀랜드 | 셈플리</title><meta name="description" content="FBI와 버몬트 주경찰 공개 자료, 2024년 Vermont Public 보도를 바탕으로 브리아나 메이틀랜드 실종 사건의 사실과 수사 평가를 구분하는 8문제 퀴즈."><link rel="canonical" href="https://dontime.kr/deduction-maitland.html"><style>body{margin:0;background:#09151e;color:#edf2f3;font:15px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 18px 70px}.nav{display:flex;justify-content:space-between}.nav a{color:#e5bd82;text-decoration:none;font-weight:900}.card{background:#132530;border:1px solid #3b5663;border-radius:16px;padding:22px;margin:18px 0}.eyebrow{font:900 10px monospace;color:#e5bd82;letter-spacing:.16em}h1{font-size:clamp(30px,6vw,45px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #405965;border-radius:10px;background:#0b1b26;color:#edf2f3;font:inherit;cursor:pointer}.opts button:disabled{cursor:default}.feedback{display:none;background:#1c343f;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#e5bd82;color:#14232b;border:0;border-radius:9px;padding:12px 17px;font-weight:900}.muted{color:#b2c1c7}</style></head><body><main class="wrap"><header class="nav"><a href="/">셈플리</a><a href="/brianna-maitland.html">CASE 009 다큐</a></header><section class="card"><div class="eyebrow">CASE 009 · EVIDENCE-BASED QUIZ</div><h1>마지막 교대의 기록을 읽다</h1><p class="muted">FBI 공개 실종자 자료, 2024년 FBI·버몬트 주경찰 발표와 Vermont Public 보도를 바탕으로 구성했습니다. 공개된 사실과 수사기관의 평가, 확인되지 않은 내용을 구분해 보세요.</p></section><section class="card"><div class="eyebrow" id="count"></div><p class="question" id="q"></p><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button id="next" hidden>다음 문제 →</button></section><section class="card"><h2>더 살펴보기</h2><p><a href="/maze13.html" style="color:#e5bd82">미궁 PART 13 · 마지막 교대의 기록실</a></p><p><a href="/mystery.html" style="color:#e5bd82">해외 미제사건 목록</a></p></section></main><script>const qs=[{"q":"브리아나 메이틀랜드가 마지막으로 목격된 날짜는?","o":["2002년 3월 19일","2004년 3월 19일","2006년 3월 19일","2008년 3월 19일"],"a":1,"e":"FBI 공개 실종자 페이지는 마지막 목격일을 2004년 3월 19일로 기록합니다."},{"q":"실종 당시 브리아나의 나이는?","o":["15세","16세","17세","19세"],"a":2,"e":"FBI 공개 자료는 실종 당시 나이를 17세로 기록합니다."},{"q":"브리아나가 마지막으로 근무를 마친 장소는?","o":["Black Lantern Inn","Montgomery High School","Burlington Airport","Vermont State Police Station"],"a":0,"e":"FBI는 버몬트주 몽고메리의 식당 Black Lantern Inn에서 근무를 마친 뒤 마지막으로 목격됐다고 설명합니다."},{"q":"FBI 공개 자료에 기록된 차량은?","o":["1985년형 녹색 Oldsmobile 88","1995년형 흰색 Ford Taurus","1985년형 검은색 Chevrolet Caprice","1975년형 파란색 Buick LeSabre"],"a":0,"e":"FBI는 브리아나가 녹색 1985년형 Oldsmobile 88을 타고 떠났다고 기록합니다."},{"q":"차량은 어디에서 발견됐는가?","o":["식당 주차장","학교 운동장","식당에서 약 1마일 떨어진 버려진 헛간 측면","주 경찰서 앞"],"a":2,"e":"FBI는 차량이 식당에서 약 1마일 떨어진 버려진 헛간 측면에 후진한 상태로 발견됐다고 설명합니다."},{"q":"2022년 DNA 관련 확인에 대해 2024년 수사기관이 설명한 내용은?","o":["DNA가 특정 용의자를 확정했다","표본의 출처는 확인됐지만 용의자 특정으로 이어지지 않았고 사건과 관련 없는 것으로 배제했다","DNA 분석으로 실종 장소가 확정됐다","DNA 결과가 공개되며 사건이 종결됐다"],"a":1,"e":"Vermont Public은 수사기관이 표본 출처를 확인했지만 용의자를 찾지 못했고, 해당 출처를 사건과 관련 없는 것으로 배제했다고 보도했습니다."},{"q":"2024년 버몬트 주경찰 지휘부가 사건 상태를 설명한 표현과 가장 가까운 것은?","o":["미해결 상태이며 수사를 계속하는 사건","이미 해결되어 기록만 남은 사건","실종 신고가 취소된 사건","수사가 공식 종료된 사건"],"a":0,"e":"2024년 FBI 발표에서 버몬트 주경찰 책임자는 이 사건이 미해결이지만 수사를 계속하는 사건이라고 설명했습니다."},{"q":"FBI가 2024년 발표한 보상금의 최대 금액은?","o":["1만 달러","2만 달러","4만 달러","10만 달러"],"a":2,"e":"FBI Albany는 2024년 3월 19일 브리아나의 행방을 찾는 데 도움이 되는 정보에 최대 4만 달러를 안내했습니다."}];let i=0,score=0,done=false;const $=x=>document.getElementById(x);function draw(){done=false;$('count').textContent='QUESTION '+(i+1)+' / '+qs.length;$('q').textContent=qs[i].q;$('opts').innerHTML=qs[i].o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$('fb').className='feedback';$('fb').textContent='';$('next').hidden=true;$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.n));}function answer(n){if(done)return;done=true;let x=qs[i];if(n===x.a)score++;$('opts').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#4c8b67';if(j===n&&n!==x.a)b.style.borderColor='#b66b61'});$('fb').textContent=(n===x.a?'정답! ':'정답은 '+x.o[x.a]+'. ')+x.e;$('fb').classList.add('show');$('next').hidden=false;$('next').textContent=i===qs.length-1?'결과 보기':'다음 문제 →';}$('next').onclick=()=>{if(i<qs.length-1){i++;draw()}else{$('count').textContent='RESULT';$('q').textContent=qs.length+'문제 중 '+score+'문제 정답';$('opts').innerHTML='<a href="/brianna-maitland.html">다큐 다시 보기</a> · <a href="/maze13.html">연결 미궁</a>';$('fb').textContent='기록에 남은 사실과 그 사실로부터 가능한 추론을 구분하는 것이 좋은 추리의 출발점입니다.';$('fb').classList.add('show');$('next').hidden=true;}};draw();</script></body></html>
