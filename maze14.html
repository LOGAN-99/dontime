<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PART 14. 북쪽 등대의 기록실. 시간표와 관측, 출처와 추정의 경계를 확인하는 14개 논리 퍼즐."><link rel="canonical" href="https://dontime.kr/maze14.html"><meta property="og:title" content="미궁 PART 14 · 북쪽 등대의 기록실 | 셈플리"><meta property="og:description" content="가상의 등대 기록관에서 시간·관측·출처를 검증하는 14개 논리 퍼즐."><title>미궁 PART 14 · 북쪽 등대의 기록실 | 셈플리</title><style>*{box-sizing:border-box}body{margin:0;background:#07131d;color:#edf2f3;font-family:Arial,'Noto Sans KR',sans-serif;line-height:1.75}.wrap{max-width:900px;margin:auto;padding:22px 18px 70px}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:#e5bd82;text-decoration:none;font-weight:900}.hero,.card{border:1px solid #3a5664;background:#12232f;border-radius:18px;padding:23px;margin:18px 0}.hero{background:linear-gradient(120deg,rgba(5,15,23,.96),rgba(7,22,31,.58)),url('/assets/flannan-isles-storm.svg') center/cover}.eyebrow{font:900 10px monospace;letter-spacing:.17em;color:#e5bd82}.title{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:8px 0}.muted{color:#b3c2c8}.meter{display:flex;justify-content:space-between;gap:12px;color:#b3c2c8;font-size:12px;font-weight:800}.progress{height:7px;background:#2b404c;border-radius:10px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:#d6b17e;transition:width .2s}.story{font-size:15px;color:#dce5e7;min-height:90px}.question{font-size:19px;font-weight:900;margin:14px 0}.options{display:grid;gap:9px}.options button{background:#0b1b26;border:1px solid #405b68;color:#edf2f3;text-align:left;padding:13px 15px;border-radius:11px;font-size:14px;cursor:pointer}.options button:disabled{opacity:.9;cursor:default}.feedback{display:none;background:#203744;border-radius:10px;padding:14px;margin-top:14px;color:#e0e8e9}.feedback.show{display:block}#next{margin-top:15px;border:0;background:#e5bd82;color:#172630;border-radius:9px;padding:11px 18px;font-weight:900;cursor:pointer}.note{font-size:12px;color:#9fb1b9}</style></head><body><main class="wrap"><nav class="nav"><a href="/">셈플리</a><a href="/maze.html">미궁 목록</a></nav><header class="hero"><div class="eyebrow">PART 14 · THE NORTH LIGHT ARCHIVE</div><h1 class="title">북쪽 등대의 기록실</h1><p class="muted">가상의 해안 기록관에 남겨진 열네 개의 봉투. 시간표와 관측, 출처와 추정의 경계를 맞춰라.</p><p class="note">완전한 창작 미궁입니다. 실제 플래넌 제도 사건의 인물·증거·수사 장면을 재현하지 않습니다. 실제 사건의 원인을 맞히는 게임이 아닙니다.</p></header><section class="card"><div class="meter"><span id="label">CHAPTER 01 / 14</span><span id="score">정답 0개</span></div><div class="progress"><span id="bar"></span></div><h2 id="title" class="title" style="font-size:24px"></h2><p id="story" class="story"></p><p id="question" class="question"></p><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" hidden>다음 장면 →</button></section></main><script>
const chapters=[{"title":"첫 번째 교대표","story":"가상의 북쪽 등대 기록관에 06:10, 06:35, 07:05가 적힌 교대표 세 장이 놓였다. 기록관장은 가장 이른 시각부터 정리하라고 했다.","q":"올바른 시간 순서는?","o":["07:05 → 06:10 → 06:35","06:10 → 06:35 → 07:05","06:35 → 07:05 → 06:10","06:10 → 07:05 → 06:35"],"a":1,"e":"시각을 오름차순으로 배열하면 06:10, 06:35, 07:05입니다."},{"title":"두 개의 원본","story":"서랍에는 같은 기록의 복사본 두 장이 있다. 문서번호와 본문, 원본 해시가 모두 같다.","q":"독립된 기록 출처의 수로 가장 타당한 것은?","o":["1개","2개","3개","확인할 수 없이 0개"],"a":0,"e":"동일한 원본을 복사한 두 장은 독립된 출처 두 개가 아니라 하나의 출처를 복제한 것입니다."},{"title":"시계의 차이","story":"벽시계는 실제보다 4분 빠르다. 벽시계에 09:18이라고 표시됐다.","q":"보정한 실제 시각은?","o":["09:14","09:18","09:22","09:24"],"a":0,"e":"시계가 4분 빠르므로 표시 시각에서 4분을 빼면 09:14입니다."},{"title":"신호의 방향","story":"가상의 등대 기록에는 신호등이 서쪽을 향해 270도를 가리켰다고 적혀 있다. 방위각은 북쪽 0도에서 시계 방향으로 잰다.","q":"270도가 가리키는 방향은?","o":["동쪽","남쪽","서쪽","북쪽"],"a":2,"e":"북쪽 0도, 동쪽 90도, 남쪽 180도, 서쪽 270도입니다."},{"title":"기압계의 단위","story":"관측표의 기압 값은 1008 hPa로 기록되어 있다. 담당자는 단위를 그대로 보존하라고 했다.","q":"hPa가 나타내는 물리량은?","o":["기압","기온","풍속","강수량"],"a":0,"e":"hPa는 헥토파스칼로 기압을 나타내는 단위입니다."},{"title":"바다의 거리","story":"가상의 항로 지도에서 두 부표 사이의 거리는 4해리다. 1해리는 1.852km로 계산한다.","q":"두 부표 사이의 거리는?","o":["5.408km","6.852km","7.408km","8.524km"],"a":2,"e":"4 × 1.852km = 7.408km입니다."},{"title":"풍향의 읽기","story":"관측 기록에 풍향이 북서풍이라고 적혀 있다. 풍향은 바람이 불어오는 방향을 기준으로 한다.","q":"북서풍은 어느 방향에서 불어오는가?","o":["북동쪽","남동쪽","남서쪽","북서쪽"],"a":3,"e":"풍향은 바람이 불어오는 방향이므로 북서풍은 북서쪽에서 불어옵니다."},{"title":"봉인의 번호","story":"보관함의 봉인 번호는 7314다. 인수 대장에는 7314가 한 번 기록되어 있고 봉인은 온전하다.","q":"가장 먼저 대조할 자료는?","o":["인수 대장의 작성자·시각과 실제 봉인 상태","보관함을 열어 내용을 추측한 메모","번호가 익숙하다는 이유로 폐기한 기록","다른 보관함의 번호를 임의로 옮긴 표"],"a":0,"e":"번호와 인수 시각, 작성자, 봉인 상태를 함께 확인해야 같은 자료의 인계가 이어졌는지 검토할 수 있습니다."},{"title":"누락된 한 줄","story":"일지에는 11:00과 11:40이 적혀 있지만 그 사이 한 줄이 비어 있다. 다른 사본이나 보충 메모는 아직 발견되지 않았다.","q":"가장 정확한 기록 방법은?","o":["11:20이라고 임의로 채운다","누락으로 표시하고 원본·사본을 추가 확인한다","누군가 조작했다고 단정한다","앞뒤 기록을 모두 삭제한다"],"a":1,"e":"빈칸은 누락이 있다는 사실만 보여줍니다. 내용을 임의로 보충하거나 원인을 단정하지 말고 다른 자료를 확인해야 합니다."},{"title":"관측과 해석","story":"메모에는 '관측자가 붉은 빛을 보았다고 말했다'고 적혀 있다. 사진이나 계측 자료는 첨부되지 않았다.","q":"이 메모가 직접 입증하는 것은?","o":["붉은 빛의 정체","관측자가 그렇게 말했다고 기록된 사실","빛이 실제로 발생한 위치","빛을 만든 장치의 종류"],"a":1,"e":"메모는 발언이 기록됐다는 점을 보여줄 뿐, 발언 대상의 실재나 정체를 직접 입증하지는 않습니다."},{"title":"독립된 확인","story":"한 보고서는 관측자 A의 진술을 인용했다. 두 번째 문서는 같은 진술을 다시 옮겼지만 새로운 관측은 포함하지 않았다.","q":"두 문서가 독립된 관측 두 건이 되는가?","o":["그렇다. 문서가 두 장이기 때문이다","그렇다. 작성 날짜가 다르기 때문이다","아니다. 같은 진술을 반복 인용했기 때문이다","아니다. 기록은 증거가 될 수 없기 때문이다"],"a":2,"e":"같은 원천 진술을 반복 인용한 문서는 독립된 관측을 추가하지 않습니다."},{"title":"추정의 범위","story":"기록관은 젖은 바닥과 열려 있는 문을 발견했다. 누가 문을 열었는지, 언제 바닥이 젖었는지는 기록되어 있지 않다.","q":"현재 자료로 확정할 수 있는 것은?","o":["특정인이 문을 열었다","비가 내린 직후였다","바닥이 젖어 있고 문이 열려 있었다","누군가 물을 쏟았다"],"a":2,"e":"관찰된 상태는 확정할 수 있지만, 원인과 행위자, 발생 시각은 추가 자료가 필요합니다."},{"title":"최종 보고서","story":"보고서 초안에는 사실, 추론, 미확인 질문이 한 문단에 섞여 있다. 최종 검토자는 독자가 증거의 수준을 구분할 수 있어야 한다고 말했다.","q":"가장 적절한 편집 원칙은?","o":["모든 문장을 확정된 사실로 바꾼다","사실·추론·미확인을 별도 항목으로 구분한다","흥미로운 가설을 앞에 두고 출처를 생략한다","자료가 부족한 항목을 삭제하고 존재를 숨긴다"],"a":1,"e":"정보의 종류와 근거 수준을 나눠 표시해야 독자가 사실과 설명 후보를 혼동하지 않습니다."},{"title":"마지막 봉투","story":"기록관장은 마지막 봉투에 '모르는 것은 모른다고 적을 것'이라는 규칙을 붙였다. 확인되지 않은 마지막 장면을 묻는 질문이 남아 있다.","q":"증거가 충분하지 않을 때 가장 정확한 결론은?","o":["가장 극적인 가설을 사실로 확정한다","빈칸을 임의로 채워 완성한다","현재 자료로는 결론을 확정할 수 없다고 기록한다","다른 사건의 사례를 그대로 적용한다"],"a":2,"e":"자료가 답하지 못하는 부분은 미확인으로 남겨야 합니다. 불확실성을 정확히 표시하는 것도 기록의 완성입니다."}];
let at=0,score=0,locked=false;const $=id=>document.getElementById(id);
function render(){locked=false;const x=chapters[at];$("label").textContent="CHAPTER "+String(at+1).padStart(2,"0")+" / "+chapters.length;$("score").textContent="정답 "+score+"개";$("bar").style.width=(at/chapters.length*100)+"%";$("title").textContent=x.title;$("story").textContent=x.story;$("question").textContent=x.q;$("options").innerHTML=x.o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$("feedback").className="feedback";$("feedback").textContent="";$("next").hidden=true;$("options").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(+b.dataset.n))}
function answer(n){if(locked)return;locked=true;const x=chapters[at];if(n===x.a)score++;[...$("options").children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#8bc5b6";if(j===n&&n!==x.a)b.style.borderColor="#c37d74"});$("feedback").textContent=(n===x.a?"기록이 맞아떨어졌습니다. ":"다른 단서를 다시 살펴보세요. ")+x.e;$("feedback").classList.add("show");$("score").textContent="정답 "+score+"개";$("next").hidden=false;$("next").textContent=at===chapters.length-1?"기록실 최종 확인":"다음 장면 →"}
$("next").onclick=()=>{if(at<chapters.length-1){at++;render()}else{$("label").textContent="ARCHIVE COMPLETE";$("title").textContent="기록관의 마지막 등불";$("story").textContent="기록관장은 확인된 사실을 사실란에, 설명 후보를 추론란에, 아직 확인되지 않은 내용은 빈칸 그대로 남겼다. 등대의 불빛은 다시 켜졌고 기록실의 문도 열렸다.";$("question").textContent=chapters.length+"개 퍼즐 중 "+score+"개 정답";$("options").innerHTML='<a href="/flannan-isles.html" style="color:#e5bd82">CASE 010 다큐 보기</a> · <a href="/maze.html" style="color:#e5bd82">미궁 목록으로</a>';$("feedback").textContent="모르는 것을 모른다고 기록하는 일도 정확한 결론의 일부입니다.";$("feedback").classList.add("show");$("next").hidden=true;$("bar").style.width="100%"}};
render();
</script></body></html>
