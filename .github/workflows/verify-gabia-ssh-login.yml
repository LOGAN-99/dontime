name: Verify Gabia SSH login (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssh-login:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify ED25519 host key and run read-only check
        shell: bash
        env:
          GABIA_USER: ${{ secrets.GABIA_USER }}
          GABIA_PASSWORD: ${{ secrets.GABIA_PASSWORD }}
        run: |
          set -euo pipefail
          expected_fingerprint='SHA256:wtOgKJNn+22CUfFqM4UBKKgGfK0Ji1d3y6je4Eiz0RE'
          mkdir -p "$RUNNER_TEMP/gabia-ssh"
          chmod 700 "$RUNNER_TEMP/gabia-ssh"
          ssh-keyscan -T 10 -t ed25519 -p 22 211.47.74.75 > "$RUNNER_TEMP/gabia-ssh/known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/gabia-ssh/known_hosts" -E sha256 | awk '{print $2; exit}')"
          echo "Expected ED25519 fingerprint: $expected_fingerprint"
          echo "Observed ED25519 fingerprint: $actual_fingerprint"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::ED25519 fingerprint mismatch. Stopping without login."
            exit 1
          fi
          if [ -z "$GABIA_USER" ] || [ -z "$GABIA_PASSWORD" ]; then
            echo "::error::Required GitHub Actions secrets are missing."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$GABIA_PASSWORD"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o LogLevel=ERROR \
            -o ConnectTimeout=10 \
            -p 22 "$GABIA_USER@211.47.74.75" \
            'printf "SSH login successful.\n"; printf "Home directory: "; pwd; printf "\nWeb root listing (/www_root):\n"; ls -la /www_root; printf "\nRead-only check complete. No files were changed.\n"'
