name: Deploy index.html to Gabia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"

permissions:
  contents: read

concurrency:
  group: gabia-production-deploy
  cancel-in-progress: false

jobs:
  deploy-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Static HTML security and syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="topMarquee"' index.html
          if grep -q 'function renderHistoryExplorer' index.html; then
            echo '::error::History explorer must stay out of the main Sempli homepage.'
            exit 1
          fi
          if grep -Eiq 'eval[[:space:]]*\(|new[[:space:]]+Function|document[.]write[[:space:]]*\(' index.html; then
            echo "::error::Potentially unsafe dynamic-code pattern found."
            exit 1
          fi
          python3 - <<'PY'
          from html.parser import HTMLParser
          class InlineScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.capture = not attrs.get("src") and attrs.get("type", "").lower() != "application/ld+json"
                      self.current = []
              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.capture:
                      self.parts.append("".join(self.current))
                      self.capture = False
          parser = InlineScriptExtractor()
          with open("index.html", encoding="utf-8") as f:
              parser.feed(f.read())
          with open("/tmp/dontime-inline.js", "w", encoding="utf-8") as f:
              f.write("".join(parser.parts))
          if not parser.parts:
              raise SystemExit("No inline application scripts were found.")
          PY
          node --check /tmp/dontime-inline.js
          echo "Static checks and inline JavaScript syntax check passed."

      - name: Verify SSH host key and create backup
        shell: bash
        env:
          GABIA_USER: ${{ secrets.GABIA_USER }}
          GABIA_PASSWORD: ${{ secrets.GABIA_PASSWORD }}
        run: |
          set -euo pipefail
          expected_fingerprint='SHA256:wtOgKJNn+22CUfFqM4UBKKgGfK0Ji1d3y6je4Eiz0RE'
          host='211.47.74.75'
          mkdir -p "$RUNNER_TEMP/gabia-ssh"
          chmod 700 "$RUNNER_TEMP/gabia-ssh"
          ssh-keyscan -T 10 -t ed25519 -p 22 "$host" > "$RUNNER_TEMP/gabia-ssh/known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/gabia-ssh/known_hosts" -E sha256 | awk '{print $2; exit}')"
          echo "Expected ED25519 fingerprint: $expected_fingerprint"
          echo "Observed ED25519 fingerprint: $actual_fingerprint"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::ED25519 fingerprint mismatch. No server changes were made."
            exit 1
          fi
          if [ -z "$GABIA_USER" ] || [ -z "$GABIA_PASSWORD" ]; then
            echo "::error::Required GitHub Actions secrets are missing."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$GABIA_PASSWORD"
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o LogLevel=ERROR -o ConnectTimeout=10 -p 22)
          sshpass -e ssh "${ssh_opts[@]}" "$GABIA_USER@$host" '
            set -eu
            test -f /www_root/index.html
            backup_dir="/tmp/dontime-deploy-backups"
            stage_dir="/tmp/dontime-deploy-upload"
            mkdir -p "$backup_dir" "$stage_dir"
            chmod 700 "$backup_dir" "$stage_dir"
            stamp="$(date +%Y%m%d-%H%M%S)"
            for file in index.html about.html calculator-data.json calculator.php calendar.php contact.html privacy.html terms.html robots.txt sitemap.xml; do
              if [ -f "/www_root/$file" ]; then cp -p "/www_root/$file" "$backup_dir/$file.$stamp.bak"; fi
            done
            if [ -f /www_root/.htaccess ]; then cp -p /www_root/.htaccess "$backup_dir/htaccess.$stamp.bak"; fi
            printf "Production files backed up before deployment. Backup directory: %s\n" "$backup_dir"
          '
      - name: Upload candidate to temporary staging
        shell: bash
        env:
          GABIA_USER: ${{ secrets.GABIA_USER }}
          GABIA_PASSWORD: ${{ secrets.GABIA_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$GABIA_PASSWORD"
          sshpass -e scp -P 22 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o LogLevel=ERROR index.html about.html calculator-data.json calculator.php calendar.php contact.html privacy.html terms.html robots.txt sitemap.xml "$GABIA_USER@211.47.74.75:/tmp/dontime-deploy-upload/"
          sshpass -e scp -P 22 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o LogLevel=ERROR security-headers.fragment "$GABIA_USER@211.47.74.75:/tmp/dontime-deploy-upload/security-headers.fragment"

      - name: Validate staged file and atomically replace homepage
        shell: bash
        env:
          GABIA_USER: ${{ secrets.GABIA_USER }}
          GABIA_PASSWORD: ${{ secrets.GABIA_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$GABIA_PASSWORD"
          sshpass -e ssh -p 22 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o LogLevel=ERROR "$GABIA_USER@211.47.74.75" '
            set -eu
            stage="/tmp/dontime-deploy-upload"
            candidate="$stage/index.html"
            header_fragment="$stage/security-headers.fragment"
            test -s "$candidate"
            test -s "$header_fragment"
            grep -q "function setSeasonalTheme" "$candidate"
            grep -q "setSeasonalTheme();" "$candidate"
            grep -q "id=\"topMarqueeTrack1\"" "$candidate"
            grep -q "function escapeHTML" "$candidate"
            grep -q "BEGIN SEMPLI SECURITY HEADERS" "$header_fragment"
            if grep -q "계절 테마" "$candidate"; then
              echo "Seasonal theme label unexpectedly remains in candidate; stopping."
              exit 1
            fi
            for file in index.html about.html calculator-data.json calculator.php calendar.php contact.html privacy.html terms.html robots.txt sitemap.xml; do
              test -s "$stage/$file"
            done
            if [ -f /www_root/.htaccess ]; then
              cp -p /www_root/.htaccess /www_root/.htaccess.new
            else
              : > /www_root/.htaccess.new
              chmod 644 /www_root/.htaccess.new
            fi
            if ! grep -q "BEGIN SEMPLI SECURITY HEADERS" /www_root/.htaccess.new; then
              cat "$header_fragment" >> /www_root/.htaccess.new
            fi
            mv -f /www_root/.htaccess.new /www_root/.htaccess
            for file in index.html about.html calculator-data.json calculator.php calendar.php contact.html privacy.html terms.html robots.txt sitemap.xml; do
              dest="/www_root/$file"
              if [ -f "$dest" ]; then mode="$(stat -c %a "$dest")"; else mode=644; fi
              cp "$stage/$file" "$dest.new"
              chmod "$mode" "$dest.new"
              mv -f "$dest.new" "$dest"
            done
            grep -q "setSeasonalTheme();" /www_root/index.html
            grep -q "BEGIN SEMPLI SECURITY HEADERS" /www_root/.htaccess
            for file in index.html about.html calculator-data.json calculator.php calendar.php contact.html privacy.html terms.html robots.txt sitemap.xml; do cmp -s "$stage/$file" "/www_root/$file"; done
            printf "Deployment successful. All public site files and security headers updated; backups retained in /tmp/dontime-deploy-backups.\n"
          '

      - name: Verify public homepage response
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/homepage.html"
          headers="$RUNNER_TEMP/homepage-headers.txt"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location --max-time 20 -D "$headers" https://dontime.kr/ -o "$response"; then
              break
            fi
            sleep 3
          done
          grep -q "셈플리" "$response"
          grep -q "setSeasonalTheme" "$response"
          grep -q \"topMarqueeTrack1\" \"$response\"
          grep -q \"topMarqueeViewport\" \"$response\"
          grep -q 'aria-label="미궁"' "$response"
          grep -q "function escapeHTML" "$response"
          grep -q "marquee-story-maze-v21" "$response"
          grep -q "ca-pub-3220276859043248" "$response"
          for header in strict-transport-security content-security-policy-report-only x-content-type-options x-frame-options referrer-policy permissions-policy; do
            grep -iq "^$header:" "$headers"
            echo "Homepage security header verified: $header"
          done
          for page in "/calculator.php?tool=income" "/calendar.php?year=2026&month=10" "/privacy.html" "/terms.html" "/about.html" "/contact.html"; do
            page_headers="$RUNNER_TEMP/page-headers.txt"
            page_body="$RUNNER_TEMP/page-body.html"
            echo "Checking public route: $page"
            status="$(curl --silent --show-error --location --max-time 20 -D "$page_headers" -o "$page_body" -w "%{http_code}" "https://dontime.kr$page" || true)"
            echo "Public route HTTP status: $status"
            if [ "$status" = "200" ]; then
              for header in strict-transport-security content-security-policy-report-only x-content-type-options x-frame-options referrer-policy permissions-policy; do
                grep -iq "^$header:" "$page_headers"
              done
              echo "Six security headers verified: $page"
            else
              echo "Route not HTTP 200; security headers for this route were not certified."
            fi
          done
          probe="$RUNNER_TEMP/xss-probe.html"
          probe_status="$(curl --silent --show-error --location --max-time 20 -o "$probe" -w "%{http_code}" "https://dontime.kr/calculator.php?tool=%3Cscript%3Ealert%281%29%3C%2Fscript%3E" || true)"
          case "$probe_status" in 200|400|403|404) ;; *) echo "::error::Unexpected response to calculator parameter security probe: $probe_status"; exit 1 ;; esac
          if grep -Fqi '<script>alert(1)</script>' "$probe"; then
            echo "::error::Calculator endpoint reflected an executable script payload."
            exit 1
          fi
          calendar_probe="$RUNNER_TEMP/calendar-xss-probe.html"
          calendar_status="$(curl --silent --show-error --location --max-time 20 -o "$calendar_probe" -w "%{http_code}" "https://dontime.kr/calendar.php?year=%3Cscript%3Ealert%281%29%3C%2Fscript%3E&month=10" || true)"
          case "$calendar_status" in 200|400|403|404) ;; *) echo "::error::Unexpected response to calendar parameter security probe: $calendar_status"; exit 1 ;; esac
          if grep -Fqi '<script>alert(1)</script>' "$calendar_probe"; then
            echo "::error::Calendar endpoint reflected an executable script payload."
            exit 1
          fi
          echo "Live reflected-XSS smoke probes passed for calculator.php and calendar.php."
          echo "Public homepage returned HTTP success and contains the deployed single-row continuously animated marquee and DOM safety code."
