name: Deploy index.html to Gabia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"

permissions:
  contents: read

concurrency:
  group: gabia-production-deploy
  cancel-in-progress: false

jobs:
  deploy-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Static HTML security and syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="topMarquee"' index.html
          if grep -q 'function renderHistoryExplorer' index.html; then
            echo '::error::History explorer must stay out of the main Sempli homepage.'
            exit 1
          fi
          if grep -Eiq 'eval[[:space:]]*\(|new[[:space:]]+Function|document[.]write[[:space:]]*\(' index.html; then
            echo "::error::Potentially unsafe dynamic-code pattern found."
            exit 1
          fi
          python3 - <<'PY'
          from html.parser import HTMLParser
          class InlineScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.capture = not attrs.get("src") and attrs.get("type", "").lower() != "application/ld+json"
                      self.current = []
              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.capture:
                      self.parts.append("".join(self.current))
                      self.capture = False
          parser = InlineScriptExtractor()
          with open("index.html", encoding="utf-8") as f:
              parser.feed(f.read())
          with open("/tmp/dontime-inline.js", "w", encoding="utf-8") as f:
              f.write("".join(parser.parts))
          if not parser.parts:
              raise SystemExit("No inline application scripts were found.")
          PY
          node --check /tmp/dontime-inline.js
          echo "Static checks and inline JavaScript syntax check passed."

      - name: Verify SSH host key and create backup
        shell: bash
        env:
          GABIA_USER: ${{ secrets.GABIA_USER }}
          GABIA_PASSWORD: ${{ secrets.GABIA_PASSWORD }}
        run: |
          set -euo pipefail
          expected_fingerprint='SHA256:wtOgKJNn+22CUfFqM4UBKKgGfK0Ji1d3y6je4Eiz0RE'
          host='211.47.74.75'
          mkdir -p "$RUNNER_TEMP/gabia-ssh"
          chmod 700 "$RUNNER_TEMP/gabia-ssh"
          ssh-keyscan -T 10 -t ed25519 -p 22 "$host" > "$RUNNER_TEMP/gabia-ssh/known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/gabia-ssh/known_hosts" -E sha256 | awk '{print $2; exit}')"
          echo "Expected ED25519 fingerprint: $expected_fingerprint"
          echo "Observed ED25519 fingerprint: $actual_fingerprint"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::ED25519 fingerprint mismatch. No server changes were made."
            exit 1
          fi
          if [ -z "$GABIA_USER" ] || [ -z "$GABIA_PASSWORD" ]; then
            echo "::error::Required GitHub Actions secrets are missing."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$GABIA_PASSWORD"
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o LogLevel=ERROR -o ConnectTimeout=10 -p 22)
          sshpass -e ssh "${ssh_opts[@]}" "$GABIA_USER@$host" '
            set -eu
            test -f /www_root/index.html
            backup_dir="/tmp/dontime-deploy-backups"
            stage_dir="/tmp/dontime-deploy-upload"
            mkdir -p "$backup_dir" "$stage_dir"
            chmod 700 "$backup_dir" "$stage_dir"
            stamp="$(date +%Y%m%d-%H%M%S)"
            cp -p /www_root/index.html "$backup_dir/index.html.$stamp.bak"
            printf "Backup created in temporary directory: %s/index.html.%s.bak\n" "$backup_dir" "$stamp"
            printf "Production index.html backed up. No production file has been replaced yet.\n"
          '
      - name: Upload candidate to temporary staging
        shell: bash
        env:
          GABIA_USER: ${{ secrets.GABIA_USER }}
          GABIA_PASSWORD: ${{ secrets.GABIA_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$GABIA_PASSWORD"
          sshpass -e scp -P 22 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o LogLevel=ERROR index.html "$GABIA_USER@211.47.74.75:/tmp/dontime-deploy-upload/index.html.new"

      - name: Validate staged file and atomically replace homepage
        shell: bash
        env:
          GABIA_USER: ${{ secrets.GABIA_USER }}
          GABIA_PASSWORD: ${{ secrets.GABIA_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$GABIA_PASSWORD"
          sshpass -e ssh -p 22 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/gabia-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o LogLevel=ERROR "$GABIA_USER@211.47.74.75" '
            set -eu
            candidate="/tmp/dontime-deploy-upload/index.html.new"
            test -s "$candidate"
            grep -q "function setSeasonalTheme" "$candidate"
            grep -q "setSeasonalTheme();" "$candidate"
            grep -q "id=\"topMarqueeToggle\"" "$candidate"
            if grep -q "계절 테마" "$candidate"; then
              echo "Seasonal theme label unexpectedly remains in candidate; stopping."
              exit 1
            fi
            current_mode="$(stat -c %a /www_root/index.html)"
            cp -p "$candidate" /www_root/index.html.new
            chmod "$current_mode" /www_root/index.html.new
            mv -f /www_root/index.html.new /www_root/index.html
            grep -q "setSeasonalTheme();" /www_root/index.html
            cmp -s "$candidate" /www_root/index.html
            printf "Deployment successful. index.html replaced; backup retained in /tmp/dontime-deploy-backups.\n"
          '

      - name: Verify public homepage response
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/homepage.html"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location --max-time 20 https://dontime.kr/ -o "$response"; then
              break
            fi
            sleep 3
          done
          grep -q "셈플리" "$response"
          grep -q "setSeasonalTheme" "$response"
          grep -q "topMarqueeToggle" "$response"
          grep -q "ca-pub-3220276859043248" "$response"
          if grep -q "계절 테마" "$response"; then
            echo "Warning: public response may be cached or old."
          fi
          echo "Public homepage returned HTTP success and contains the new theme code."
