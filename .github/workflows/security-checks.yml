name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli
          php -l calculator.php
          php -l calendar.php
      - name: Check header configuration
        run: |
          set -eu
          grep -q 'Strict-Transport-Security' security-headers.fragment
          grep -q 'X-Content-Type-Options' security-headers.fragment
          grep -q 'X-Frame-Options' security-headers.fragment
          grep -q 'Referrer-Policy' security-headers.fragment
          grep -q 'Permissions-Policy' security-headers.fragment
          grep -q "object-src 'none'" security-headers.fragment
          grep -q "base-uri 'self'" security-headers.fragment
          echo 'Header directives are present. CSP remains report-only until separately tested.'
