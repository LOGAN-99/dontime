<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 008 추리 퀴즈 · 아샤 디그리 실종 사건 | 셈플리</title><meta name="description" content="FBI 공개 기록과 2026년 지역 보도를 바탕으로 아샤 디그리 실종 사건의 사실과 수사 단서를 구분하는 8문제 추리 퀴즈."><link rel="canonical" href="https://dontime.kr/deduction-asha.html"><style>body{margin:0;background:#09151e;color:#edf2f3;font:15px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 18px 70px}.nav{display:flex;justify-content:space-between}.nav a{color:#e5bd82;text-decoration:none;font-weight:900}.card{background:#132530;border:1px solid #3b5663;border-radius:16px;padding:22px;margin:18px 0}.eyebrow{font:900 10px monospace;color:#e5bd82;letter-spacing:.16em}h1{font-size:clamp(30px,6vw,45px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #405965;border-radius:10px;background:#0b1b26;color:#edf2f3;font:inherit;cursor:pointer}.opts button:disabled{cursor:default}.feedback{display:none;background:#1c343f;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#e5bd82;color:#14232b;border:0;border-radius:9px;padding:12px 17px;font-weight:900}.muted{color:#b2c1c7}</style></head><body><main class="wrap"><header class="nav"><a href="/">셈플리</a><a href="/asha-degree.html">CASE 008 다큐</a></header><section class="card"><div class="eyebrow">CASE 008 · EVIDENCE-BASED QUIZ</div><h1>기록과 추정을 구분하라</h1><p class="muted">FBI 공개 실종자 자료, FBI의 차량 제보 공지, 노스캐롤라이나 주지사실 발표와 2026년 지역 보도를 바탕으로 구성했습니다. 목격 보고와 수사 가설을 확정된 사실처럼 읽지 마세요.</p></section><section class="card"><div class="eyebrow" id="count"></div><p class="question" id="q"></p><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button id="next" hidden>다음 문제 →</button></section><section class="card"><h2>더 살펴보기</h2><p><a href="/maze12.html" style="color:#e5bd82">미궁 PART 12 · 18번 표식의 기록실</a></p><p><a href="/mystery.html" style="color:#e5bd82">해외 미제사건 목록</a></p></section></main><script>
const qs=[
{q:"아샤 디그리가 실종된 날짜는?",o:["1998년 2월 14일","2000년 2월 14일","2002년 2월 14일","2004년 2월 14일"],a:1,e:"FBI 공개 실종자 자료는 실종일을 2000년 2월 14일로 기록합니다."},
{q:"FBI 공개 자료에 따르면 가족이 아샤가 잠든 모습을 마지막으로 본 시각은?",o:["오전 12시 30분 무렵","오전 1시 30분 무렵","오전 2시 30분 무렵","오전 4시 30분 무렵"],a:2,e:"FBI 자료는 가족이 오전 2시 30분 무렵 침실에서 잠든 모습을 마지막으로 보았다고 기록합니다."},
{q:"운전자들이 아샤와 비슷한 소녀를 보았다고 보고한 시각과 장소는?",o:["오전 1시 무렵 셸비 시내","오전 4시 무렵 노스캐롤라이나 18번 도로","오전 6시 무렵 학교 운동장","오후 2시 무렵 버크 카운티"],a:1,e:"FBI 공개 자료는 오전 4시 무렵 셸비의 노스캐롤라이나 18번 도로에서 운전자들이 목격했다고 기록합니다. 목격 보고는 실종의 전체 경위를 확정하지 않습니다."},
{q:"부모가 아샤의 실종을 신고한 시각으로 FBI가 기록한 것은?",o:["오전 3시 30분까지","오전 5시까지","오전 6시 30분까지","오후 12시까지"],a:2,e:"FBI 공개 자료는 부모가 오전 6시 30분까지 실종을 신고했다고 기록합니다."},
{q:"아샤의 가방은 어디에서 발견됐는가?",o:["셸비의 집 안","버크 카운티의 노스캐롤라이나 18번 도로 인근","샬럿 공항 내부","학교 도서관 안"],a:1,e:"FBI 자료는 실종 후 1년 이상 지나 버크 카운티의 노스캐롤라이나 18번 도로 인근에서 가방이 발견됐다고 설명합니다."},
{q:"FBI가 공개한 가방 속 물품 설명과 일치하는 것은?",o:["학교 도서관에서 대출된 닥터 수스 책과 뉴 키즈 온 더 블록 티셔츠","운전면허증과 항공권","휴대전화와 카메라","현금과 지도"],a:0,e:"FBI는 가방에서 학교 도서관 대출 도서와 뉴 키즈 온 더 블록 티셔츠가 발견됐다고 설명합니다. 물품이 발견됐다는 사실만으로 가방을 그곳에 둔 사람을 알 수는 없습니다."},
{q:"FBI가 2016년 공개적으로 제보를 요청한 차량 설명은?",o:["흰색 1980년대형 밴","짙은 녹색 1970년대형 링컨 마크 IV 또는 포드 선더버드와 유사한 차량","빨간색 소형 해치백","검은색 오토바이"],a:1,e:"FBI는 짙은 녹색의 1970년대형 링컨 마크 IV 또는 포드 선더버드와 비슷한 차량에 관한 제보를 요청했습니다. 이는 확인을 위한 수사 단서입니다."},
{q:"2024~2025년 수색영장에 적힌 수사기관의 주장을 읽을 때 가장 정확한 원칙은?",o:["영장만으로 특정인의 유죄가 확정된다","영장에 적힌 모든 주장은 법원의 최종 판단이다","영장은 수사기관이 증거를 찾기 위해 제시한 주장과 근거이며 유죄 판결과 다르다","수색이 있었다면 사건의 원인이 밝혀진 것이다"],a:2,e:"수색영장은 조사와 증거 확보를 위한 법적 절차입니다. 영장 신청서의 주장과 수사 가설은 법원의 유죄 판단이 아니며, 2026년 2월 11일 기준 WBTV는 체포나 기소가 없었다고 보도했습니다."}
];
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);
function draw(){locked=false;const x=qs[i];$("count").textContent="QUESTION "+(i+1)+" / "+qs.length;$("q").textContent=x.q;$("opts").innerHTML=x.o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$("fb").className="feedback";$("fb").textContent="";$("next").hidden=true;$("opts").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(+b.dataset.n))}
function answer(n){if(locked)return;locked=true;const x=qs[i];if(n===x.a)score++;$("opts").querySelectorAll("button").forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#8bc6b5";if(j===n&&n!==x.a)b.style.borderColor="#c17d74"});$("fb").textContent=(n===x.a?"정답입니다. ":"정답은 "+x.o[x.a]+". ")+x.e;$("fb").classList.add("show");$("next").hidden=false;$("next").textContent=i===qs.length-1?"결과 보기":"다음 문제 →"}
$("next").onclick=()=>{if(i<qs.length-1){i++;draw()}else{$("count").textContent="RESULT";$("q").textContent=qs.length+"문제 중 "+score+"문제 정답";$("opts").innerHTML='<a href="/asha-degree.html" style="color:#e5bd82">다큐 다시 보기</a> · <a href="/maze12.html" style="color:#e5bd82">미궁 PART 12</a>';$("fb").textContent="목격 보고, 공개된 물품, 수사기관의 가설은 서로 다른 종류의 기록입니다. 확인되지 않은 부분을 빈칸으로 남기는 것도 정확한 추리의 일부입니다.";$("fb").classList.add("show");$("next").hidden=true}};
draw();
</script></body></html>
