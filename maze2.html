<main class="wrap"><aside class="side"><div class="kicker">MAZE · PART 02</div><h2>유리숲의<br>일곱 번째 종</h2><div class="progress"><span id="progress"></span></div><div class="chapters" id="chapterNav"></div></aside><section><div class="hero"><div class="kicker">미궁 시리즈 · 두 번째 이야기</div><h1>유리숲의<br>일곱 번째 종</h1><p>내일역에서 돌아온 뒤, 당신의 승차권에 없던 숲의 지도가 나타났다. 나뭇잎은 투명하고, 바람은 기억을 흔들며, 종소리는 들은 사람마다 다른 시간을 알려 준다. 열네 개의 문을 지나 일곱 번째 종이 울리지 않는 이유를 찾아라.</p></div><div class="ad-slot" aria-label="광고">광고</div><div id="host"></div><div class="ad-slot" aria-label="광고">광고</div></section></main>
<script>
const KEY='dontimeMazePart2Save';
const chapters=[{"title":"01 · 유리숲의 입구","place":"발자국이 빛나는 숲길","symbol":"🌲","story":"입구의 나무껍질에는 발자국 대신 숫자 네 개가 새겨져 있다. 2, 5, 9, 14. 마지막 숫자 옆에는 다섯 번째 자리를 긁어 낸 흔적이 있다. 숲지기는 그 숫자를 읽자마자 문을 잠갔다. “누군가 종탑으로 가는 길을 남겼군.”","q":"다음 자리에 들어갈 숫자는?","opts":["18","20","21"],"answer":1,"why":"숫자 사이의 차이는 +3, +4, +5로 커진다. 다음 차이는 +6이므로 14+6=20이다.","hint":""},{"title":"02 · 빛을 담는 우물","place":"별빛이 물속에 갇힌 우물","symbol":"✨","story":"우물 옆에는 ‘달빛’, ‘별빛’, ‘빈 병’이라고 적힌 유리병 세 개가 있다. 병의 라벨은 모두 틀렸다. ‘빈 병’이라고 적힌 병을 열자 달빛이 들어 있었다. 나머지 두 병을 열지 않고 별빛이 든 병을 찾아야 한다.","q":"별빛은 어느 라벨의 병에 들어 있나요?","opts":["달빛","별빛","빈 병"],"answer":0,"why":"‘빈 병’ 라벨에 달빛이 있으므로 그 라벨은 틀렸다는 조건과 맞는다. 남은 두 병 중 ‘별빛’ 라벨은 별빛이 아니어야 하므로 빈 병이고, 별빛은 ‘달빛’ 라벨에 있다.","hint":""},{"title":"03 · 세 개의 종탑","place":"소리가 그림자로 남는 언덕","symbol":"🔔","story":"종탑의 관리인은 세 종을 차례로 울렸다. 첫 종은 1번, 둘째는 2번, 셋째는 4번 울렸다. 기록에는 그날 네 번째 종이 울리기 직전에 누군가 종줄을 잘라 놓았다고 적혀 있다. 바닥에는 종을 울릴 횟수를 적던 분필 자국만 남아 있다.","q":"같은 방식으로 이어졌다면 네 번째 종은 몇 번 울려야 했나요?","opts":["6번","8번","10번"],"answer":1,"why":"각 종의 울림 횟수는 두 배로 늘어난다. 1, 2, 4 다음은 8이다.","hint":""},{"title":"04 · 거울의 갈림길","place":"서로를 비추는 유리벽","symbol":"🪞","story":"거울 복도에는 북쪽과 남쪽으로 향하는 문이 있다. 안내판에는 ‘출구는 북쪽이 아니다’라고 적혀 있다. 거울 속 안내자는 늘 거짓말을 하지만, 문 위의 글씨는 진실만 적혀 있다. 안내자는 남쪽 문을 가리키며 웃었다. 문 위의 글씨와 안내자의 행동 중 무엇을 믿어야 할까?","q":"출구는 어느 방향인가요?","opts":["북쪽","남쪽","이 정보만으로는 결정할 수 없다"],"answer":1,"why":"문 위의 안내판은 진실을 말하며 출구가 북쪽이 아니라고 한다. 선택지는 북쪽과 남쪽뿐이므로 남쪽이다. 거짓말쟁이의 손짓은 결론에 필요하지 않은 미끼다.","hint":""},{"title":"05 · 일곱 번째 종","place":"이끼가 덮인 종루","symbol":"🌙","story":"여섯 종의 금속 표면에는 2, 6, 12, 20, 30, 42라는 숫자가 새겨져 있다. 종지기는 일곱 번째 종의 표면만 깨끗하게 닦아 놓았다. “숫자는 종의 나이가 아니라, 누군가 매번 더한 흔적이야.” 종루 문이 닫히기 전에 마지막 숫자를 찾아야 한다.","q":"일곱 번째 종에 새겨질 숫자는?","opts":["54","56","58"],"answer":1,"why":"차이는 +4, +6, +8, +10, +12로 2씩 커진다. 42 다음에는 +14를 더하므로 42+14=56이다.","hint":""},{"title":"06 · 이끼가 기억하는 이름","place":"돌다리 아래의 흔적","symbol":"🍃","story":"돌다리 아래에서 발견된 장갑에는 은색 가루가 묻어 있다. 종탑의 열쇠를 다루는 사람은 세 명뿐이다. 아린은 은색 가루를 쓰지 않고, 보라는 그날 숲 밖에 있었으며, 다온의 작업복 소매에도 같은 가루가 묻어 있다. 경비는 아직 누구도 지목하지 않았다.","q":"현재 단서로 가장 강하게 의심할 수 있는 사람은 누구인가요?","opts":["아린","보라","다온"],"answer":2,"why":"장갑의 은색 가루와 다온의 소매 흔적이 일치하고, 다른 두 사람은 각각 단서와 맞지 않는다.","hint":""},{"title":"07 · 세 방울의 물","place":"수정 폭포의 세 수로","symbol":"💧","story":"폭포의 수로 세 개에는 하루 동안 물이 3리터, 5리터, 8리터씩 흘렀다. 수문장은 물통 하나를 채워 종루로 보내려 한다. 종루의 장치는 정확히 13리터가 있어야 움직인다. 물을 섞거나 버릴 수는 없고, 수로 두 개를 골라 합칠 수 있다.","q":"어느 두 수로를 합쳐야 하나요?","opts":["3리터와 5리터","3리터와 8리터","5리터와 8리터"],"answer":2,"why":"5리터와 8리터를 합치면 13리터가 되어 장치의 조건을 충족한다.","hint":""},{"title":"08 · 바람의 도서관","place":"페이지가 저절로 넘어가는 회랑","symbol":"📖","story":"도서관의 대출 장부에는 같은 책이 세 번 기록돼 있다. 첫 기록은 09:10, 둘째는 09:25, 셋째는 09:40이다. 네 번째 기록은 잉크가 번져 보이지 않는다. 사서는 책을 훔친 사람이 아니라, 기록을 지운 사람이 종탑으로 향했다고 믿는다.","q":"기록이 같은 간격으로 이어졌다면 네 번째 시각은?","opts":["09:50","09:55","10:00"],"answer":1,"why":"기록 간격은 15분이다. 09:40에서 15분 뒤는 09:55다.","hint":""},{"title":"09 · 세 개의 열쇠","place":"서리 낀 문 앞의 받침대","symbol":"🗝️","story":"A, B, C 세 열쇠 중 하나만 문을 연다. A에는 ‘문은 B로 열린다’, B에는 ‘문은 B로 열리지 않는다’, C에는 ‘문은 A로 열린다’고 적혀 있다. 세 문장 중 정확히 두 문장이 참이다.","q":"문을 여는 열쇠는 무엇인가요?","opts":["A","B","C"],"answer":0,"why":"문이 A로 열리면 첫째 문장은 거짓, 둘째 문장은 참, 셋째 문장은 참으로 정확히 두 문장이 참이다.","hint":""},{"title":"10 · 멈춘 나침반","place":"북쪽이 사라진 언덕","symbol":"🧭","story":"나침반 바늘은 북쪽 대신 종루의 지붕을 가리킨다. 지도에는 숲길이 4km, 강길이 6km, 절벽길이 3km라고 적혀 있다. 강길은 물에 잠겼고 절벽길은 폐쇄됐다. 지도 가장자리에는 ‘거리보다 통과할 수 있는 길을 먼저 보라’고 적혀 있다.","q":"현재 이용할 수 있는 길의 길이는?","opts":["3km","4km","6km"],"answer":1,"why":"강길은 물에 잠겼고 절벽길은 폐쇄됐으므로 이용 가능한 길은 숲길 4km뿐이다.","hint":""},{"title":"11 · 빛과 그림자의 저울","place":"두 개의 그림자가 겹치는 방","symbol":"⚖️","story":"수호자는 유리 조각 네 개의 무게를 기록했다. 첫째는 2g, 둘째는 4g, 셋째는 8g, 넷째는 16g이다. 다섯째 조각은 깨진 종 안에 숨겨져 있다. 기록 옆에는 ‘앞의 조각이 다음 조각의 무게를 결정했다’고만 적혀 있다.","q":"다섯째 조각의 무게는 몇 g인가요?","opts":["24g","30g","32g"],"answer":2,"why":"무게가 매번 두 배가 되므로 16g의 다음은 32g이다.","hint":""},{"title":"12 · 종이배의 약속","place":"거울처럼 잔잔한 강","symbol":"⛵","story":"강 위에는 종이배 세 척이 떠 있다. 빨간 배는 동쪽으로, 파란 배는 서쪽으로, 흰 배는 북쪽으로 움직인다. 종루의 기록관은 배의 위치가 아니라 각 배가 향하는 방향을 확인해야 한다고 적어 두었다. 방향 표식은 모두 같은 순간에 기록되었다.","q":"기록에 따르면 서쪽으로 움직이는 배는 어느 배인가요?","opts":["빨간 배","파란 배","흰 배"],"answer":1,"why":"이야기에서 빨간 배는 동쪽, 파란 배는 서쪽, 흰 배는 북쪽으로 움직인다고 명시되어 있다. 따라서 서쪽으로 움직이는 배는 파란 배다.","hint":""},{"title":"13 · 마지막 종의 금속","place":"종루 아래의 작업대","symbol":"🔩","story":"금속 조각의 표면에는 1, 4, 9, 16, 25가 새겨져 있다. 대장장이는 일곱 번째 종의 금속 조각을 찾지 못했다. “이건 무게가 아니라 제작 순서야. 숫자가 커지는 속도를 살펴봐.”","q":"다음 조각에 새겨질 숫자는?","opts":["30","36","49"],"answer":1,"why":"숫자는 1², 2², 3², 4², 5²이므로 다음은 6²=36이다.","hint":""},{"title":"14 · 종이 울린 자리","place":"새벽이 닿은 종루","symbol":"🌅","story":"일곱 번째 종이 울리자 숲의 모든 유리 잎이 한 번씩 빛났다. 종루의 마지막 기록에는 ‘길은 가장 짧은 곳이 아니라, 조건을 모두 만족하는 곳에 있다’고 적혀 있다. 출구 후보는 세 곳이다. 북문은 잠겨 있고, 강문은 물에 잠겼으며, 동문에는 방금 열린 흔적이 남아 있다.","q":"숲을 나갈 수 있는 출구는 어디인가요?","opts":["북문","강문","동문"],"answer":2,"why":"북문은 잠겨 있고 강문은 물에 잠겨 있다. 열린 흔적이 확인된 동문만 조건을 만족한다.","hint":""}];
let index=0,score=0,done=new Set();
function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Number.isInteger(v.index)&&v.index>=0&&v.index<chapters.length){index=v.index;score=Number(v.score)||0;done=new Set(Array.isArray(v.done)?v.done:[]);if(Number(v.startedAt)>0)startedAt=Number(v.startedAt);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({index,score,done:[...done],startedAt}));}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){document.getElementById('progress').style.width=(done.size/chapters.length*100)+'%';document.getElementById('chapterNav').innerHTML=chapters.map((c,i)=>'<button class="chapter-nav '+(i===index?'active':'')+'" data-i="'+i+'">'+esc(c.title)+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.i);if(n<=index||done.has(index)){index=n;save();render();}});}
function render(){nav();const c=chapters[index],answered=done.has(index);document.getElementById('host').innerHTML='<div class="meta"><span>기억 점수 '+score+' / '+chapters.length+'</span><span>CHAPTER '+String(index+1).padStart(2,'0')+' / '+chapters.length+'</span></div><article class="card"><header class="banner"><div class="place">'+esc(c.place)+'</div><h2 class="title">'+esc(c.title)+'</h2></header><div class="art" role="img" aria-label="'+esc(c.place)+'">'+c.symbol+'</div><div class="body"><p class="story">'+esc(c.story)+'</p><section class="puzzle"><small>THE RIDDLE</small><h3>'+esc(c.q)+'</h3><div class="options">'+c.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'" '+(answered?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+esc(o)+'</span></button>').join('')+'</div><div class="feedback" id="feedback">'+(answered?'<strong>기록 완료.</strong> '+esc(c.why):'단서를 읽고 가장 타당한 답을 골라 보세요.')+'</div>'+(c.hint?'<details class="hint"><summary>힌트 보기</summary><p>'+esc(c.hint)+'</p></details>':'')+'</section><div class="actions"><button class="btn" id="restart">처음부터</button><button class="btn primary" id="next" '+(!answered?'disabled':'')+'>'+(index===chapters.length-1?'결말 보기':'다음 장으로')+' →</button></div></div></article>';
document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(done.has(index))return;const n=Number(b.dataset.opt);if(n===c.answer){score++;done.add(index);save();render();}else{b.classList.add('bad');document.getElementById('feedback').textContent='아직 문이 열리지 않았어요. 이야기 속 단서를 다시 살펴보세요.';}});document.getElementById('next').onclick=()=>{if(!done.has(index))return;if(index<chapters.length-1){index++;save();render();window.scrollTo({top:0,behavior:'smooth'});}else ending();};document.getElementById('restart').onclick=()=>{if(confirm('두 번째 이야기를 처음부터 다시 시작할까요?')){index=0;score=0;done=new Set();save();render();}};}
function ending(){document.getElementById('host').innerHTML='<article class="card ending"><div class="kicker">THE END · PART 02</div><h2>일곱 번째 종은<br>당신 안에서 울렸다.</h2><p>숲의 유리잎이 새벽빛을 받아 투명해진다. 종은 사라진 것이 아니었다. 완벽한 답을 기다리느라 멈춰 있던 시간이, 당신이 선택하고 책임지는 순간 다시 움직인 것이다.</p><div class="score">'+score+' / '+chapters.length+'</div><p>정답을 맞힌 수만큼 길을 기억했다. 이제 남은 것은 그 길을 현실에서 어떻게 걸을지 정하는 일이다.</p><section style="margin:24px auto;padding:18px;max-width:520px;border:1px solid var(--line);border-radius:16px;text-align:left"><h3 style="margin-top:0">🏆 온라인 랭킹</h3><label for="sempliNickname">닉네임 (최대 20자)</label><div style="display:flex;gap:8px;margin:8px 0"><input id="sempliNickname" maxlength="20" autocomplete="nickname" placeholder="닉네임 입력" style="min-width:0;flex:1;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:inherit"><button class="btn primary" id="sempliSaveRecord">기록 등록</button></div><p id="sempliRecordStatus" role="status" style="font-size:12px"></p><p style="font-size:11px;opacity:.7">기록은 검증 전 상태로 등록됩니다. 점수 조작 방지 기능은 아직 제한적입니다.</p><div id="sempliLeaderboard">랭킹을 불러오는 중…</div></section><div class="actions"><a class="btn" href="maze.html">1부 다시 보기</a><button class="btn primary" id="again">2부 다시 시작</button></div></article>';document.getElementById('again').onclick=()=>{if(confirm('기록을 초기화하고 다시 시작할까요?')){index=0;score=0;done=new Set();startedAt=Date.now();try{localStorage.setItem('dontimeStartedAtMaze2',String(startedAt));}catch(e){}save();render();}};document.getElementById('sempliSaveRecord').onclick=sempliSubmitRecord;sempliLoadLeaderboard();}
const SEMPLI_RANKING_API="https://script.google.com/macros/s/AKfycbzWKifFsQvTwpJgNWZskSGm5RrDPVZgWfOKqoIxmsW7f8IGK8r469s2DhnV0Pb3-xt_/exec";
let startedAt=Number(localStorage.getItem("dontimeStartedAtMaze2")||0);
if(!startedAt){startedAt=Date.now();try{localStorage.setItem("dontimeStartedAtMaze2",String(startedAt));}catch(e){}}
function sempliEscape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sempliElapsed(){return Math.max(1,Math.floor((Date.now()-startedAt)/1000));}
function sempliTime(s){s=Math.max(0,Number(s)||0);return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초';}
function sempliJsonp(url){
 return new Promise((resolve,reject)=>{
  const callback='sempliJsonp_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
  const script=document.createElement('script');
  const timer=setTimeout(()=>{cleanup();reject(new Error('응답 시간 초과'));},10000);
  function cleanup(){clearTimeout(timer);try{delete window[callback];}catch(e){window[callback]=undefined;}script.remove();}
  window[callback]=(data)=>{cleanup();resolve(data);};
  script.onerror=()=>{cleanup();reject(new Error('API 스크립트 응답 실패'));};
  const u=new URL(url);u.searchParams.set('callback',callback);script.src=u.toString();document.head.appendChild(script);
 });
}
async function sempliLoadLeaderboard(){
 const box=document.getElementById('sempliLeaderboard');if(!box)return;
 box.textContent='랭킹을 불러오는 중…';
 try{const u=new URL(SEMPLI_RANKING_API);u.searchParams.set('action','leaderboard');u.searchParams.set('category','미궁');u.searchParams.set('gameId',"maze-02");u.searchParams.set('limit','10');const d=await sempliJsonp(u.toString());if(!d.ok)throw new Error(d.error||'랭킹 조회 실패');if(!d.records.length){box.innerHTML='<p>아직 등록된 기록이 없습니다. 첫 기록을 남겨보세요!</p>';return;}box.innerHTML='<ol style="text-align:left;padding-left:24px">'+d.records.map(x=>'<li style="padding:6px 0">'+sempliEscape(x.nickname)+' · '+x.score+'점 · '+sempliTime(x.elapsedSeconds)+'</li>').join('')+'</ol>';}catch(e){box.textContent='랭킹 조회 실패: '+(e.message||'응답을 확인할 수 없습니다')+'. 웹 앱 배포를 확인해 주세요.';}
}
async function sempliSubmitRecord(){
 const input=document.getElementById('sempliNickname'),status=document.getElementById('sempliRecordStatus'),btn=document.getElementById('sempliSaveRecord');const nickname=(input.value||'').trim();
 if(!nickname||nickname.length>20){status.textContent='닉네임을 1~20자로 입력해 주세요.';input.focus();return;}
 btn.disabled=true;status.textContent='기록 전송 및 시트 저장 여부를 확인하는 중…';
 const requestId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
 const elapsedSeconds=sempliElapsed();
 try{
  await fetch(SEMPLI_RANKING_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({category:'미궁',gameId:"maze-02",nickname,elapsedSeconds,score,requestId})});
  let verified=false;
  for(let attempt=0;attempt<4;attempt++){
   await new Promise(resolve=>setTimeout(resolve,700*(attempt+1)));
   const u=new URL(SEMPLI_RANKING_API);u.searchParams.set('action','verify');u.searchParams.set('requestId',requestId);
   const d=await sempliJsonp(u.toString());
   if(d.ok&&d.saved){verified=true;break;}
  }
  if(!verified)throw new Error('전송 요청은 보냈지만 시트에서 저장된 기록을 찾지 못했습니다. Apps Script 웹 앱을 새 버전으로 배포했는지 확인해 주세요.');
  status.textContent='시트 저장 확인 완료! 기록이 접수됐어요. 검증 전 기록입니다.';
  await sempliLoadLeaderboard();
 }catch(e){status.textContent='저장 확인 실패: '+(e.message||'오류를 확인할 수 없습니다');btn.disabled=false;}
}
restore();render();

</script></body></html>
