<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17202b"><meta name="description" content="셈플리 미궁 두 번째 이야기, 유리숲의 일곱 번째 종. 다섯 장의 이야기와 논리 퍼즐."><title>미궁 2: 유리숲의 일곱 번째 종 | 셈플리</title>

<style>
:root{color-scheme:dark;--bg:#101722;--panel:#182431;--line:#3b5364;--ink:#f2f4ef;--muted:#a8bac6;--ice:#bde7e6;--amber:#e4c28a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#284658 0,transparent 48%),var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}.head{max-width:1100px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #ffffff15}.brand{color:var(--ink);text-decoration:none;font-weight:900;font-size:20px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;margin-top:3px}.links{display:flex;gap:8px;flex-wrap:wrap}.link,.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:transparent;color:var(--ink);font-size:12px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:34px 24px 70px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}.side{align-self:start;position:sticky;top:18px;border:1px solid var(--line);border-radius:18px;padding:18px;background:#14202b}.kicker{font-size:10px;letter-spacing:.18em;font-weight:900;color:var(--ice)}.side h2{font-size:21px;line-height:1.4;margin:9px 0 15px}.progress{height:5px;background:#314454;border-radius:99px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:var(--ice);transition:width .2s}.chapters{display:grid;gap:6px;margin-top:14px}.chapter-nav{padding:10px;border:1px solid transparent;border-radius:10px;text-align:left;background:transparent;color:var(--muted);font-size:12px}.chapter-nav.active{background:#284351;border-color:#587a88;color:white}.hero{padding:6px 0 24px;border-bottom:1px solid #ffffff1a;margin-bottom:20px}.hero .kicker{color:var(--amber)}h1{font-family:"Noto Serif KR",serif;font-size:clamp(38px,6vw,68px);line-height:1.1;letter-spacing:-.06em;margin:12px 0}.hero p{color:var(--muted);font-size:14px;line-height:1.9;max-width:680px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-bottom:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1d3040,#131f2b 75%);box-shadow:0 22px 60px #0002}.banner{padding:25px 26px;border-bottom:1px solid #ffffff14;background:linear-gradient(120deg,#25495b,#192b39)}.place{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--amber)}.title{font-family:"Noto Serif KR",serif;font-size:clamp(24px,4vw,38px);line-height:1.3;margin:10px 0 0}.art{min-height:170px;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 50% 100%,#bde7e633,transparent 45%),linear-gradient(130deg,#1a3442,#111c29);font-size:76px;border-bottom:1px solid #ffffff12}.art:after{content:"SEMPLI · THE GLASSWOOD";position:absolute;bottom:13px;left:18px;color:#d9c18f;font-size:9px;letter-spacing:.2em;font-weight:900}.body{padding:25px 26px}.story{color:#d4e0e5;font-size:14px;line-height:2;white-space:pre-line;margin:0 0 24px}.puzzle{padding:20px;border:1px solid #3c5968;border-radius:15px;background:#111e29}.puzzle small{font-size:10px;letter-spacing:.16em;color:var(--ice);font-weight:900}.puzzle h3{font-size:17px;line-height:1.7;margin:10px 0 16px}.options{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #3c5968;border-radius:11px;padding:13px;background:#1b2d3a;color:var(--ink);font-size:13px;line-height:1.65}.opt:hover:not(:disabled){border-color:var(--ice);background:#25404e}.opt b{display:grid;place-items:center;min-width:24px;height:24px;border:1px solid #62808b;border-radius:7px;color:var(--ice);font-size:10px}.opt:disabled{cursor:default}.opt.good{border-color:var(--ice);background:#24443f}.opt.bad{border-color:#9a6666;background:#432d32}.feedback{min-height:48px;margin-top:14px;color:var(--muted);font-size:12px;line-height:1.8}.feedback strong{color:var(--ice)}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.btn.primary{background:var(--ice);color:#12212a;border-color:var(--ice)}.btn:disabled{opacity:.35;cursor:not-allowed}.hint{margin-top:13px;border:1px solid #3b5364;border-radius:10px;padding:12px;color:var(--muted);font-size:12px}.hint summary{cursor:pointer;color:var(--ice);font-weight:800}.hint p{line-height:1.8}.ending{text-align:center;padding:clamp(30px,5vw,60px)}.ending h2{font-family:"Noto Serif KR",serif;font-size:clamp(34px,5vw,56px);line-height:1.2}.ending p{color:var(--muted);line-height:2}.score{font-size:48px;color:var(--ice);font-weight:900;margin:22px 0 4px}@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:20px 14px 42px;gap:18px}.side{position:static;padding:13px}.side h2{display:none}.chapters{display:flex;overflow-x:auto}.chapter-nav{flex:0 0 auto}.head{padding:16px 14px}.hero{padding-top:10px}.banner,.body{padding:19px 16px}.story{font-size:13px}.puzzle{padding:15px}.links .link{padding:8px 10px}.art{min-height:140px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="head"><a class="brand" href="index.html">셈플리<small>THE ART OF COUNTING LIFE</small></a><nav class="links"><a class="link" href="maze.html">1부 · 내일역</a><a class="link" href="index.html">홈으로</a></nav></header>
<main class="wrap"><aside class="side"><div class="kicker">MAZE · PART 02</div><h2>유리숲의<br>일곱 번째 종</h2><div class="progress"><span id="progress"></span></div><div class="chapters" id="chapterNav"></div></aside><section><div class="hero"><div class="kicker">미궁 시리즈 · 두 번째 이야기</div><h1>유리숲의<br>일곱 번째 종</h1><p>내일역에서 돌아온 뒤, 당신의 승차권에 없던 숲의 지도가 나타났다. 나뭇잎은 투명하고, 바람은 기억을 흔들며, 종소리는 들은 사람마다 다른 시간을 알려 준다. 다섯 개의 문을 지나 일곱 번째 종이 울리지 않는 이유를 찾아라.</p></div><div id="host"></div></section></main>
<script>
const KEY='dontimeMazePart2Save';
const chapters=[
{title:'01 · 지도 없는 숲',place:'비가 유리로 굳는 입구',symbol:'🌲',story:'숲의 입구에는 길이 세 갈래로 갈라져 있다. 첫 길에는 “어제”, 두 번째 길에는 “오늘”, 세 번째 길에는 “내일”이라는 표식이 달려 있다. 안내자는 어느 길도 안전하다고 말하지 않는다. 다만 나무에 새겨진 규칙 하나를 알려 준다. “발자국은 뒤에 남지만, 선택은 앞을 바꾼다.” 당신이 지도에 손을 대자 종이 위에 아직 걷지 않은 길이 희미하게 그려진다.',q:'아직 일어나지 않았고, 지금의 행동에 따라 달라질 수 있는 길은?',opts:['어제','오늘의 기록','내일'],answer:2,why:'내일은 아직 확정되지 않았고 지금의 선택과 행동에 따라 달라질 수 있다.',hint:'이미 지나간 시간과 지금 기록 중인 시간을 구분해 보세요.'},
{title:'02 · 빛을 담는 우물',place:'별빛이 바닥에 고이는 곳',symbol:'✨',story:'우물 안에는 물 대신 빛이 고여 있다. 수호자는 빛을 꺼내려면 질문에 답해야 한다고 말한다. “누군가에게 나누어 주어도 내 몫이 줄어들지 않고, 오히려 함께 볼수록 선명해지는 것은 무엇인가?” 당신은 우물 가장자리에 새겨진 작은 글자들을 읽는다. 그 글자는 정답을 가리키기보다, 무엇을 나눌 수 있는지 생각하게 한다.',q:'나눌수록 함께 커질 수 있는 것은 무엇일까요?',opts:['잠긴 문','지식','모래시계 속 모래'],answer:1,why:'지식은 나누고 설명할수록 여러 사람이 활용할 수 있으며, 함께 이해할 때 더 넓어진다.',hint:'손에 쥐고 나누면 줄어드는 물건이 아니라, 다른 사람에게 알려 줄 수 있는 것을 생각해 보세요.'},
{title:'03 · 세 개의 종탑',place:'소리가 그림자로 남는 언덕',symbol:'🔔',story:'언덕 위 종탑 세 개에는 각각 다른 문장이 걸려 있다. 첫째 탑은 “나는 늘 같은 말을 한다”, 둘째 탑은 “내 말은 때에 따라 달라진다”, 셋째 탑은 아무 문장도 걸지 않았다. 안내자는 세 번째 탑을 가리키며 말한다. “침묵은 언제나 답을 숨기는 것이 아니라, 질문이 아직 정확하지 않다는 표시일 수도 있어.” 종을 울리기 전, 당신은 무엇을 알아야 하는지 생각한다.',q:'세 종탑 중 어느 것이 진실을 말하는지 문장만으로 확정할 수 없다. 가장 타당한 다음 행동은?',opts:['아무 근거 없이 첫째 탑을 고른다','각 문장이 무엇을 뜻하는지 확인할 질문을 만든다','세 탑 모두 거짓이라고 단정한다'],answer:1,why:'정보가 부족할 때는 단정하기보다 모호한 표현을 구체화할 질문을 해야 한다.',hint:'정답을 찍기 전에 무엇이 알려졌고 무엇이 빠져 있는지 구분해 보세요.'},
{title:'04 · 거울의 갈림길',place:'서로를 비추는 유리벽',symbol:'🪞',story:'거울의 복도에는 같은 문이 두 개 보인다. 하나는 당신이 두려워하는 일을 피하게 하고, 다른 하나는 두려움의 이유를 알아보게 한다. 거울 속 안내자는 “용기는 무섭지 않은 상태가 아니라, 무서운 이유를 살피고도 한 걸음을 정하는 일”이라고 말한다. 문 앞에는 작은 메모가 놓여 있다. “위험을 무시하지 말 것. 그러나 상상한 위험을 이미 일어난 사실로 취급하지도 말 것.”',q:'불확실하지만 중요한 결정을 앞뒀을 때 가장 좋은 태도는?',opts:['불안하니 모든 선택을 영원히 미룬다','위험과 근거를 살피고 작은 단계로 확인한다','무조건 가장 빠른 길을 택한다'],answer:1,why:'불확실성은 위험을 점검하고 작은 단계로 확인하며 대응할 때 다룰 수 있다.',hint:'두려움을 무시하거나 모든 행동을 멈추는 것 말고, 정보를 확인하며 진행하는 방법을 찾아보세요.'},
{title:'05 · 일곱 번째 종',place:'숲의 가장 안쪽, 이름 없는 공터',symbol:'🌙',story:'공터에는 여섯 개의 종만 매달려 있다. 그런데 오래된 기록에는 일곱 번째 종이 있었다고 적혀 있다. 숲의 수호자는 마지막 수수께끼를 낸다. “모든 것을 기억하는 사람도, 모든 것을 예측하는 사람도 아니다. 다음 행동을 고르고 그 결과를 받아들이는 사람에게만 들리는 소리는 무엇인가?” 당신의 승차권이 따뜻해진다. 종은 어딘가에 숨겨진 물건이 아니라, 선택 뒤에 시작되는 소리일지도 모른다.',q:'일곱 번째 종이 상징하는 것은 무엇일까요?',opts:['완벽한 예측','선택에 대한 책임','과거를 지우는 능력'],answer:1,why:'이 이야기의 일곱 번째 종은 선택한 뒤 결과를 살피고 책임지는 태도를 상징한다.',hint:'첫 장의 ‘선택은 앞을 바꾼다’는 문장을 떠올려 보세요. 행동한 뒤 무엇이 따라와야 할까요?'}
];
let index=0,score=0,done=new Set();
function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Number.isInteger(v.index)&&v.index>=0&&v.index<chapters.length){index=v.index;score=Number(v.score)||0;done=new Set(Array.isArray(v.done)?v.done:[]);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({index,score,done:[...done]}));}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){document.getElementById('progress').style.width=(done.size/chapters.length*100)+'%';document.getElementById('chapterNav').innerHTML=chapters.map((c,i)=>'<button class="chapter-nav '+(i===index?'active':'')+'" data-i="'+i+'">'+esc(c.title)+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.i);if(n<=index||done.has(index)){index=n;save();render();}});}
function render(){nav();const c=chapters[index],answered=done.has(index);document.getElementById('host').innerHTML='<div class="meta"><span>기억 점수 '+score+' / '+chapters.length+'</span><span>CHAPTER '+String(index+1).padStart(2,'0')+' / '+chapters.length+'</span></div><article class="card"><header class="banner"><div class="place">'+esc(c.place)+'</div><h2 class="title">'+esc(c.title)+'</h2></header><div class="art" role="img" aria-label="'+esc(c.place)+'">'+c.symbol+'</div><div class="body"><p class="story">'+esc(c.story)+'</p><section class="puzzle"><small>THE RIDDLE</small><h3>'+esc(c.q)+'</h3><div class="options">'+c.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'" '+(answered?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+esc(o)+'</span></button>').join('')+'</div><div class="feedback" id="feedback">'+(answered?'<strong>기록 완료.</strong> '+esc(c.why):'단서를 읽고 가장 타당한 답을 골라 보세요.')+'</div><details class="hint"><summary>힌트 보기</summary><p>'+esc(c.hint)+'</p></details></section><div class="actions"><button class="btn" id="restart">처음부터</button><button class="btn primary" id="next" '+(!answered?'disabled':'')+'>'+(index===chapters.length-1?'결말 보기':'다음 장으로')+' →</button></div></div></article>';
document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(done.has(index))return;const n=Number(b.dataset.opt);if(n===c.answer){score++;done.add(index);save();render();}else{b.classList.add('bad');document.getElementById('feedback').textContent='아직 문이 열리지 않았어요. 힌트를 보고 단서를 다시 살펴보세요.';}});document.getElementById('next').onclick=()=>{if(!done.has(index))return;if(index<chapters.length-1){index++;save();render();window.scrollTo({top:0,behavior:'smooth'});}else ending();};document.getElementById('restart').onclick=()=>{if(confirm('두 번째 이야기를 처음부터 다시 시작할까요?')){index=0;score=0;done=new Set();save();render();}};}
function ending(){document.getElementById('host').innerHTML='<article class="card ending"><div class="kicker">THE END · PART 02</div><h2>일곱 번째 종은<br>당신 안에서 울렸다.</h2><p>숲의 유리잎이 새벽빛을 받아 투명해진다. 종은 사라진 것이 아니었다. 완벽한 답을 기다리느라 멈춰 있던 시간이, 당신이 선택하고 책임지는 순간 다시 움직인 것이다.</p><div class="score">'+score+' / '+chapters.length+'</div><p>정답을 맞힌 수만큼 길을 기억했다. 이제 남은 것은 그 길을 현실에서 어떻게 걸을지 정하는 일이다.</p><div class="actions"><a class="btn" href="maze.html">1부 다시 보기</a><button class="btn primary" id="again">2부 다시 시작</button></div></article>';document.getElementById('again').onclick=()=>{if(confirm('기록을 초기화하고 다시 시작할까요?')){index=0;score=0;done=new Set();save();render();}};}
restore();render();
</script></body></html>
