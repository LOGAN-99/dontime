<style>*{box-sizing:border-box}body{margin:0;background:#07131d;color:#edf2f3;font-family:Arial,'Noto Sans KR',sans-serif;line-height:1.75}.wrap{max-width:900px;margin:auto;padding:22px 18px 70px}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:#e5bd82;text-decoration:none;font-weight:900}.hero,.card{border:1px solid #3a5664;background:#12232f;border-radius:18px;padding:23px;margin:18px 0}.hero{background:linear-gradient(120deg,rgba(5,15,23,.95),rgba(7,22,31,.62)),url('/assets/valentich-bass-strait.svg') center/cover}.eyebrow{font:900 10px monospace;letter-spacing:.17em;color:#e5bd82}.title{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:8px 0}.muted{color:#b3c2c8}.meter{display:flex;justify-content:space-between;gap:12px;color:#b3c2c8;font-size:12px;font-weight:800}.progress{height:7px;background:#2b404c;border-radius:10px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:#d6b17e;transition:width .2s}.story{font-size:15px;color:#dce5e7;min-height:90px}.question{font-size:19px;font-weight:900;margin:14px 0}.options{display:grid;gap:9px}.options button{background:#0b1b26;border:1px solid #405b68;color:#edf2f3;text-align:left;padding:13px 15px;border-radius:11px;font-size:14px;cursor:pointer}.options button:disabled{opacity:.9;cursor:default}.feedback{display:none;background:#203744;border-radius:10px;padding:14px;margin-top:14px;color:#e0e8e9}.feedback.show{display:block}#next{margin-top:15px;border:0;background:#e5bd82;color:#172630;border-radius:9px;padding:11px 18px;font-weight:900;cursor:pointer}.note{font-size:12px;color:#9fb1b9}</style></head><body><main class="wrap">

<header class="hero"><div class="eyebrow">PART 11 · THE SEVENTEEN-SECOND ARCHIVE</div><h1 class="title">바람이 남긴 17초</h1><p class="muted">가상의 해안 기록관에 도착한 세 개의 교신 기록. 시간, 출처, 관찰과 해석을 나누어 14개의 퍼즐을 풀어라.</p><p class="note">완전한 창작 미궁입니다. 실제 프레더릭 발렌티치 사건의 인물·교신·수사 장면을 재현하지 않습니다.</p></header>
<section class="card"><div class="meter"><span id="label">CHAPTER 01 / 14</span><span id="score">정답 0개</span></div><div class="progress"><span id="bar"></span></div><h2 id="title" class="title" style="font-size:24px"></h2><p id="story" class="story"></p><p id="question" class="question"></p><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" hidden>다음 장면 →</button></section>
</main><script>
const chapters=[
{title:"해안 기록관의 첫 장",story:"새벽의 기록관에서 세 장의 항해 일지가 발견됐다. 기록된 시각은 18:19, 19:00, 19:06이다. 관장은 가장 먼저 일어난 일부터 배열하라고 했다.",q:"올바른 시간 순서는?",o:["19:06 → 18:19 → 19:00","18:19 → 19:00 → 19:06","19:00 → 19:06 → 18:19","18:19 → 19:06 → 19:00"],a:1,e:"시간이 빠른 순서대로 배열하면 18:19, 19:00, 19:06입니다."},
{title:"두 항구 사이",story:"지도에는 출발 항구 M과 도착 항구 K가 표시되어 있다. 항해 계획서에는 M에서 K로 이동한다고 적혀 있다.",q:"기록에 맞는 이동 방향은?",o:["K에서 M으로 이동","M에서 K로 이동","두 항구를 왕복하지 않고 제3항구로 이동","출발지가 기록되지 않음"],a:1,e:"계획서가 명시한 방향은 M 출발, K 도착입니다."},
{title:"알려진 교통",story:"관제 메모에는 '해당 구역에 알려진 교통 없음'이라고 적혀 있다. 다른 메모에는 한 관찰자가 빛을 봤다고 기록했다.",q:"두 기록을 함께 읽을 때 가장 정확한 해석은?",o:["빛은 존재하지 않았다","관제에 알려진 항공 교통은 없었고, 관찰 보고는 별도로 남아 있다","관제사가 빛을 직접 확인했다","두 기록은 반드시 서로 모순된다"],a:1,e:"'알려진 교통 없음'은 관제 정보의 범위를 말합니다. 별도의 관찰 보고를 자동으로 지우거나 확인된 항공기로 바꾸지 않습니다."},
{title:"보고와 실체",story:"한 통신 기록에는 '위쪽에 네 개의 불빛이 보인다'는 말이 남아 있다. 물체의 사진이나 회수된 잔해는 없다.",q:"이 기록이 직접 입증하는 것은?",o:["외계 비행체의 존재","관찰자가 네 개의 불빛을 보고했다고 말한 사실","빛의 물리적 정체","항공기와 충돌한 물체의 종류"],a:1,e:"통신 기록은 보고된 발언을 입증합니다. 발언 속 대상의 실체는 별도 증거가 필요합니다."},
{title:"열린 마이크",story:"마지막 문장 뒤 녹음 장치가 17초 동안 열린 상태였다고 적혀 있다. 음향 분석표는 아직 첨부되지 않았다.",q:"현재 확정할 수 있는 것은?",o:["17초 동안 특정 금속음이 났다","17초 동안 녹음 채널이 열려 있었다","그 시간에 구조 신호가 전송됐다","그 시간에 두 번째 조종사가 말했다"],a:1,e:"기록이 말하는 것은 마이크가 열린 시간입니다. 소리의 정체나 그 시간에 일어난 일은 확정되지 않았습니다."},
{title:"날씨 장부",story:"기상표에는 '시정 양호, 약한 바람, 얇은 구름'이라고 적혀 있다. 다른 문서에는 '날씨가 나빴을 것'이라는 추측이 있다.",q:"직접 기록된 기상 정보는?",o:["강한 폭풍","시정 양호와 약한 바람","폭설과 결빙","기상 자료가 전혀 없음"],a:1,e:"장부에 적힌 관측값은 시정 양호와 약한 바람입니다. 별도의 추측은 관측 기록과 구분해야 합니다."},
{title:"누락된 한 줄",story:"교신 대장에 한 줄이 비어 있다. 그 줄의 앞뒤 시각은 남아 있지만 내용은 없다.",q:"가장 신중한 기록 방법은?",o:["앞뒤 문장으로 내용을 만들어 넣는다","누락 사실을 표시하고 원본·복사본·보관 이력을 확인한다","누군가 일부러 지웠다고 단정한다","대장 전체를 폐기한다"],a:1,e:"빈 줄은 누락이라는 사실만 보여줍니다. 내용과 원인은 원본 및 보관 경로를 확인해야 합니다."},
{title:"두 시계의 차이",story:"무전 기록은 19:12, 선착장 시계 사진은 19:15를 가리킨다. 두 시계의 동기화 자료는 없다.",q:"시간 순서를 확정하기 전에 확인할 것은?",o:["두 시각의 평균","각 시계의 오차와 동기화 기록","더 늦은 시각을 삭제","사진의 시각을 무조건 기준으로 삼기"],a:1,e:"시계가 동기화되지 않았다면 표시된 숫자만으로 사건의 정확한 순서를 단정할 수 없습니다."},
{title:"두 방향의 선",story:"지도에 서로 다른 지점에서 그은 두 방위선이 한 구역에서 만난다. 각 방위의 측정 오차는 아직 계산하지 않았다.",q:"현재 지도에서 말할 수 있는 것은?",o:["정확한 위치가 확정됐다","두 선이 만나는 구역이 후보 위치로 표시됐다","실종 원인이 밝혀졌다","측정 오차가 0이다"],a:1,e:"교차 구역은 후보 범위를 좁히는 단서일 뿐입니다. 오차와 추가 자료를 확인해야 정확한 위치를 말할 수 있습니다."},
{title:"연료 기록",story:"가상의 조사 비행기는 18:00에 출발했고, 계획상 연료 지속 시간은 4시간이다. 다른 조건 변화가 없다고 가정한다.",q:"계획상 연료가 모두 소진되는 시각은?",o:["20:00","21:00","22:00","23:00"],a:2,e:"18:00에 4시간을 더하면 22:00입니다. 이는 문제에서 제시한 가정 아래의 계산입니다."},
{title:"출처의 무게",story:"기록관에는 날짜와 기관명이 있는 공식 보고서, 작성자 없는 온라인 메모, 원본과 대조되지 않은 요약문이 놓여 있다.",q:"사실 확인을 시작할 때 우선 검토할 자료는?",o:["작성자 없는 온라인 메모","날짜와 발행 기관이 확인되는 공식 보고서","가장 자극적인 요약문","가장 짧은 문장"],a:1,e:"출처와 작성 시점이 확인되는 자료는 검증 경로를 추적할 수 있어 우선 확인하기 좋습니다."},
{title:"그럴듯한 설명",story:"한 연구자는 하늘의 밝은 천체가 관찰을 혼란스럽게 했을 가능성을 제시했다. 그러나 당시 조종석 시야를 재현한 실험은 없다.",q:"이 설명을 기록하는 가장 정확한 방법은?",o:["확정된 원인으로 발표한다","가능성 있는 가설로 표시하고 검증 자료를 찾는다","공식 보고서와 같은 지위로 취급한다","다른 모든 설명을 삭제한다"],a:1,e:"설명 후보는 가설로 분류해야 합니다. 그럴듯함만으로 사건의 원인이 입증되지는 않습니다."},
{title:"수색 종료표",story:"수색 기록에는 4일간 탐색했으나 당시 항공기 흔적을 찾지 못했다고 적혀 있다.",q:"수색 기록이 직접 뒷받침하는 결론은?",o:["항공기는 존재하지 않았다","해당 수색 기간과 범위에서 흔적을 발견하지 못했다","모든 바다와 해저가 완전히 조사됐다","실종 원인이 확정됐다"],a:1,e:"수색 결과는 조사된 기간과 범위 안에서 흔적을 찾지 못했다는 뜻입니다. 모든 가능성을 영구히 배제하지는 않습니다."},
{title:"마지막 서랍",story:"기록관장은 세 칸을 남겼다. 첫 칸은 관찰, 둘째 칸은 해석, 셋째 칸은 미확인. 문을 여는 열쇠는 세 칸을 섞지 않는 것이다.",q:"가장 정확한 최종 기록 원칙은?",o:["빈칸을 상상으로 채운다","흥미로운 설명을 사실로 바꾼다","관찰된 사실·추론·미확인 사항을 분리한다","서로 다른 출처의 차이를 지운다"],a:2,e:"확인된 사실과 해석, 아직 모르는 내용을 구분해야 기록의 신뢰성을 지킬 수 있습니다."}
];
let at=0,score=0,locked=false;const $=id=>document.getElementById(id);
function render(){locked=false;const x=chapters[at];$("label").textContent="CHAPTER "+String(at+1).padStart(2,"0")+" / "+chapters.length;$("score").textContent="정답 "+score+"개";$("bar").style.width=((at+1)/chapters.length*100)+"%";$("title").textContent=x.title;$("story").textContent=x.story;$("question").textContent=x.q;$("options").innerHTML="";x.o.forEach((v,n)=>{const b=document.createElement("button");b.textContent=String.fromCharCode(65+n)+". "+v;b.onclick=()=>answer(n);$("options").appendChild(b)});$("feedback").className="feedback";$("feedback").textContent="";$("next").hidden=true}
function answer(n){if(locked)return;locked=true;const x=chapters[at];if(n===x.a)score++;[...$("options").children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#8bc5b6";if(j===n&&n!==x.a)b.style.borderColor="#c37d74"});$("feedback").textContent=(n===x.a?"기록이 맞아떨어졌습니다. ":"다른 단서를 다시 살펴보세요. ")+x.e;$("feedback").classList.add("show");$("score").textContent="정답 "+score+"개";$("next").hidden=false;$("next").textContent=at===chapters.length-1?"기록실 최종 확인":"다음 장면 →"}
$("next").onclick=()=>{if(at<chapters.length-1){at++;render()}else{$("label").textContent="ARCHIVE COMPLETE";$("title").textContent="기록관의 마지막 문";$("story").textContent="관장은 보고서에 적힌 사실을 사실란에, 설명 후보를 가설란에, 아직 확인되지 않은 내용은 빈칸 그대로 남겼다. 기록관의 문은 답을 많이 아는 사람보다, 모르는 것을 정확히 표시한 사람에게 열렸다.";$("question").textContent=chapters.length+"개 퍼즐 중 "+score+"개 정답";$("options").innerHTML='<a href="/valentich-disappearance.html" style="color:#e5bd82">CASE 007 다큐 보기</a> · <a href="/maze.html" style="color:#e5bd82">미궁 목록으로</a>';$("feedback").textContent="모르는 것을 모른다고 기록하는 일도 정확한 결론의 일부입니다.";$("feedback").classList.add("show");$("next").hidden=true;$("bar").style.width="100%"}};
render();
</script></body></html>
