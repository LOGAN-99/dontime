<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PART 18 · 도착지 없는 항로 | 셈플리 미궁</title><meta name="description" content="가상의 항로 기록실에서 좌표, 시각, 무선 기록, 자료의 범위를 확인하는 14개 논리 퍼즐."><link rel="canonical" href="https://dontime.kr/maze18.html"><meta name="robots" content="index,follow"><style>body{margin:0;background:#0b141e;color:#edf2f4;font:16px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 18px}.hero,.scene{background:#142331;border:1px solid #4b6070;border-radius:17px;padding:23px;margin:18px 0}.eyebrow{font:900 11px monospace;letter-spacing:.17em;color:#e5c18a}.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.2}.muted{color:#b4c2cb}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #627787;border-radius:10px;background:#0e1b27;color:#edf2f4;font:inherit;cursor:pointer}.opts button:disabled{opacity:.82}.feedback{display:none;background:#203647;border-radius:10px;padding:14px;margin-top:13px}.feedback.show{display:block}#next{margin-top:15px;background:#e1c18e;color:#14202a;border:0;border-radius:9px;padding:12px 17px;font-weight:900;cursor:pointer}.bar{height:7px;background:#263c4c;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#d8b67f}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:#e5c18a;text-decoration:none;font-weight:800}</style></head><body><main class="wrap"><nav class="nav"><a href="/maze.html">← 미궁 목록</a><a href="/amelia-earhart.html">CASE 014 다큐</a></nav><section class="hero"><div class="eyebrow">PART 18 · FICTIONAL ARCHIVE MYSTERY</div><h1>도착지 없는 항로</h1><p>가상의 기록실에 항로표, 무선 로그, 시계, 봉인된 지도와 서로 다른 설명이 남았다. 기록을 정리하면서 관찰과 추론을 구분하라.</p><p class="muted">실제 아멜리아 에어하트 사건의 재현이 아닌 창작 미궁입니다.</p><div class="bar"><span id="progress"></span></div><p id="status" class="muted">14개 장면 · 14개 논리 퍼즐</p></section><section class="scene"><div class="eyebrow" id="chapterNo"></div><h2 id="chapterTitle"></h2><p id="story"></p><p id="question"></p><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><button id="next" hidden>다음 장면 →</button></section><section class="scene"><b>기록 복원 원칙</b><p class="muted">자료가 말하는 범위를 지키고, 결론이 아직 없다는 사실도 기록한다.</p></section></main><script>
const chapters=[
{title:"출발지",story:"항로표에는 출발지 L, 목적지 H가 표시되어 있다. L은 남서쪽, H는 북동쪽 지도 가장자리의 섬이다.",q:"출발지와 목적지를 확인할 때 가장 먼저 해야 할 일은?",o:["표식의 범례와 지도 방향을 확인한다","표식만 보고 모든 위치를 단정한다","지도에 없는 정보를 만들어 넣는다","기록을 버린다"],a:0,e:"범례와 방향을 확인해야 표식이 무엇을 뜻하는지 알 수 있습니다."},
{title:"기준 시계",story:"기록실의 시계 두 개는 각각 08:40과 08:43을 가리킨다. 두 시계는 같은 표준으로 맞춰져 있다.",q:"세 분 차이가 나는 기록을 비교할 때 적절한 태도는?",o:["차이를 기록하고 원본을 대조한다","더 극적인 시각을 선택한다","두 기록을 모두 삭제한다","시각 차이를 사건 원인으로 확정한다"],a:0,e:"시간 차이는 확인할 대상이지, 원인을 확정하는 증거가 아닙니다."},
{title:"호출 부호",story:"무선 기록의 한 줄에는 KHAQQ가 적혀 있다. 다른 문서에는 KHAQQ가 항공기 호출 부호라고 설명된다.",q:"이 두 기록이 직접 뒷받침하는 것은?",o:["기록에서 호출 부호가 사용되었다","호출 부호가 실제 항공기 위치를 확정한다","호출 부호가 목적지를 바꿨다","호출 부호가 실종 원인이다"],a:0,e:"호출 부호의 사용과 실제 위치는 별개의 증거 문제입니다."},
{title:"좌표 표기",story:"지도에는 157-337이라는 숫자 묶음이 남았다. 표기 규칙은 별도의 문서에 있다.",q:"숫자를 해석하기 전에 해야 할 일은?",o:["표기 규칙과 문서 맥락을 확인한다","숫자를 곧바로 실제 위치로 확정한다","숫자를 무작위로 바꾼다","표기 규칙을 무시한다"],a:0,e:"좌표나 위치 표기는 맥락과 규칙을 확인해야 의미를 판단할 수 있습니다."},
{title:"낮은 고도",story:"보고서에는 1,000이라는 수치와 FEET라는 단위가 함께 적혀 있다.",q:"수치와 단위를 함께 읽는 이유는?",o:["단위가 값의 의미를 결정하기 때문이다","단위는 항상 장식이기 때문이다","숫자는 무조건 거리이다","단위를 제거하면 정확해진다"],a:0,e:"숫자는 단위와 맥락을 함께 확인해야 의미를 이해할 수 있습니다."},
{title:"통신 장애",story:"두 기록은 서로 다른 시각에 통신이 어려웠다고 적는다.",q:"통신이 어려웠다는 기록만으로 확정할 수 없는 것은?",o:["통신 문제가 보고되었다","통신이 어려웠던 시각","통신 문제의 정확한 물리적 원인","기록에 통신 문제가 나타난다"],a:2,e:"통신 장애의 원인은 별도의 장비, 환경, 절차 자료가 필요합니다."},
{title:"연료 장부",story:"장부에는 출발 전 연료량과 예상 소모량이 기록되어 있지만, 최종 잔량은 비어 있다.",q:"비어 있는 잔량 칸을 처리하는 방법은?",o:["추정값을 사실처럼 채운다","미확인으로 표시하고 계산 가정을 분리한다","가장 낮은 수치를 선택한다","장부를 폐기한다"],a:1,e:"기록되지 않은 값은 가정과 구분해 미확인으로 남겨야 합니다."},
{title:"두 지도",story:"지도 A는 해안선을, 지도 B는 등고선을 보여 준다. 두 지도는 같은 지역을 다른 방식으로 표현한다.",q:"두 지도에서 서로 다른 정보가 나타나는 이유는?",o:["지도마다 목적과 표현 범위가 다르기 때문이다","지도 B는 항상 틀리기 때문이다","지도 A만 사실이다","두 지도는 서로 모순이므로 모두 무효다"],a:0,e:"지도는 목적과 축척, 표시 정보가 달라질 수 있습니다."},
{title:"원본과 사본",story:"사본에는 원본의 일부 문장이 빠져 있다. 사본의 출처는 확인되지만 원본은 아직 보관소에서 찾지 못했다.",q:"가장 정확한 기록 방식은?",o:["사본의 내용을 원본과 동일하다고 단정한다","누락을 표시하고 사본 출처를 기록한다","원본이 없으니 사본을 무시한다","누락된 문장을 추측해 채운다"],a:1,e:"사본의 출처와 누락을 표시하면 자료의 한계를 명확히 할 수 있습니다."},
{title:"목격 메모",story:"목격 메모에는 '빛'이라는 단어만 남았다. 색, 크기, 방향은 기록되지 않았다.",q:"메모에서 확인되는 것은?",o:["빛에 대한 언급이 있다","빛의 종류가 확정된다","빛의 출처가 확정된다","빛이 항공기였다"],a:0,e:"메모의 내용은 단어가 기록되었다는 사실까지만 직접 확인합니다."},
{title:"비교 표",story:"표에는 두 자료의 날짜가 일치하고 장소는 다르게 기록되어 있다.",q:"자료 비교에서 적절한 결론은?",o:["날짜 일치와 장소 불일치를 함께 기록한다","한 자료를 임의로 선택한다","불일치가 있으니 모두 거짓이다","장소를 하나로 통일한다"],a:0,e:"일치와 불일치를 각각 기록하고 추가 검증이 필요한 부분을 남깁니다."},
{title:"후보 설명",story:"세 설명이 제시되었다. 하나는 장비, 하나는 환경, 하나는 의도에 관한 가설이다.",q:"가설을 평가하는 기준은?",o:["가설의 극적인 정도","각 가설이 설명하는 자료와 추가 검증 가능성","작성자의 인기","가설의 길이"],a:1,e:"설명력과 검증 가능성, 증거의 범위를 비교해야 합니다."},
{title:"봉인 번호",story:"서류함의 봉인 번호가 인계표와 일치한다. 내용물의 목록은 별도 문서에 있다.",q:"번호 일치가 직접 뒷받침하는 것은?",o:["기록된 봉인 번호가 일치한다","내용물의 모든 정보가 사실이다","서류함의 내용이 사건을 해결한다","작성자의 의도가 확정된다"],a:0,e:"봉인 번호의 일치는 기록상의 연속성을 뒷받침하지만 내용의 진실성을 보증하지 않습니다."},
{title:"빈 결론",story:"모든 자료를 정리했지만 항로의 마지막 위치를 확정할 기록은 없다.",q:"가장 타당한 최종 기록은?",o:["미확인 부분을 하나의 가설로 채운다","증거가 확인한 범위까지만 결론을 내리고 나머지는 미확인으로 둔다","모든 자료를 무시한다","가장 유명한 설명을 사실로 확정한다"],a:1,e:"결론이 없다는 사실도 정확한 기록입니다. 미확인 사항은 미확인으로 남깁니다."}
];
let index=0,score=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;const c=chapters[index];$('chapterNo').textContent='CHAPTER '+String(index+1).padStart(2,'0')+' / 14';$('chapterTitle').textContent=c.title;$('story').textContent=c.story;$('question').textContent=c.q;$('options').innerHTML=c.o.map((v,n)=>'<button data-i="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$('feedback').className='feedback';$('feedback').textContent='';$('next').hidden=true;$('progress').style.width=((index)/chapters.length*100)+'%';$('status').textContent='현재 '+(index+1)+' / 14 · 정답 '+score+'개';$('options').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));}function answer(n){if(locked)return;locked=true;const c=chapters[index];if(n===c.a)score++;$('options').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===c.a)b.style.borderColor='#d8b67f';if(j===n&&n!==c.a)b.style.borderColor='#bd786e';});$('feedback').textContent=(n===c.a?'기록 복원 성공. ':'정답은 '+c.o[c.a]+'. ')+c.e;$('feedback').classList.add('show');$('next').hidden=false;$('next').textContent=index===chapters.length-1?'최종 결과 보기':'다음 장면 →';} $('next').onclick=()=>{if(index<chapters.length-1){index++;render();}else{$('chapterNo').textContent='ARCHIVE COMPLETE';$('chapterTitle').textContent='기록실의 마지막 문';$('story').textContent='복원한 기록을 하나의 결론으로 묶어 보았다.';$('question').textContent='14개 퍼즐 중 '+score+'개를 해결했습니다.';$('options').innerHTML='<a href="/amelia-earhart.html" style="color:#e5c18a">CASE 014 다큐로 돌아가기</a> · <a href="/maze.html" style="color:#e5c18a">미궁 목록</a>';$('feedback').textContent='확인된 사실은 단단하게, 미확인 부분은 열린 채로 남겨 두는 것이 기록을 존중하는 방법입니다.';$('feedback').classList.add('show');$('next').hidden=true;$('progress').style.width='100%';$('status').textContent='완료 · 정답 '+score+' / 14';}};render();</script></body></html>
