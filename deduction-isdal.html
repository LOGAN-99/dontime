<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 013 · 이스달 여성 추리 퀴즈 | 셈플리</title><meta name="description" content="이스달 여성 사건의 공개 기록을 바탕으로 사실과 추론을 구분하는 8문제 추리 퀴즈."><link rel="canonical" href="https://dontime.kr/deduction-isdal.html"><meta name="robots" content="index,follow"><style>body{margin:0;background:#f1f3f1;color:#1d2925;font:15px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:800px;margin:auto;padding:25px 18px}.nav{display:flex;justify-content:space-between}.nav a{color:inherit;text-decoration:none;font-weight:bold}.card{background:white;border:1px solid #d8dfda;border-radius:16px;padding:23px;margin:18px 0}.eyebrow{font:900 11px monospace;color:#927044;letter-spacing:.15em}h1{font-size:clamp(30px,6vw,46px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #d6ded8;border-radius:10px;background:white;font:inherit;cursor:pointer}.opts button:disabled{opacity:.8}.feedback{display:none;background:#edf2ec;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#203e34;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:bold}.muted{color:#63736a}</style></head><body><main class="wrap"><header class="nav"><a href="/isdal-woman.html">← CASE 013 다큐</a><a href="/mystery.html">다큐 목록</a></header><section class="card"><div class="eyebrow">CASE 013 · ISDAL WOMAN</div><h1>기록으로 추리하기</h1><p>공개된 사실과 증거의 범위를 바탕으로 답을 골라보세요. 미확인 가설을 정답처럼 취급하지 않습니다.</p></section><section class="card"><div id="count" class="muted"></div><p id="q" class="question"></p><div id="opts" class="opts"></div><div id="fb" class="feedback"></div><button id="next" hidden>다음 문제 →</button></section><section class="card"><p class="muted">8문제 · 신원이나 가해자를 추측해 지목하는 문제는 없습니다.</p><a href="/maze17.html">연결 미궁 PART 17</a></section></main><script>const qs=[{q:"여성의 시신이 발견된 날짜는?",o:["1970년 11월 29일","1970년 10월 29일","1971년 2월 5일","1970년 12월 5일"],a:0,e:"공개 보도는 발견 날짜를 1970년 11월 29일로 기록합니다."},{q:"발견 장소는 어디인가?",o:["오슬로","이스달, 베르겐 인근","트론헤임","스타방에르"],a:1,e:"이스달(Isdalen)은 베르겐 인근의 계곡입니다."},{q:"호텔 등록과 소지품에서 확인된 특징은?",o:["모든 이름과 주소가 같았다","여러 별칭과 제거된 식별 표식이 있었다","여권이 모두 실명으로 남아 있었다","여행 기록이 전혀 없었다"],a:1,e:"여러 호텔 등록에 서로 다른 이름이 나타났고, 일부 식별 표식이 제거됐습니다."},{q:"메모의 문자·숫자는 조사 과정에서 무엇으로 해석됐는가?",o:["완전히 해독되지 않은 암호","날짜와 목적지를 기록한 여행 로그","살인 계획","재판 기록"],a:1,e:"공개 보도는 메모를 여행 날짜와 목적지의 기록으로 설명합니다. 비밀 첩보 코드라고 확정하지 않습니다."},{q:"베르겐 역의 여행 가방과 여성을 연결한 단서는?",o:["같은 호텔 영수증","지문","목격자의 사진","전화번호"],a:1,e:"가방 안의 지문이 여성의 지문과 연결됐다는 보도가 있습니다."},{q:"현대 과학 분석에서 사용된 방법은?",o:["DNA와 치아 동위원소 분석","위성 영상만 분석","화학 분석 없이 이름 추정","가방의 브랜드만 비교"],a:0,e:"보존된 조직의 DNA 분석과 치아 동위원소 분석이 공개됐습니다."},{q:"동위원소 분석 결과를 가장 정확하게 설명한 것은?",o:["정확한 이름과 출생지를 확정했다","가능한 어린 시절의 지리적 배경을 좁혔지만 이름은 확인하지 못했다","첩보 활동을 입증했다","살인자를 특정했다"],a:1,e:"동위원소 분석은 가능한 지리적 배경을 좁히는 데 도움을 주었지만 신원을 확정하지 않았습니다."},{q:"현재 공개 자료로 가장 타당한 결론은?",o:["첩보원으로 확정됐다","살인 피해자로 확정됐다","신원과 사망 경위의 핵심 부분이 미해결이다","모든 단서가 조작됐다"],a:2,e:"자살·살인·첩보 활동 등의 가설이 있지만, 공개 자료만으로 신원이나 사망 경위를 확정할 수 없습니다."}];let i=0,score=0,locked=false;const $=x=>document.getElementById(x);function draw(){locked=false;$('count').textContent='QUESTION '+(i+1)+' / '+qs.length;$('q').textContent=qs[i].q;$('opts').innerHTML=qs[i].o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$('fb').className='feedback';$('fb').textContent='';$('next').hidden=true;$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.n));}function answer(n){if(locked)return;locked=true;let x=qs[i];if(n===x.a)score++;$('opts').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#4c8b67';if(j===n&&n!==x.a)b.style.borderColor='#b66b61'});$('fb').textContent=(n===x.a?'정답! ':'정답은 '+x.o[x.a]+'. ')+x.e;$('fb').classList.add('show');$('next').hidden=false;$('next').textContent=i===qs.length-1?'결과 보기':'다음 문제 →';}$('next').onclick=()=>{if(i<qs.length-1){i++;draw()}else{$('count').textContent='RESULT';$('q').textContent=qs.length+'문제 중 '+score+'문제 정답';$('opts').innerHTML='<a href="/isdal-woman.html">다큐 다시 보기</a> · <a href="/maze17.html">미궁 PART 17</a>';$('fb').textContent='확인된 사실과 미확인 가설을 분리하는 것이 좋은 추리의 출발점입니다.';$('fb').classList.add('show');$('next').hidden=true;}};draw();</script></body></html>
