<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이스달 여성 사건 추리 퀴즈 | 셈플리</title><meta name="description" content="이스달 여성 사건의 공개 기록과 법의학 단서를 바탕으로 사실과 추측을 구분하는 8문제 퀴즈."><link rel="canonical" href="https://dontime.kr/deduction-isdal.html"><style>body{margin:0;background:#f1f3f1;color:#1d2925;font:15px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 18px 60px}.nav{display:flex;justify-content:space-between}.nav a{color:inherit;text-decoration:none;font-weight:bold}.card{background:white;border:1px solid #d8dfda;border-radius:16px;padding:23px;margin:18px 0}.tag{font:900 11px monospace;color:#927044;letter-spacing:.15em}h1{font-size:clamp(30px,6vw,46px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #d6ded8;border-radius:10px;background:white;font:inherit;cursor:pointer}.opts button:disabled{cursor:default}.feedback{display:none;background:#edf2ec;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#203e34;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:bold}.small{font-size:12px;color:#66756e}</style></head><body><main class="wrap"><header class="nav"><a href="/mystery.html">← 다큐 목록</a><a href="/">셈플리</a></header><section class="card"><div class="tag">CASE 002 · ISDAL WOMAN</div><h1>기록으로 추리하기</h1><p>공개 자료에서 확인되는 내용만으로 구성했습니다. 가설을 사실로 착각하지 않는 것이 이번 퀴즈의 핵심입니다.</p><p class="small">총 8문제 · 정답과 해설 제공</p></section><section class="card"><div class="tag" id="count"></div><p class="question" id="q"></p><div class="opts" id="opts"></div><div class="feedback" id="fb" aria-live="polite"></div><button id="next" hidden>다음 문제 →</button></section><section class="card"><p class="small">더 자세한 사건 기록은 <a href="/isdal-woman.html">이스달 여성 다큐</a>에서 확인할 수 있습니다. 한국 사건에는 추리 퀴즈를 만들지 않습니다.</p></section></main>
<script>
const qs=[
{q:"여성이 발견된 날짜는?",o:["1960년 11월 29일","1970년 11월 29일","1971년 11월 29일","1980년 11월 29일"],a:1,e:"공개된 사건 기록은 발견 날짜를 1970년 11월 29일로 적고 있습니다."},
{q:"발견 장소는 어디인가?",o:["오슬로 항구","스톡홀름 외곽","베르겐 인근 이스달렌 계곡","코펜하겐 기차역"],a:2,e:"시신은 노르웨이 서부 베르겐 인근 이스달렌 계곡에서 발견됐습니다."},
{q:"베르겐 역의 여행 가방이 사건과 연결된 핵심 단서는?",o:["가방 손잡이의 혈흔","안경에서 확인된 지문 일치","가방에 붙은 여권","목격자의 서명"],a:1,e:"가방 속 안경에서 나온 지문이 여성의 지문과 일치했습니다."},
{q:"호텔 기록의 가명을 설명할 때 가장 안전한 표현은?",o:["정확히 두 개","적어도 여덟 개","스무 개로 확정","가명은 없었다"],a:1,e:"공개 기록에는 적어도 여덟 개의 가명이 언급됩니다. 가명만으로 직업이나 동기를 확정할 수는 없습니다."},
{q:"치아의 산소·스트론튬 동위원소 분석이 주로 제공하는 정보는?",o:["실제 이름","정확한 사망 시각","성장기의 지리적 배경에 관한 가능성","첩보 기관 소속"],a:2,e:"치아 법랑질의 동위원소는 성장 지역의 가능성을 좁힐 수 있지만 신원을 알려주지는 않습니다."},
{q:"2016년 보존 조직에서 얻은 DNA 프로필이 의미하는 바는?",o:["이름과 국적이 확정됐다","유럽계 특징이 보고됐지만 신원은 확인되지 않았다","첩보 활동이 증명됐다","가족과의 일치가 확인됐다"],a:1,e:"DNA 분석은 유럽계 유전적 특징을 제시했지만 공개 자료에서 신원 일치가 확인됐다는 발표는 찾지 못했습니다."},
{q:"여성이 첩보원이었다는 주장을 가장 정확하게 분류하면?",o:["공식적으로 확정된 사실","법원의 유죄 판결","흥미를 끌지만 입증되지 않은 가설","DNA로 증명된 결론"],a:2,e:"여러 가명과 냉전기 배경은 의문을 낳지만 특정 정보기관 요원이었다는 공식 증거는 공개되지 않았습니다."},
{q:"현재 공개 기록에 가장 부합하는 결론은?",o:["실제 신원과 사망 경위가 모두 밝혀졌다","살해범이 공식 지목됐다","신원과 마지막 행적의 중요한 부분이 미해결로 남아 있다","첩보 활동이 확정됐다"],a:2,e:"공개 자료에서 확인되는 것은 일부 물적·과학적 단서입니다. 신원과 사망의 전모는 확정되지 않았습니다."}
];
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);
function draw(){locked=false;const x=qs[i];$("count").textContent="QUESTION "+(i+1)+" / "+qs.length;$("q").textContent=x.q;$("opts").innerHTML="";x.o.forEach((v,n)=>{const b=document.createElement("button");b.textContent=String.fromCharCode(65+n)+". "+v;b.onclick=()=>answer(n);$("opts").appendChild(b)});$("fb").className="feedback";$("fb").textContent="";$("next").hidden=true}
function answer(n){if(locked)return;locked=true;const x=qs[i];if(n===x.a)score++;[...$("opts").children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#4c8b67";if(j===n&&n!==x.a)b.style.borderColor="#b66b61"});$("fb").textContent=(n===x.a?"정답! ":"정답은 "+x.o[x.a]+". ")+x.e;$("fb").classList.add("show");$("next").hidden=false;$("next").textContent=i===qs.length-1?"결과 보기":"다음 문제 →"}
$("next").onclick=()=>{if(i<qs.length-1){i++;draw()}else{$("count").textContent="RESULT";$("q").textContent=qs.length+"문제 중 "+score+"문제 정답";$("opts").innerHTML="";$("fb").textContent="좋은 추리는 확신을 키우는 일이 아니라, 증거가 말해주는 범위를 정확히 지키는 일입니다.";$("fb").classList.add("show");$("next").hidden=true}};draw();
</script></body></html>
