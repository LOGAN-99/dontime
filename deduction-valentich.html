</main><script>

{q:"비행 계획에 기록된 출발지와 목적지는?",o:["시드니에서 멜버른","무라빈에서 킹아일랜드","호바트에서 애들레이드","캔버라에서 론서스턴"],a:1,e:"보고서에는 Moorabbin 출발, King Island 도착으로 기록돼 있습니다."},
{q:"조종사가 19시 무렵 통과했다고 보고한 지점은?",o:["케이프 오트웨이","포트필립","킹스턴","태즈메이니아 북단"],a:0,e:"공식 보고서의 관련 사건 기록에는 19:00에 Cape Otway를 보고했다고 적혀 있습니다."},
{q:"조종사가 5,000피트 아래의 항공 교통을 물었을 때 비행 서비스가 답한 내용은?",o:["군용기가 확인됐다","알려진 항공 교통이 없었다","레이더에 두 대가 보였다","착륙하라고 지시했다"],a:1,e:"기록된 응답은 해당 고도 아래에 알려진 항공 교통이 없다는 내용입니다. 이는 조종사가 보고한 물체의 정체를 확인해 주지는 않습니다."},

let i=0,score=0,locked=false;const $=id=>document.getElementById(id);
