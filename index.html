let current="돈",timer,calcScope=null;
const $=s=>document.querySelector(s);
const el=id=>calcScope?calcScope.querySelector('#'+id):document.getElementById(id);
const won=n=>{
  n=Math.round(Number(n)||0);
  const sign=n<0?"-":"",v=Math.abs(n);
  if(v<10000) return sign+v.toLocaleString("ko-KR")+"원";
  const e=Math.floor(v/100000000), rem=v%100000000;
  const m=Math.floor(rem/10000), w=rem%10000;
  let s="";
  if(e) s+=e.toLocaleString("ko-KR")+"억원";
  if(m) s+=(e?" ":"")+formatKoreanMan(m)+"만원";
  if(w) s+=(e||m?" ":"")+w.toLocaleString("ko-KR")+"원";
  return sign+s;
};
const formatKoreanMan=m=>{
  if(m<10000) return m.toLocaleString("ko-KR");
  const cheon=Math.floor(m/1000), rem=m%1000;
  let s="";
  if(cheon) s+=cheon.toLocaleString("ko-KR")+"천";
  if(rem) s+=(cheon?" ":"")+rem.toLocaleString("ko-KR");
  return s;
};
const parseMoney=v=>{
  if(v===undefined||v===null)return 0;
  let s=String(v).replace(/\s|,/g,"");
  if(!s)return 0;
  let total=0;
  const e=s.match(/([0-9.]+)억/); if(e){total+=Number(e[1])*100000000;s=s.replace(e[0],"");}
  const man=s.match(/([0-9.]+)천만원/); if(man){total+=Number(man[1])*10000000;s=s.replace(man[0],"");}
  const man2=s.match(/([0-9.]+)만원/); if(man2){total+=Number(man2[1])*10000;s=s.replace(man2[0],"");}
  const c=s.match(/([0-9.]+)천/); if(c){total+=Number(c[1])*1000;s=s.replace(c[0],"");}
  const m=s.match(/([0-9.]+)만/); if(m){total+=Number(m[1])*10000;s=s.replace(m[0],"");}
  const n=Number(s.replace(/원/g,""));
  return total+(Number.isFinite(n)?n:0);
};
const num=id=>parseMoney(el(id)?.value||0);

function render(){
  cats.innerHTML=Object.keys(data).map(c=>'<div><button class="cat '+(c===current?'on':'')+'" onclick="current=\''+c+'\';render()">'+c+'</button><div class="subcats">'+data[c].map(x=>'<button class="subcat" draggable="true" ondragstart="dragService(event,\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onclick="event.stopPropagation();current=\''+c+'\';openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')">'+x[0]+'</button>').join('')+'</div></div>').join('');
  cards.innerHTML=data[current].map(x=>'<div class="card" draggable="true" ondragstart="dragService(event,\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" tabindex="0" onclick="openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')}"><h3>'+x[0]+'</h3><p class="copy">'+x[1]+'</p><p class="desc">'+(cardDescriptions[x[2]]||'입력한 값을 바탕으로 생활 속 필요한 계산을 빠르게 확인합니다.')+'</p><span class="hint">카드 전체 클릭 → 계산하기 · 드래그해서 비교창에 추가</span></div>').join('');
}
function renderToolCats(){
  const tc=el('toolcats');
  tc.innerHTML=Object.keys(data).map(c=>'<div><button class="cat '+(c===current?'on':'')+'" onclick="current=\''+c+'\';render();renderToolCats()">'+c+'</button><div class="subcats">'+data[c].map(x=>'<button class="subcat" draggable="true" ondragstart="dragService(event,\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onclick="openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')">'+x[0]+'</button>').join('')+'</div></div>').join('');
}

function home(){clearInterval(timer);stopAllCalcTimers();tool.classList.remove('on');document.querySelector('#home').style.display='block';renderToolCats();function textCompareTool(){
  box.innerHTML='<div class="panel"><div class="fields"><div class="field"><label>원문</label><textarea id="txt1" style="width:100%;min-height:160px;border:1px solid #d8dce1;border-radius:10px;padding:12px"></textarea></div><div class="field"><label>비교할 문장</label><textarea id="txt2" style="width:100%;min-height:160px;border:1px solid #d8dce1;border-radius:10px;padding:12px"></textarea></div></div><div class="actions"><button class="primary" onclick="compareText()">비교하기</button><button type="button" class="secondary reset-btn" onclick="resetCalculator()">↺ 초기화</button></div><div id="res"></div></div>';
}
function compareText(){const a=el('txt1').value,b=el('txt2').value;el('res').innerHTML='<div class="result">'+(a===b?'두 텍스트가 같습니다.':'두 텍스트가 다릅니다.')+'</div>';}
render();scrollTo(0,0)}
function field(id,label,val,type='number',placeholder='',cls=''){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+val+'" '+(placeholder?'placeholder="'+placeholder+'"':'')+(cls?' class="'+cls+'"':'')+'></div>'}
function serviceNotice(t){
  const legal=['net','weekly','overtime','leave','severance','minimum','ltv','dti','dsr','mortgage','loan','rent','acq','broker','homecash','deposit','saving','goal','yearend','vat','withholding','incomeTax','capitalgain','gift','installment','cardfee','fertility','ovulation','pregnancy','due','bmr','calorie','carloan'];
  if(legal.includes(t)) return '<div class="notice">※ 이 계산기는 입력한 기준값을 바탕으로 계산하는 참고용 도구입니다. 실제 금액은 적용 시점의 법령·제도·개인 조건에 따라 달라질 수 있습니다. 최신 기준을 확인한 후 이용해주세요.</div>';
  return '';
}
function openTool(t,title,copy){
  document.querySelector('#home').style.display='none';
  clearInterval(timer);
  tool.classList.add('on');
  renderToolCats();
  toolmain.innerHTML='<div id="dropzone" class="compare-drop" ondragover="event.preventDefault();this.classList.add(\'over\')" ondragleave="this.classList.remove(\'over\')" ondrop="dropService(event)"><button class="back" onclick="home()">← 목록으로</button><div class="tool-title-row"><div><h2>'+title+'</h2><p>'+copy+'</p></div><div class="compare-tip"><strong>계산기 비교하기</strong><span>왼쪽 계산기나 다른 카드를 이곳으로 드래그하세요.</span><span>여러 계산기를 같은 크기로 놓고 결과를 한눈에 비교할 수 있습니다.</span></div></div><div class="compare-items" id="compareItems"><div class="compare-card primary-tool-card" id="primaryTool"><div class="primary-card-title"><strong>'+title+'</strong><span>'+copy+'</span></div><div id="box"></div></div></div></div>';
  if(t==='income'||t==='off') live(t,el('box'));
  else if(['chars','words','lines','spaces','newlines','case','striphtml','sorttext'].includes(t)) textTool(t);
  else form(t);
  appendServiceNotice(el('box'),t);
}
function appendServiceNotice(target,t){
  const notice=serviceNotice(t);
  if(target&&notice) target.insertAdjacentHTML('beforeend',notice);
}
function dragService(event,t,title,copy){
  event.dataTransfer.setData('text/plain',JSON.stringify({t,title,copy}));
}
function dropService(event){
  event.preventDefault();
  const dz=el('dropzone'); if(dz) dz.classList.remove('over');
  let d; try{d=JSON.parse(event.dataTransfer.getData('text/plain'));}catch(e){return;}
  addCompare(d.t,d.title,d.copy);
}
function addCompare(t,title,copy){
  const wrap=el('compareItems'); if(!wrap)return;
  if([...wrap.children].some(x=>x.dataset.t===t)) return;
  const card=document.createElement('div');
  card.className='compare-card'; card.dataset.t=t;
  card.innerHTML='<div class="compare-head"><strong>'+title+'</strong><button onclick="this.closest(\'.compare-card\').remove()">×</button></div><p>'+copy+'</p><div class="compare-mini" id="mini-'+t+'"></div>';
  wrap.appendChild(card);
  renderMiniTool(t,el('mini-'+t));
}
function renderMiniTool(t,target){
  if(t==='income'||t==='off') live(t,target);
  else {
    form(t,target,true);
    const panel=target.firstElementChild;
    if(panel) panel.classList.add('mini-panel');
  }
  appendServiceNotice(target,t);
}
function form(t,target=el('box'),mini=false){
  let s='';
  if(t==='salary') s='<div class="field"><label>계산 방향</label><select id="dir"><option value="a">연봉 → 월급</option><option value="m">월급 → 연봉</option></select></div>'+moneyField('v','금액','4천만원');
  else if(t==='hourly') s=moneyField('monthly','월급','300만원')+field('hours','월 근무시간',209);
  else if(t==='net') s=moneyField('annual','연봉','4천만원')+moneyField('bonus','상여금','0원')+percentField('tax','예상 공제율(%)',10);
  else if(t==='weekly') s=field('days','주 소정근로일수',5)+field('hours','주 근로시간',40)+moneyField('hourly','시급','10,320원')+field('weeks','계산 주수',1);
  else if(t==='overtime') s=moneyField('hourly','통상시급','10,320원')+field('hours','연장근로시간',10)+field('night','야간근로시간',0)+percentField('rate','연장 가산율(%)',50)+percentField('nightRate','야간 가산율(%)',50);
  else if(t==='leave') s=moneyField('hourly','통상시급','10,320원')+field('days','미사용 연차일수',10)+field('hours','1일 소정근로시간',8);
  else if(t==='severance') s=moneyField('daily','1일 평균임금','100,000원')+field('days','계속근로일수',365)+field('daysPerYear','연간 퇴직금 산정일수',30);
  else if(t==='minimum') s=moneyField('hourly','내 시급','10,320원')+moneyField('standard','적용 최저시급','10,320원');
  else if(t==='worktime') s=field('start','출근','09:00','time')+field('end','퇴근','18:00','time')+field('break','휴게시간(분)',60);

  else if(t==='ltv') s=moneyField('price','주택가격','5억원')+percentField('rate','적용 LTV(%)',70);
  else if(t==='dti') s=moneyField('income','연소득','5천만원')+moneyField('debt','연간 원리금 상환액','1,500만원')+percentField('rate','적용 DTI 한도(%)',60);

function calc(t,button){
  const previousScope=calcScope;
  calcScope=button?.closest('.compare-card')||null;
  let r='';
  if(t==='salary'){const v=num('v');r=el('dir').value==='a'?won(v/12)+' / 월':'연봉 '+won(v*12);}
  else if(t==='hourly'){const h=Number(el('hours').value||0);r=h?won(num('monthly')/h)+' / 시간':'월 근무시간을 확인해주세요.';}
  else if(t==='net'){const gross=num('annual')+num('bonus'),tax=Number(el('tax').value||0);r=won(gross*(1-tax/100))+' / 예상 실수령';}
  else if(t==='weekly'){r=won(num('hourly')*Number(el('hours').value||0)*Number(el('weeks').value||1))+' / 계산기간';}
  else if(t==='overtime'){const base=num('hourly'),h=Number(el('hours').value||0),n=Number(el('night').value||0);r=won(base*h*(1+Number(el('rate').value||0)/100)+base*n*(Number(el('nightRate').value||0)/100))+' / 예상 수당';}
  else if(t==='leave'){r=won(num('hourly')*Number(el('days').value||0)*Number(el('hours').value||0));}
  else if(t==='severance'){r=won(num('daily')*Number(el('days').value||0)/365*Number(el('daysPerYear').value||30));}
  else if(t==='minimum'){r=num('hourly')>=num('standard')?'최저시급 기준 이상':'최저시급 기준 미달';}
  else if(t==='worktime'){
  let a=el('start').value.split(':').map(Number),b=el('end').value.split(':').map(Number);
  const scope=calcScope||document.getElementById('box');
  const key='worktime-'+(scope?.id||Math.random().toString(36).slice(2));
  stopCalcTimer(key);
  const tickWork=()=>{
    const now=new Date(),st=new Date(now),en=new Date(now);
    st.setHours(a[0],a[1],0,0); en.setHours(b[0],b[1],0,0);
    if(en<=st) en.setDate(en.getDate()+1);
    let currentStart=new Date(st),currentEnd=new Date(en);
    if(now<st && en.getDate()!==st.getDate()){currentStart.setDate(currentStart.getDate()-1);currentEnd.setDate(currentEnd.getDate()-1);}
    const remaining=Math.max(0,(currentEnd-now)/1000);
    const fmt=x=>String(Math.floor(x/3600)).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0')+'.'+String(Math.floor((x%1)*10000)).padStart(4,'0');
    const result=scope?.querySelector('[id^="res"]')||document.getElementById('res');
    if(result) result.innerHTML='<div class="result">퇴근까지 '+fmt(remaining)+'</div><div class="sub">남은 시간 '+remaining.toFixed(4)+'초</div>';
  };
  tickWork(); startCalcTimer(key,tickWork,50); calcScope=previousScope; return;
}
  else if(t==='ltv'){r=won(num('price')*Number(el('rate').value||0)/100)+' / 최대 대출 가능액';}
  else if(t==='dti'||t==='dsr'){const income=num('income'),debt=num('debt');r=income?(debt/income*100).toFixed(2)+'%':'연소득을 확인해주세요.';}
  else if(['loan','mortgage','carloan'].includes(t)){
  const m=Math.max(1,Number(el('years').value||0)*12),r0=Number(el('rate').value||0)/1200,p=num('p'),mode=el('repay')?.value||'annuity';
  if(!p){r='대출원금을 확인해주세요.';}
  else if(mode==='principal'){
    const principal=p/m;
    const first=principal+p*r0;
    const last=principal+Math.max(0,p-principal*(m-1))*r0;
    const avg=(first+last)/2;
    const totalInterest=r0?((p* (m+1)/2)):0;
    r='<div>첫 달 '+won(first)+' / 월</div><div>평균 '+won(avg)+' / 월</div><div>마지막 달 '+won(last)+' / 월</div><div>하루 평균 '+won(avg/30)+' / 일</div><div class="sub">총 이자 약 '+won(totalInterest)+'</div>';
  }else{
    const pay=r0?p*r0*Math.pow(1+r0,m)/(Math.pow(1+r0,m)-1):p/m;
    const totalInterest=pay*m-p;
    r='<div>'+won(pay)+' / 월</div><div>하루 환산 '+won(pay/30)+' / 일</div><div class="sub">총 이자 약 '+won(totalInterest)+'</div>';
  }
}
  else if(t==='rent'){r=won(num('deposit')*Number(el('rate').value||0)/100/12+num('monthly'))+' / 환산 월 부담액';}
  else if(t==='jeonseToRent'){
    const diff=Math.max(0,num('total')-num('newDeposit')), rate=Number(el('rate').value||0);
    const monthly=diff*rate/100/12;
    r=won(monthly)+' / 월세';
  }
  else if(t==='acq'||t==='broker'){r=won(num('price')*Number(el('rate').value||0)/100);}

  else if(t==='compound'){const p=num('p'),rate=Number(el('rate').value||0)/100,y=Number(el('years').value||0),add=num('add');r=won(p*Math.pow(1+rate,y)+add*((Math.pow(1+rate,y)-1)/rate||y))+' / 만기 예상금액';}
  else if(t==='deposit'){const p=num('p'),rate=Number(el('rate').value||0)/100,y=Number(el('years').value||0),gross=p*Math.pow(1+rate,y)-p,tax=gross*Number(el('tax').value||0)/100;r=won(p+gross-tax)+' / 세후 예상금액';}

  else if(t==='goal'){const target=num('target')-num('current'),m=Number(el('months').value||0),r0=Number(el('rate').value||0)/1200;const pay=r0?target*r0*Math.pow(1+r0,m)/(Math.pow(1+r0,m)-1):target/m;r=won(pay)+' / 월 필요금액';}
  else if(t==='return'){const buy=num('buy'),sell=num('sell'),qty=Number(el('qty').value||0);r=won((sell-buy)*qty-num('fee'))+' / 평가손익 ('+(buy?(sell/buy*100-100).toFixed(2):0)+'%)';}
  else if(t==='average'){const q1=Number(el('q1').value||0),q2=Number(el('q2').value||0);r=q1+q2?won((num('p1')*q1+num('p2')*q2)/(q1+q2)):'매수수량을 확인해주세요.';}
  else if(t==='dividend'){const gross=Number(el('qty').value||0)*num('dps');r=won(gross*(1-Number(el('tax').value||0)/100))+' / 연간 세후 배당금';}
  else if(t==='inflation'){r=won(num('money')/Math.pow(1+Number(el('rate').value||0)/100,Number(el('years').value||0)))+' / 미래 구매력 기준 현재가치';}
  else if(t==='yearend'){const base=Math.max(0,num('salary')-num('deduct')),tax=base*Number(el('tax').value||0)/100;r=won(Math.max(0,num('credit')-tax))+' / 단순 참고 환급액';}
  else if(t==='vat'){r=won(num('price')*Number(el('rate').value||0)/100)+' / 부가세';}
  else if(t==='withholding'){const gross=num('gross'),tax=gross*Number(el('rate').value||0)/100;r=won(gross-tax)+' / 실수령액';}
  else if(t==='incomeTax'){r=won(Math.max(0,num('income')*Number(el('rate').value||0)/100-num('credit')))+' / 단순 계산 세액';}
  else if(t==='capitalgain'){const gain=num('sell')-num('buy')-num('cost');r=won(Math.max(0,gain)*Number(el('rate').value||0)/100)+' / 단순 계산 세액';}
  else if(t==='gift'){r=won(Math.max(0,num('gift')-num('deduct'))*Number(el('rate').value||0)/100)+' / 단순 계산 세액';}
  else if(t==='workforbuy'){const price=num('price'),hourly=num('hourly');if(hourly>0){const totalSec=price/hourly*3600,h=Math.floor(totalSec/3600),m=Math.floor((totalSec%3600)/60),sec=Math.floor(totalSec%60);r='<div>'+h+'시간 '+m+'분 '+sec+'초</div><div class="sub">약 '+(price/hourly).toFixed(2)+'시간 일해야 합니다.</div>';}else r='시급을 확인해주세요.';}
  else if(t==='discount'){r=won(num('price')*(1-Number(el('rate').value||0)/100))+' / 할인가';}
  else if(t==='reverseDiscount'){const o=num('original'),p=num('sale');r=o?(100-p/o*100).toFixed(2)+'% 할인':'정가를 확인해주세요.';}
  else if(t==='unit'){const q=Number(el('qty').value||0);r=q?won(num('price')/q)+' / 개':'수량을 확인해주세요.';}
  else if(t==='installment'){const p=num('price'),m=Number(el('months').value||0),rate=Number(el('rate').value||0)/1200;const pay=rate?p*rate*Math.pow(1+rate,m)/(Math.pow(1+rate,m)-1):p/m;r=won(pay)+' / 월';}
  else if(t==='margin'){const sale=num('sale'),cost=num('cost');r=sale?((sale-cost)/sale*100).toFixed(2)+'% / 마진율':'판매가격을 확인해주세요.';}
  else if(t==='breakeven'){const fixed=num('fixed'),sale=num('price'),cost=num('cost');r=sale>cost?Math.ceil(fixed/(sale-cost))+'개 / 손익분기점':'판매가를 확인해주세요.';}
  else if(t==='cardfee'){r=won(num('sale')*Number(el('rate').value||0)/100)+' / 수수료';}
  else if(['fertility','ovulation','pregnancy','due'].includes(t)){const d=new Date(el('date').value),cycle=Number(el('cycle').value||28),ov=new Date(d);ov.setDate(ov.getDate()+cycle-14);if(t==='ovulation')r=ov.toLocaleDateString('ko-KR');else if(t==='due'){const x=new Date(d);x.setDate(x.getDate()+280);r=x.toLocaleDateString('ko-KR');}else if(t==='pregnancy'){r=Math.floor((new Date()-d)/604800000)+'주차';}else{const x=new Date(ov);x.setDate(x.getDate()-5);const y=new Date(ov);y.setDate(y.getDate()+1);r=x.toLocaleDateString('ko-KR')+' ~ '+y.toLocaleDateString('ko-KR');}}
  else if(t==='bmi'){const h=Number(el('h').value||0),w=Number(el('w').value||0);r=h?(w/Math.pow(h/100,2)).toFixed(1):'키를 확인해주세요.';}
  else if(t==='bmr'){const age=Number(el('age').value||0),h=Number(el('h').value||0),w=Number(el('w').value||0);r=(10*w+6.25*h-5*age+(String(el('sex').value).includes('여')?-161:5)).toFixed(0)+' kcal/일';}
  else if(t==='calorie'){r=(Number(el('weight').value||0)*Number(el('minutes').value||0)*Number(el('met').value||0)*3.5/200).toFixed(0)+' kcal';}
  else if(t==='off'){let a=el('start').value.split(':').map(Number),b=el('end').value.split(':').map(Number),work=(b[0]*60+b[1])-(a[0]*60+a[1]);if(work<0)work+=1440;r=Math.floor(work/60)+'시간 '+work%60+'분';}
  else if(t==='discharge'||t==='dday'){const days=Math.ceil((new Date(el('date').value)-new Date())/86400000);r=days>=0?'D-'+days:'D+'+Math.abs(days);}
  else if(t==='datediff'||t==='workdays'){const a=new Date(el('date1').value),b=new Date(el('date2').value);let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(t==='datediff'||![0,6].includes(d.getDay()))n++;}r=n+(t==='workdays'?' 근무일':'일');}
  else if(t==='timediff'){let a=el('time1').value.split(':').map(Number),b=el('time2').value.split(':').map(Number),m=(b[0]*60+b[1])-(a[0]*60+a[1]);if(m<0)m+=1440;r=Math.floor(m/60)+'시간 '+m%60+'분';}
  else if(t==='age'){const d=new Date(el('date').value),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;r=a+'세';}
  else if(t==='yearprogress'){const d=new Date(el('date').value),y=d.getFullYear(),start=new Date(y,0,1),end=new Date(y+1,0,1);r=((d-start)/(end-start)*100).toFixed(2)+'%';}
  else if(t==='fuel'||t==='kmcost'){const d=Number(el('distance').value||0),eff=Number(el('eff').value||0);r=eff?won(d/eff*num('gas')):'연비를 확인해주세요.';}
  else if(t==='ev'){r=won(Number(el('battery').value||0)*Number(el('rate').value||0)*Number(el('eff').value||100)/100);}
  else if(t==='unitconv'){const v=Number(el('value').value||0),from=el('from').value.trim().toLowerCase(),to=el('to').value.trim().toLowerCase();const map={mm:.001,cm:.01,m:1,km:1000,g:.001,kg:1,t:1000};r=map[from]&&map[to]?((v*map[from]/map[to]).toLocaleString('ko-KR')):'지원 단위를 확인해주세요.';}
  else if(t==='percent'){const a=Number(el('a').value||0),b=Number(el('b').value||0);r=a?(b/a*100).toFixed(2)+'%':'기준값을 확인해주세요.';}
  else if(t==='ratio'){const a=Number(el('a').value||0),b=Number(el('b').value||0),c=Number(el('c').value||0);r=a?((b/a)*c).toLocaleString('ko-KR'):'첫 번째 값을 확인해주세요.';}
  else if(t==='mean'){const a=String(el('v').value).split(',').map(Number).filter(Number.isFinite);r=a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2):'숫자를 입력해주세요.';}
  else if(t==='weighted'){const v=el('v').value.split(',').map(Number),w=el('w').value.split(',').map(Number),sum=w.reduce((a,b)=>a+b,0);r=sum?(v.reduce((a,x,i)=>a+x*(w[i]||0),0)/sum).toFixed(2):'가중치를 확인해주세요.';}
  else if(t==='mpg'){r=won(num('fuelcost'))+' / 입력한 주행 기준 연료비';}
  else if(t==='travel'){r=won(num('transport')+num('stay')+num('food')+num('etc'))+' / 총 여행경비';}
  else if(t==='fx'){r=won(Number(el('v').value||0)*Number(el('rate').value||0));}
  else if(t==='selling'){const cost=num('cost'),m=Number(el('margin').value||0)/100,f=Number(el('fee').value||0)/100;r=won(cost/(1-m-f))+' / 권장 판매가';}
  else if(t==='costrate'){const sales=num('sales');r=sales?(num('cost')/sales*100).toFixed(2)+'% / 원가율':'매출을 확인해주세요.';}
  else if(t==='platformfee'){r=won(num('sales')*Number(el('rate').value||0)/100)+' / 플랫폼 수수료';}
  else if(t==='labor'){r=won(num('salary')+num('insurance')+num('other'))+' / 월 총 인건비';}
  else if(t==='targetsales'){const m=Number(el('margin').value||0)/100;r=m?(won((num('fixed')+num('profit'))/m)+' / 목표 매출'): '공헌이익률을 확인해주세요.';}
  else r=won(num('amount'));
  const result=calcScope?calcScope.querySelector('[id^="res-"]'):document.getElementById('res');
  if(result) result.innerHTML='<div class="result">'+r+'</div>';
  calcScope=previousScope;
}
const calcTimers=new Map();
function stopCalcTimer(key){const id=calcTimers.get(key);if(id){clearInterval(id);calcTimers.delete(key);}}
function startCalcTimer(key,fn,ms=50){stopCalcTimer(key);const id=setInterval(fn,ms);calcTimers.set(key,id);return id;}
function stopAllCalcTimers(){calcTimers.forEach(id=>clearInterval(id));calcTimers.clear();}
function formatMoneyInput(input){
  const raw=String(input.value||'').trim();
  if(!raw) return;
  const n=parseMoney(raw);
  if(Number.isFinite(n) && n>0) input.value=won(n);
}
function bindMoneyInputs(){
  document.querySelectorAll('#box .money-input').forEach(input=>{
    input.addEventListener('blur',()=>formatMoneyInput(input));
    input.addEventListener('change',()=>formatMoneyInput(input));
  });
}
function resetCalculator(button){
  clearInterval(timer);
  const ownCard=button?.closest('.compare-card');
  if(ownCard){[...calcTimers.keys()].filter(k=>k.includes(ownCard.id)).forEach(stopCalcTimer);}
  else stopAllCalcTimers();
  const scope=button?.closest('.compare-card')||document.getElementById('box');
  scope.querySelectorAll('input').forEach(i=>{i.value=i.defaultValue;});
  scope.querySelectorAll('select').forEach(s=>{s.selectedIndex=0;});
  scope.querySelectorAll('textarea').forEach(t=>{t.value=t.defaultValue;});
  const r=scope.querySelector('[id^="res"]');
  if(r) r.innerHTML='';
  bindMoneyInputs();
  const livebox=scope.querySelector('#livebox');
  if(livebox) livebox.innerHTML='<div class="sub">입력한 뒤 시작하기를 눌러주세요.</div>';
}

function textTool(t){box.innerHTML='<div class="panel"><div class="field"><label>텍스트</label><textarea id="txt" style="width:100%;min-height:180px;border:1px solid #d8dce1;border-radius:10px;padding:12px"></textarea></div><div class="actions"><button class="primary" onclick="textCalc(\''+t+'\')">처리하기</button><button type="button" class="secondary reset-btn" onclick="resetCalculator()">↺ 초기화</button></div><div id="res"></div></div>'}
function textCalc(t){let x=txt.value,r=x;if(t==='chars')r='글자수: '+x.length;if(t==='words')r='단어수: '+(x.trim().match(/\S+/g)||[]).length;if(t==='lines')r='줄수: '+(x?x.split(/\r?\n/).length:0);if(t==='spaces')r=x.replace(/[ \t]+/g,'');if(t==='newlines')r=x.replace(/\r?\n/g,' ');if(t==='case')r=x===x.toUpperCase()?x.toLowerCase():x.toUpperCase();if(t==='striphtml')r=x.replace(/<[^>]*>/g,'');if(t==='sorttext')r=x.split(/\r?\n/).sort().join('\n');res.innerHTML='<pre style="white-space:pre-wrap">'+String(r).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>'}
function live(t,target=el('box')){
  const liveTarget=target, isOff=t==='off';
  liveTarget.innerHTML='<div class="panel"><div class="fields">'+
    (isOff?'':moneyField('salary','연봉','4천만원')+'<div class="field"><label>근무시간 기준</label><select id="basis"><option value="work">1일 8시간 기준 · 연 260일</option><option value="24">24시간 기준 · 365일 × 24시간</option><option value="hire">입사일 기준</option></select></div><div id="hireWrap" class="field" style="display:none"><label>입사일</label><input id="hireDate" type="date" value="2026-10-01"></div>')+
    field('start','출근','09:00','time')+
    field('end','퇴근','18:00','time')+
    '</div><div class="actions"><button class="primary" id="startBtn">'+(isOff?'카운트 시작':'시작하기')+'</button><button type="button" class="secondary reset-btn" onclick="resetCalculator(this)">↺ 초기화</button></div>'+
    '<div id="livebox" style="margin-top:20px"><div class="sub">'+(isOff?'출근·퇴근 시간을 입력하고 카운트를 시작해보세요.':'입력한 뒤 시작하기를 눌러주세요.')+'</div></div></div>';
  bindMoneyInputs();
  const scope=liveTarget.closest('.compare-card')||liveTarget;
  const timerKey=(isOff?'off-':'income-')+(scope.id||Math.random().toString(36).slice(2));
  const get=id=>scope.querySelector('#'+id);
  const basisSelect=get('basis');
  const hireWrap=get('hireWrap');
  if(basisSelect){
    const syncBasis=()=>{if(hireWrap) hireWrap.style.display=basisSelect.value==='hire'?'block':'none';};
    basisSelect.addEventListener('change',syncBasis); syncBasis();
  }
  scope.querySelector('#startBtn').onclick=()=>{
    stopCalcTimer(timerKey);
    const tick=()=>{
      const now=new Date();
      const [sh,sm]=get('start').value.split(':').map(Number), [eh,em]=get('end').value.split(':').map(Number);
      const st=new Date(now),en=new Date(now);
      st.setHours(sh,sm,0,0); en.setHours(eh,em,0,0);
      if(en<=st) en.setDate(en.getDate()+1);
      let currentSt=new Date(st),currentEn=new Date(en);
      if(now<st && en.getDate()!==st.getDate()){currentSt.setDate(currentSt.getDate()-1);currentEn.setDate(currentEn.getDate()-1);}
      const workSeconds=Math.max(1,(currentEn-currentSt)/1000);
      let elapsed=Math.max(0,Math.min(workSeconds,(now-currentSt)/1000));
      const remain=Math.max(0,(currentEn-now)/1000);
      const fmt=x=>String(Math.floor(x/3600)).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0')+'.'+String(Math.floor((x%1)*10000)).padStart(4,'0');
      const result=scope.querySelector('#livebox');
      if(isOff){
        result.innerHTML='<div class="sub">퇴근까지</div><div class="ticker">'+fmt(remain)+'</div><div class="sub">남은 시간 '+remain.toFixed(4)+'초</div>';
      }else{
        const annual=parseMoney(get('salary').value),basis=get('basis')?.value||'24';
        let earned=0,sec=0,detail='';
        if(basis==='work'){
          sec=annual/(260*8*3600);
          earned=elapsed*sec;
          detail='1일 8시간 기준 · 연 260일 · 경과 '+elapsed.toFixed(4)+'초 · 초당 '+sec.toFixed(4)+'원';
        }else if(basis==='hire'){
          const hd=new Date(get('hireDate').value+'T00:00:00');
          const since=Math.max(0,(now-hd)/1000);
          sec=annual/(365*24*3600);
          earned=since*sec;
          detail='입사일 '+get('hireDate').value+' 기준 · 경과 '+since.toFixed(4)+'초';
        }else{
          sec=annual/(365*24*3600);
          earned=elapsed*sec;
          detail='24시간 기준 · 경과 '+elapsed.toFixed(4)+'초 · 초당 '+sec.toFixed(4)+'원';
        }
        result.innerHTML='<div class="sub">현재 누적 수입</div><div class="ticker">'+earned.toFixed(4)+'원</div><div class="sub">'+detail+' · 퇴근까지 '+fmt(remain)+'</div>';
      }
    };
    tick(); startCalcTimer(timerKey,tick,50);
  };
}

render();renderToolCats();
