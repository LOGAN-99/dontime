const won=n=>{
  n=Math.round(Number(n)||0);
  const sign=n<0?"-":"",v=Math.abs(n);
  if(v<10000) return sign+v.toLocaleString("ko-KR")+"원";
  const e=Math.floor(v/100000000), rem=v%100000000;
  const m=Math.floor(rem/10000), w=rem%10000;
  let s="";
  if(e) s+=e.toLocaleString("ko-KR")+"억원";
  if(m) s+=(e?" ":"")+formatKoreanMan(m)+"만원";
  if(w) s+=(e||m?" ":"")+w.toLocaleString("ko-KR")+"원";
  return sign+s;
};
const formatKoreanMan=m=>{
  if(m<10000) return m.toLocaleString("ko-KR");
  const cheon=Math.floor(m/1000), rem=m%1000;
  let s="";
  if(cheon) s+=cheon.toLocaleString("ko-KR")+"천";
  if(rem) s+=(cheon?" ":"")+rem.toLocaleString("ko-KR");
  return s;
};
const parseMoney=v=>{
  if(v===undefined||v===null)return 0;
  let s=String(v).replace(/\s|,/g,"");
  if(!s)return 0;
  let total=0;
  const e=s.match(/([0-9.]+)억/); if(e){total+=Number(e[1])*100000000;s=s.replace(e[0],"");}
  const man=s.match(/([0-9.]+)천만원/); if(man){total+=Number(man[1])*10000000;s=s.replace(man[0],"");}
  const man2=s.match(/([0-9.]+)만원/); if(man2){total+=Number(man2[1])*10000;s=s.replace(man2[0],"");}
  const c=s.match(/([0-9.]+)천/); if(c){total+=Number(c[1])*1000;s=s.replace(c[0],"");}
  const m=s.match(/([0-9.]+)만/); if(m){total+=Number(m[1])*10000;s=s.replace(m[0],"");}
  const n=Number(s.replace(/원/g,""));
  return total+(Number.isFinite(n)?n:0);
};

function render(){
  const canDrag=window.innerWidth>700&&window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
  const dragAttr=canDrag?' draggable="true"':'';
  cats.innerHTML=Object.keys(data).map(c=>'<div><button class="cat '+(c===current?'on':'')+'" onclick="current=\''+c+'\';clearServiceSearch();render()">'+c+'</button><div class="subcats">'+data[c].map(x=>'<button class="subcat"'+dragAttr+' ondragstart="dragService(event,\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onclick="event.stopPropagation();current=\''+c+'\';openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')">'+x[0]+'</button>').join('')+'</div></div>').join('');
  const all=Object.entries(data).flatMap(([cat,items])=>items.map(x=>({cat,x})));
  const q=searchQuery.trim().toLowerCase();
  const items=q?all.filter(({cat,x})=>(cat+' '+x[0]+' '+x[1]+' '+(cardDescriptions[x[2]]||'')).toLowerCase().includes(q)).map(({x})=>x):data[current];
  if(q){
    cards.innerHTML=items.length?items.map(x=>'<div class="card"'+dragAttr+' ondragstart="dragService(event,\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" tabindex="0" onclick="openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')}"><h3>'+x[0]+'</h3><p class="copy">'+x[1]+'</p><p class="desc">'+(cardDescriptions[x[2]]||'입력한 값을 바탕으로 생활 속 필요한 계산을 빠르게 확인합니다.')+'</p><span class="hint">검색 결과 · 계산기 열기</span></div>').join(''):'<div class="search-empty"><strong>찾는 계산기가 아직 없어요.</strong><span>다른 단어로 검색하거나 카테고리에서 골라보세요.</span></div>';
    const meta=document.getElementById('searchMeta'); if(meta) meta.textContent=items.length+'개의 계산기를 찾았습니다.';
  }else{
    cards.innerHTML=items.map(x=>'<div class="card"'+dragAttr+' ondragstart="dragService(event,\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" tabindex="0" onclick="openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')}"><h3>'+x[0]+'</h3><p class="copy">'+x[1]+'</p><p class="desc">'+(cardDescriptions[x[2]]||'입력한 값을 바탕으로 생활 속 필요한 계산을 빠르게 확인합니다.')+'</p><span class="hint">카드 전체 클릭 → 계산하기 · 드래그해서 비교창에 추가</span></div>').join('');
    const meta=document.getElementById('searchMeta'); if(meta) meta.textContent='계산기 '+Object.values(data).reduce((n,v)=>n+v.length,0)+'개 · 원하는 계산기를 검색해보세요.';
  }
  renderRecentTools();
}
function renderToolCats(){
  const tc=el('toolcats');
  const canDrag=window.innerWidth>700&&window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
  const dragAttr=canDrag?' draggable="true"':'';
  tc.innerHTML=Object.keys(data).map(c=>'<div><button class="cat '+(c===current?'on':'')+'" onclick="current=\''+c+'\';if(window.innerWidth<=700){home();}else{render();renderToolCats();}">'+c+'</button><div class="subcats">'+data[c].map(x=>'<button class="subcat"'+dragAttr+' ondragstart="dragService(event,\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onclick="openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')">'+x[0]+'</button>').join('')+'</div></div>').join('');
}

function calendarStats(y){
  const arr=calendarHolidayData[y]||[];
  const holidays=new Map();
  arr.forEach(x=>holidays.set(x[0],holidays.has(x[0])?holidays.get(x[0])+' · '+x[1]:x[1]));
  let sat=0,sun=0,weekdays=0;
  for(let m=0;m<12;m++){
    const last=new Date(y,m+1,0).getDate();
    for(let d=1;d<=last;d++){const dow=new Date(y,m,d).getDay();if(dow===6)sat++;else if(dow===0)sun++;else weekdays++;}
  }
  return {holidays,holidayCount:holidays.size,sat,sun,weekdays};
}

function calendarMonthHtml(y,m,mini=false){
  const st=calendarStats(y),holidays=st.holidays,names=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],weeks=['일','월','화','수','목','금','토'];

    for(let i=0;i<offset;i++)cells+='<span class="empty">0</span>';
    for(let d=1;d<=last;d++){const key=String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),dow=new Date(y,m,d).getDay();cells+='<span class="'+((dow===0||holidays.has(key))?'h':'')+'">'+d+'</span>';}

  }

  for(let i=0;i<offset;i++)days+='<div class="calendar-day-single empty"></div>';
  for(let d=1;d<=last;d++){

  }
  return '<section class="calendar-focus"><div class="calendar-focus-head"><strong>'+y+'년 '+names[m]+'</strong><span>'+(m===new Date().getMonth()&&y===new Date().getFullYear()?'오늘 포함':'')+'</span></div><div class="calendar-single"><div class="calendar-week">'+weeks.map(w=>'<span>'+w+'</span>').join('')+'</div><div class="calendar-days-single">'+days+'</div></div></section>';

function calendarPickDate(y,m,d){
  const list=window.__calendarSelected||[];
  const same=list.some(x=>x.y===y&&x.m===m&&x.d===d);
  if(same){window.__calendarSelected=list.filter(x=>!(x.y===y&&x.m===m&&x.d===d));renderCalendar();return;}
  if(list.length>=2)window.__calendarSelected=[];
  const next=[...(window.__calendarSelected||[]),{y,m,d}];window.__calendarSelected=next;
  renderCalendar();
  const status=el('calendarDateStatus');
  if(status){
    if(next.length===1)status.textContent='첫 날짜: '+next[0].y+'.'+String(next[0].m+1).padStart(2,'0')+'.'+String(next[0].d).padStart(2,'0')+' · 두 번째 날짜를 선택하세요.';
    else{const a=new Date(next[0].y,next[0].m,next[0].d),b=new Date(next[1].y,next[1].m,next[1].d),days=Math.round(Math.abs(b-a)/86400000);status.textContent=next[0].y+'.'+String(next[0].m+1).padStart(2,'0')+'.'+String(next[0].d).padStart(2,'0')+' ↔ '+next[1].y+'.'+String(next[1].m+1).padStart(2,'0')+'.'+String(next[1].d).padStart(2,'0')+' = '+days+'일 차이';}
  }
}

function getIncomeRate(scope){
  if(!scope)return 0;
  const annual=parseMoney(scope.querySelector('#salary')?.value||0);
  if(!annual)return 0;
  const basis=scope.querySelector('input[name="incomeBasis"]:checked')?.value||'';
  if(basis==='work')return annual/(260*8*3600);
  if(basis==='24')return annual/(365*24*3600);
  if(basis==='hire')return annual/(365*24*3600);
  const start=scope.querySelector('#start')?.value||'09:00';
  const end=scope.querySelector('#end')?.value||'18:00';
  const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);
  const minutes=(eh*60+em)-(sh*60+sm)+(eh*60+em<=sh*60+sm?1440:0);
  const hours=Math.max(0,minutes/60);
  return hours?annual/(260*hours*3600):0;
}
function linkedWorkForBuy(target){
  target.innerHTML='<div class="panel mini-panel"><div class="field"><label>제품명 <span style="font-weight:400;color:#999">(선택)</span></label><input id="productName" type="text" value="" placeholder="예: 무선 이어폰"></div>'+moneyField('price','물건 가격','10만원')+'<div id="buyCountdown" style="margin-top:18px"><div class="sub">월급시계를 먼저 시작하면, 이 물건까지 남은 시간이 같이 줄어듭니다.</div></div></div>';
  bindMoneyInputs();
  const scope=target.closest('.compare-card');
  const timerKey='buy-linked-'+(scope?.id||Math.random().toString(36).slice(2));
  const primary=document.getElementById('primaryTool');
  const tick=()=>{
    const out=scope?.querySelector('#buyCountdown');
    if(!out)return;
    const price=parseMoney(scope.querySelector('#price')?.value||0);
    const name=(scope.querySelector('#productName')?.value||'').trim();
    const clock=primary?.__incomeClock;
    const rate=clock?.ratePerSec>0?clock.ratePerSec:getIncomeRate(primary);
    const label=name?name+'를 사려면':'이 물건을 사려면';
    if(!price){out.innerHTML='<div class="sub">물건 가격을 입력해주세요.</div>';return;}
    if(!(rate>0)){
      out.innerHTML='<div class="sub">월급시계의 연봉과 근무시간을 먼저 입력해주세요.</div>';
      return;
    }
    if(!clock?.startedAt){
      out.innerHTML='<div class="sub">월급시계를 시작하면 카운트다운이 바로 시작됩니다.</div><div class="result">'+label+' '+formatDuration(price/rate)+'</div><div class="sub">필요 노동시간 · 초당 '+rate.toFixed(4)+'원</div>';
      return;
    }
    const totalSec=price/rate;
    const elapsed=Math.max(0,(Date.now()-clock.startedAt)/1000);
    const remain=Math.max(0,totalSec-elapsed);
    if(remain<=0){
      out.innerHTML='<div class="sub">카운트다운 완료</div><div class="ticker">살 수 있는 시간 도착 🎉</div><div class="sub">'+label+' · '+won(price)+' · 월급시계 기준 초당 '+rate.toFixed(4)+'원</div>';

    }
    out.innerHTML='<div class="sub">'+label+'</div><div class="ticker">'+formatDuration(remain)+'</div><div class="sub">남은 노동시간 '+remain.toFixed(4)+'초 · 초당 '+clock.ratePerSec.toFixed(4)+'원</div>';
  };
  const formatDuration=x=>String(Math.floor(x/3600)).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0')+'.'+String(Math.floor((x%1)*10000)).padStart(4,'0');
  const priceInput=scope?.querySelector('#price');
  const productInput=scope?.querySelector('#productName');
  [priceInput,productInput].forEach(input=>input?.addEventListener('input',tick));
  tick();
  startCalcTimer(timerKey,tick,50);
}
function countdownTool(t,target=el('box'),mini=false){
  const liveTarget=target;
  const label=t==='discharge'?'전역까지':'목표일까지';
  const dateValue=new Date().toISOString().slice(0,10);
  const resultId=mini?'res-'+t+'-'+Math.random().toString(36).slice(2,8):'res';
  liveTarget.innerHTML='<div class="panel"><div class="field"><label>목표 날짜</label><input id="date" type="date" value="'+dateValue+'"></div><div class="actions"><button class="primary" id="countStartBtn">카운트 시작</button><button type="button" class="secondary reset-btn" onclick="resetCalculator(this)">↺ 초기화</button></div><div id="'+resultId+'" style="margin-top:20px"><div class="sub">목표 날짜를 입력하고 카운트를 시작해보세요.</div></div></div>';
  const scope=liveTarget.closest('.compare-card')||liveTarget;
  const key='countdown-'+t+'-'+(scope.id||Math.random().toString(36).slice(2));
  const get=id=>scope.querySelector('#'+id);
  const tick=()=>{
    const raw=get('date')?.value;
    const result=scope.querySelector('[id^="res"]');
    if(!result)return;
    if(!raw){result.innerHTML='<div class="sub">목표 날짜를 입력해주세요.</div>';return;}
    const targetEnd=new Date(raw+'T23:59:59.999');
    const remain=Math.max(0,targetEnd.getTime()-Date.now())/1000;
    const days=Math.floor(remain/86400);
    const hours=Math.floor((remain%86400)/3600);
    const minutes=Math.floor((remain%3600)/60);
    const seconds=Math.floor(remain%60);
    const ms=Math.floor((remain%1)*1000);
    const fmt=n=>String(n).padStart(2,'0');
    if(remain<=0){
      result.innerHTML='<div class="sub">'+label+'</div><div class="ticker">00일 00:00:00.000</div><div class="sub">목표 날짜가 도착했습니다 🎉</div>';
      return;
    }
    result.innerHTML='<div class="sub">'+label+'</div><div class="ticker">'+days+'일 '+fmt(hours)+':'+fmt(minutes)+':'+fmt(seconds)+'.'+String(ms).padStart(3,'0')+'</div><div class="sub">목표일 '+raw+' · 남은 시간 '+remain.toFixed(3)+'초</div>';
  };
  get('date')?.addEventListener('input',tick);
  get('date')?.addEventListener('change',tick);
  get('countStartBtn')?.addEventListener('click',()=>{
    startCalcTimer(key,tick,50);
    tick();
  });
  tick();
}

        const shiftStart=currentSt.getTime(),shiftEnd=currentEn.getTime();
        const elapsedFromWorkStart=Math.max(0,Math.min((nowForEarn-shiftStart)/1000,(shiftEnd-shiftStart)/1000));
        earned=elapsedFromWorkStart*sec;
        detail='출퇴근 시간 기준 · 하루 '+customHours.toFixed(2)+'시간 · 연 약 260일 · 휴게시간 포함 · 근무시간 내 실시간 누적 · 퇴근 후 정지 · 초당 '+sec.toFixed(4)+'원';
      }else if(basis==='work'){sec=annual/(260*8*3600);const nowForEarn=Date.now();const shiftStart=currentSt.getTime(),shiftEnd=currentEn.getTime();const elapsedFromWorkStart=Math.max(0,Math.min((nowForEarn-shiftStart)/1000,(shiftEnd-shiftStart)/1000));earned=elapsedFromWorkStart*sec;detail='1일 8시간 기준 · 연 약 260일 · 점심시간 1시간 제외 · 근무시간 내 실시간 누적 · 퇴근 후 정지 · 초당 '+sec.toFixed(4)+'원';}
      else if(basis==='hire'){const hireInput=get('hireDate');const hd=hireInput?.value?new Date(hireInput.value+'T00:00:00'):now;const since=Math.max(0,(now-hd)/1000);sec=annual/(365*24*3600);earned=since*sec;detail='입사일 '+(hireInput?.value||'')+' 기준 · 경과 '+since.toFixed(4)+'초 · 초당 '+sec.toFixed(4)+'원';}
      else{sec=annual/(365*24*3600);const nowForEarn=Date.now();const [startH,startM]=get('start').value.split(':').map(Number);const workStart=new Date(nowForEarn);workStart.setHours(startH,startM,0,0);const elapsedFromWorkStart=Math.max(0,(nowForEarn-workStart.getTime())/1000);earned=elapsedFromWorkStart*sec;detail='24시간 기준 · 연 365일 × 24시간 · 출근 시간부터 현재까지 실시간 누적 · 초당 '+sec.toFixed(4)+'원';}
      if(!isOff&&scope.__incomeClock) scope.__incomeClock.ratePerSec=sec;
      const hourlyValue=sec*3600; const elapsedFmt=fmt(runElapsed); result.innerHTML='<div class="sub">카운팅 시작 후 누적 수입</div><div class="ticker">'+earned.toFixed(4)+'원</div><div class="sub">'+detail+' · 시간당 '+hourlyValue.toFixed(2)+'원 · 누적 시간 '+elapsedFmt+' · 퇴근까지 '+fmt(remain)+'</div>';
    };
    tick(); startCalcTimer(timerKey,tick,50);
  };
  scope.querySelector('#startBtn').onclick=applyLiveSettings;
}
