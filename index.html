<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>돈시간 | 돈과 시간을 계산하는 생활 도구</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17191c;font-family:Arial,"Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
header{height:64px;background:#fff;border-bottom:1px solid #e7e9ed;display:flex;align-items:center}.top{max-width:1180px;width:100%;margin:auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900;cursor:pointer}.tag{font-size:13px;color:#777}
.wrap{max-width:1180px;margin:auto;padding:38px 22px 70px}.hero{margin-bottom:32px}.hero h1{font-size:42px;line-height:1.2;letter-spacing:-2px;margin:0 0 12px}.hero p{margin:0;color:#6f747c;font-size:16px}.layout{display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:start}.cats{position:sticky;top:20px;display:flex;flex-direction:column;gap:6px}.cat{border:1px solid #e1e4e8;background:#fff;border-radius:10px;padding:12px 14px;text-align:left;font-weight:700;color:#50555d;transition:.15s}.cat:hover{background:#f0f1f3}.cat.on{background:#17191c;color:#fff;border-color:#17191c}
.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{min-height:120px;background:#fff;border:1px solid #e2e5e9;border-radius:18px;padding:21px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px #0001;border-color:#cbd0d6}.card:focus-visible{outline:3px solid #17191c;outline-offset:2px}.card h3{margin:0 0 9px;font-size:19px}.copy{margin:0 0 16px;color:#343941;font-weight:700;line-height:1.45}.hint{font-size:12px;color:#999}.tool{display:none}.tool.on{display:block}.back{background:#eef0f3;border:0;border-radius:10px;padding:10px 14px;margin-bottom:20px}.tool h2{font-size:30px;margin:0 0 6px}.tool p{color:#777;margin:0 0 22px}.panel{background:#fff;border:1px solid #e1e4e8;border-radius:18px;padding:22px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #d8dce1;border-radius:10px;padding:12px}.actions{margin-top:17px;display:flex;gap:9px}.primary{background:#17191c;color:#fff;border:0;border-radius:10px;padding:11px 17px}.result{margin-top:18px;font-size:28px;font-weight:900}.sub{font-size:13px;color:#777}.live{font-variant-numeric:tabular-nums}.ticker{font-size:40px;font-weight:900}.footer{margin-top:45px;padding-top:22px;border-top:1px solid #ddd;color:#8a8f97;font-size:13px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.cats{position:static;flex-direction:row;overflow-x:auto;padding-bottom:5px}.cat{min-width:max-content}.hero h1{font-size:32px}.fields{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:25px 15px}.tag{display:none}.hero h1{font-size:29px}}
</style></head>
<body>
<header><div class="top"><div class="logo" onclick="home()">돈시간</div><div class="tag">돈을 시간으로, 시간을 돈으로.</div></div></header>
<main class="wrap">
<section id="home"><div class="hero"><h1>내 시간이 얼마인지,<br>이게 몇 시간짜리인지 계산해보세요.</h1><p>생활 속에서 자꾸 계산하게 되는 것들을 한곳에 모았습니다.</p></div>
<div class="layout"><aside id="cats" class="cats"></aside><div id="cards" class="grid"></div></div><div class="footer">돈시간 · 내 시간의 가치를 숫자로</div></section>
<section id="tool" class="tool"></section>
</main>
<script>
const data={
"돈":[["월급시계","1초에 얼마 벌고 있는지 알고 있어?","income"],["시급 계산","내 한 시간의 가격표","hourly"],["연봉 ↔ 월급","연봉을 월급으로, 월급을 연봉으로","salary"],["실수령액","통장에 실제로 들어오는 돈은?","net"],["주휴수당","일한 시간만큼 제대로 계산해보자","weekly"],["연장·야간수당","늦게까지 일한 시간도 숫자로","overtime"],["연차수당","남은 연차, 돈으로 보면 얼마?","leave"],["퇴직금","퇴직할 때 받을 돈을 미리 계산","severance"],["최저임금","내 시급, 기준보다 낮진 않을까?","minimum"],["근무시간","출근부터 퇴근까지 몇 시간?","worktime"]],
"부동산":[["LTV","집값보다 중요한 건 얼마까지 빌릴 수 있느냐","ltv"],["DTI","소득으로 보는 주택대출 부담","dti"],["DSR","내 소득으로 감당할 수 있는 대출은?","dsr"],["주담대 월상환","집을 사면 매달 얼마를 갚을까?","mortgage"],["대출이자","빌린 돈의 가격표","loan"],["전세 ↔ 월세","전세와 월세, 숫자로 비교","rent"],["취득세","집을 살 때 세금까지 계산","acq"],["중개수수료","부동산 수수료, 얼마가 적당할까?","broker"],["내 집 마련 현금","집값만 모으면 끝이 아니다","homecash"]],
"금융":[["복리 계산기","돈이 돈을 낳는 속도는?","compound"],["예금 이자","맡겨둔 돈이 얼마나 불어날까?","deposit"],["적금 이자","매달 넣으면 만기에 얼마?","saving"],["목표금액","1억 만들려면 매달 얼마가 필요할까?","goal"],["수익률","내 돈은 몇 % 벌었을까?","return"],["평균매입단가","여러 번 샀다면 평균은 얼마?","average"],["배당금","내 주식이 1년에 주는 돈","dividend"],["인플레이션","오늘의 100만원, 나중엔 얼마의 가치일까?","inflation"]],
"세금":[["연말정산","13월의 월급, 얼마나 돌려받을까?","yearend"],["부가세","가격 속 부가세를 꺼내보자","vat"],["원천징수","떼이는 세금, 미리 계산","withholding"],["소득세 참고","소득에 따라 세금은 어떻게 달라질까?","incomeTax"],["양도차익","팔아서 얼마나 남았을까?","capitalgain"],["증여세 참고","증여할 때 세금은 얼마나?","gift"]],
"소비":[["할인 계산","결제 버튼 누르기 전에 한 번 더.","discount"],["역산 할인율","이 가격이면 몇 % 할인일까?","reverseDiscount"],["개당 단가","묶음이 정말 싼 걸까?","unit"],["할부","한 번에 내기 아픈 금액을 나눠보자","installment"],["마진율","팔고 나서 진짜 남는 돈","margin"],["손익분기점","몇 개 팔아야 본전일까?","breakeven"],["카드수수료","결제금액에서 빠지는 돈","cardfee"]],
"건강":[["가임기","예상 가임기를 날짜로 확인","fertility"],["배란일","주기를 기준으로 예상 날짜 계산","ovulation"],["임신주수","마지막 생리일 기준 몇 주차일까?","pregnancy"],["출산예정일","예정일을 날짜로 계산","due"],["BMI","키와 몸무게로 BMI 확인","bmi"],["기초대사량","가만히 있어도 필요한 에너지","bmr"],["칼로리","먹고 움직인 칼로리를 계산","calorie"]],
"시간":[["퇴근 카운트다운","퇴근은 온다. 초 단위로.","off"],["전역 카운트다운","그날까지 얼마나 남았지?","discharge"],["D-Day","기다리는 날까지 정확히","dday"],["날짜 차이","두 날짜 사이가 며칠이지?","datediff"],["근무일수","주말 빼고 실제 며칠 일했을까?","workdays"],["시간 차이","시간도 계산해야 정확하다.","timediff"],["나이 계산","몇 살인지, 만 나이까지","age"],["올해 진행률","올해가 얼마나 지나갔을까?","yearprogress"]],
"자동차":[["자동차 할부","차값, 매달 얼마씩 낼까?","carloan"],["연료비","한 달에 기름값이 얼마나 들지?","fuel"],["km당 비용","내 차는 1km에 얼마를 먹을까?","kmcost"],["전기차 충전비","충전 한 번에 얼마일까?","ev"]],
"문자·단어":[["글자수","몇 글자인지 바로 세기","chars"],["단어수","단어가 몇 개인지 세기","words"],["줄수","몇 줄인지 한눈에","lines"],["공백 제거","쓸데없는 공백을 싹 정리","spaces"],["줄바꿈 제거","한 줄로 깔끔하게","newlines"],["대소문자 변환","영문 대소문자 한 번에","case"],["HTML 태그 제거","HTML 껍데기만 벗기기","striphtml"],["텍스트 정렬","줄마다 뒤죽박죽이면 정리","sorttext"],["텍스트 비교","두 문장, 뭐가 달라졌지?","diff"]],
"생활":[["단위변환","cm, m, km부터 무게까지","unitconv"],["퍼센트","퍼센트 계산, 헷갈리면 여기","percent"],["비율","비율과 비례를 빠르게","ratio"],["평균","숫자의 평균을 바로 계산","mean"],["가중평균","각 숫자의 중요도까지 반영","weighted"],["연비","차가 얼마나 효율적으로 달릴까?","mpg"],["여행경비","여행 전에 총액부터","travel"],["환전","외화가 원화로 얼마지?","fx"]],
"사업":[["판매가","원가와 목표 마진으로 가격 정하기","selling"],["원가율","매출에서 원가가 차지하는 비율","costrate"],["온라인 수수료","플랫폼에 빠지는 돈까지 계산","platformfee"],["인건비","사람 한 명을 고용하면 실제 비용은?","labor"],["목표매출","원하는 순이익을 내려면 매출 얼마?","targetsales"]]};
let current="돈",timer;
const $=s=>document.querySelector(s),won=n=>Math.round(n).toLocaleString("ko-KR")+"원",num=id=>Number($(id)?.value||0);
function render(){cats.innerHTML=Object.keys(data).map(c=>'<button class="cat '+(c===current?'on':'')+'" onclick="current=\''+c+'\';render()">'+c+'</button>').join('');cards.innerHTML=data[current].map(x=>'<div class="card" tabindex="0" onclick="openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openTool(\''+x[2]+'\',\''+x[0]+'\',\''+x[1]+'\')}"><h3>'+x[0]+'</h3><p class="copy">'+x[1]+'</p><span class="hint">카드 전체 클릭 → 계산하기</span></div>').join('')}
function home(){clearInterval(timer);tool.classList.remove('on');document.querySelector('#home').style.display='block';render();scrollTo(0,0)}
function field(id,label,val,type='number'){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+val+'"></div>'}
function openTool(t,title,copy){document.querySelector('#home').style.display='none';tool.classList.add('on');tool.innerHTML='<button class="back" onclick="home()">← 목록으로</button><h2>'+title+'</h2><p>'+copy+'</p><div id="box"></div>';if(t==='income'||t==='off')live();else if(['chars','words','lines','spaces','newlines','case','striphtml','sorttext'].includes(t))textTool(t);else form(t)}
function form(t){let s='';if(t==='salary')s=field('v','금액',40000000)+'<div class="field"><label>방향</label><select id="dir"><option value="a">연봉 → 월급</option><option value="m">월급 → 연봉</option></select></div>';else if(t==='ltv')s=field('price','집값',500000000)+field('rate','LTV(%)',70);else if(['loan','mortgage','carloan'].includes(t))s=field('p','대출금/차량가격',300000000)+field('rate','연이율(%)',4)+field('years','기간(년)',30);else if(t==='compound')s=field('p','원금',10000000)+field('rate','연이율(%)',5)+field('years','기간(년)',10);else if(t==='return')s=field('buy','매수가',10000)+field('sell','현재가',12000)+field('qty','수량',100);else if(t==='average')s=field('p1','1차 가격',10000)+field('q1','1차 수량',10)+field('p2','2차 가격',8000)+field('q2','2차 수량',20);else if(t==='discount')s=field('price','정가',50000)+field('rate','할인율(%)',20);else if(t==='unit')s=field('price','총 가격',30000)+field('qty','수량',10);else if(t==='percent')s=field('a','기준값',100)+field('b','비교값',80);else if(t==='mean')s=field('v','숫자(쉼표 구분)','10,20,30','text');else if(t==='fx')s=field('v','외화 금액',100)+field('rate','환율',1400);else if(t==='bmi')s=field('h','키(cm)',170)+field('w','몸무게(kg)',65);else if(t==='age'||t==='dday'||t==='discharge'||t==='due'||t==='datediff')s=field('date','날짜',new Date().toISOString().slice(0,10),'date');else if(t==='fuel'||t==='kmcost')s=field('distance','거리(km)',1000)+field('eff','연비(km/L)',12)+field('gas','연료가격',1700);else if(t==='ev')s=field('battery','배터리(kWh)',60)+field('rate','충전단가',300);else s=field('a','값',100)+field('b','비교값',20);box.innerHTML='<div class="panel"><div class="fields">'+s+'</div><div class="actions"><button class="primary" onclick="calc(\''+t+'\')">계산하기</button></div><div id="res"></div></div>'}
function calc(t){let r='';if(t==='salary')r=$(dir).value==='a'?won(num('v')/12):won(num('v')*12);else if(t==='ltv')r=won(num('price')*num('rate')/100);else if(t==='compound')r=won(num('p')*Math.pow(1+num('rate')/100,num('years')));else if(['loan','mortgage','carloan'].includes(t)){let m=num('years')*12,r0=num('rate')/1200,p=num('p'),pay=r0? p*r0*Math.pow(1+r0,m)/(Math.pow(1+r0,m)-1):p/m;r=won(pay)+' / 월';}else if(t==='return')r=won((num('sell')-num('buy'))*num('qty'))+' (수익률 '+(num('sell')/num('buy')*100-100).toFixed(2)+'%)';else if(t==='average')r=won((num('p1')*num('q1')+num('p2')*num('q2'))/(num('q1')+num('q2')));else if(t==='discount')r=won(num('price')*(1-num('rate')/100));else if(t==='unit')r=won(num('price')/num('qty'))+' / 개';else if(t==='percent')r=(num('b')/num('a')*100).toFixed(2)+'%';else if(t==='mean'){let a=$(v).value.split(',').map(Number).filter(Number.isFinite);r=(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2)}else if(t==='fx')r=won(num('v')*num('rate'));else if(t==='bmi')r=(num('w')/Math.pow(num('h')/100,2)).toFixed(1);else if(t==='age'){let d=new Date($(date).value),n=new Date(),a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;r=a+'세';}else if(t==='dday'||t==='discharge'||t==='due'){let d=new Date($(date).value),days=Math.ceil((d-new Date())/86400000);r=days>=0?'D-'+days:'D+'+Math.abs(days)}else if(t==='fuel'||t==='kmcost')r=won(num('distance')/num('eff')*num('gas'));else if(t==='ev')r=won(num('battery')*num('rate'));else r=won(num('a')-num('b'));res.innerHTML='<div class="result">'+r+'</div>'}
function textTool(t){box.innerHTML='<div class="panel"><div class="field"><label>텍스트</label><textarea id="txt" style="width:100%;min-height:180px;border:1px solid #d8dce1;border-radius:10px;padding:12px"></textarea></div><div class="actions"><button class="primary" onclick="textCalc(\''+t+'\')">처리하기</button></div><div id="res"></div></div>'}
function textCalc(t){let x=txt.value,r=x;if(t==='chars')r='글자수: '+x.length;if(t==='words')r='단어수: '+(x.trim().match(/\S+/g)||[]).length;if(t==='lines')r='줄수: '+(x?x.split(/\r?\n/).length:0);if(t==='spaces')r=x.replace(/[ \t]+/g,'');if(t==='newlines')r=x.replace(/\r?\n/g,' ');if(t==='case')r=x===x.toUpperCase()?x.toLowerCase():x.toUpperCase();if(t==='striphtml')r=x.replace(/<[^>]*>/g,'');if(t==='sorttext')r=x.split(/\r?\n/).sort().join('\n');res.innerHTML='<pre style="white-space:pre-wrap">'+String(r).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>'}
function live(){box.innerHTML='<div class="panel"><div class="fields">'+field('salary','연봉',40000000)+field('start','출근','09:00','time')+field('end','퇴근','18:00','time')+'</div><div id="livebox" style="margin-top:20px"></div></div>';function tick(){let now=new Date(),[sh,sm]=start.value.split(':').map(Number),[eh,em]=end.value.split(':').map(Number),st=new Date(now),en=new Date(now);st.setHours(sh,sm,0,0);en.setHours(eh,em,0,0);let sec=num('salary')/(260*8*3600),earned=Math.max(0,Math.min(8*3600,(now-st)/1000))*sec,remain=Math.max(0,(en-now)/1000);livebox.innerHTML='<div class="sub">현재 누적 수입</div><div class="ticker">'+earned.toFixed(4)+'원</div><div class="sub">초당 '+sec.toFixed(4)+'원 · 퇴근까지 '+Math.floor(remain/3600)+':'+String(Math.floor(remain%3600/60)).padStart(2,'0')+':'+String(Math.floor(remain%60)).padStart(2,'0')+'</div>'}tick();clearInterval(timer);timer=setInterval(tick,50)}
render();
</script></body></html>
