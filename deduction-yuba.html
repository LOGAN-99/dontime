<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 012 추리 퀴즈 | 셈플리</title><meta name="description" content="유바 카운티 5인 실종 사건의 공개 기록을 바탕으로 사실과 추론을 구분하는 8문제 추리 퀴즈."><link rel="canonical" href="https://dontime.kr/deduction-yuba.html"><meta name="robots" content="index,follow"><style>body{margin:0;background:#101820;color:#edf2f4;font:16px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 18px}.nav{display:flex;justify-content:space-between}.nav a,.links a{color:#e8c58f;text-decoration:none;font-weight:800}.card{background:#172431;border:1px solid #485d6b;border-radius:16px;padding:22px;margin:18px 0}.eyebrow{font:900 11px monospace;letter-spacing:.17em;color:#e8c58f}h1{font-size:clamp(30px,6vw,46px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #5c7180;border-radius:10px;background:#0f1a24;color:#edf2f4;font:inherit;cursor:pointer}.opts button:disabled{cursor:default;opacity:.85}.feedback{display:none;background:#223544;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#e0c18e;color:#111b24;border:0;border-radius:9px;padding:12px 17px;font-weight:bold;cursor:pointer}.muted{color:#b2c0c9}</style></head><body><main class="wrap"><header class="nav"><a href="/">셈플리</a><a href="/yuba-county-five.html">다큐로 돌아가기</a></header><section class="card"><div class="eyebrow">CASE 012 · YUBA COUNTY FIVE</div><h1>기록으로 추리하기</h1><p class="muted">공개 보도와 확인 가능한 기록을 바탕으로 답을 골라보세요. 목격담과 수사상 판단을 확정된 사실과 구분합니다.</p></section><section class="card"><div class="eyebrow" id="count"></div><p class="question" id="q"></p><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button id="next" hidden>다음 문제 →</button></section><section class="card links"><div class="eyebrow">RELATED</div><a href="/maze16.html">창작 미궁 PART 16</a> · <a href="/mystery.html">다른 사건 보기</a></section></main><script>
const qs=[{"q":"다섯 사람이 치코에서 농구 경기를 관람한 날짜는?","o":["1978년 2월 24일","1978년 3월 24일","1979년 2월 24일","1977년 2월 24일"],"a":0,"e":"ABC News의 사건 연표는 마지막 외출을 1978년 2월 24일로 기록합니다."},{"q":"경기 뒤 다섯 사람이 들른 곳으로 마지막 공개 목격 보도에 등장하는 장소는?","o":["주유소","Behr's Market","기차역","산림청 관리소"],"a":1,"e":"ABC News는 경기 뒤 Behr's Market에 들러 간식을 산 장면을 마지막 공개 목격으로 소개합니다."},{"q":"다섯 사람이 타고 이동한 차량은 어떤 차종으로 보도됐는가?","o":["1969년형 Mercury Montego","1972년형 Ford Mustang","1968년형 Chevrolet Impala","1970년형 Dodge Charger"],"a":0,"e":"사건 보도와 사건 목록은 잭 매드루가 소유의 1969년형 Mercury Montego를 언급합니다."},{"q":"차량이 발견된 지역은?","o":["시에라 네바다 동쪽 사막","플루마스 국유림의 눈 덮인 외딴 도로","샌프란시스코 항구","치코 시내 주차장"],"a":1,"e":"차량은 귀가 경로에서 벗어난 플루마스 국유림의 눈 덮인 산악도로에서 발견됐습니다."},{"q":"1978년 6월 4일 산림청 트레일러 안에서 발견된 사람은?","o":["게리 매티어스","잭 매드루가","테드 와이어","빌 스털링스"],"a":2,"e":"테드 와이어는 6월 4일 트레일러 안에서 발견됐고, 나머지 세 사람의 유해는 며칠 뒤 주변에서 발견됐습니다."},{"q":"다섯 사람 가운데 1978년 6월까지 유해가 발견된 사람은 몇 명인가?","o":["두 명","세 명","네 명","다섯 명"],"a":2,"e":"네 사람의 유해가 발견됐고, 게리 매티어스는 발견되지 않았습니다."},{"q":"ABC News가 인용한 2020년 보안관실 서신의 표현을 가장 정확하게 설명한 것은?","o":["게리의 생존을 확인했다고 발표했다","범죄 피해자일 가능성을 언급하고 사건이 실종·살인 사건으로 계속 열려 있다고 밝혔다","용의자를 특정해 기소했다고 밝혔다","사건을 사고로 종결했다고 밝혔다"],"a":1,"e":"서신의 표현은 수사기관의 판단과 사건 상태를 설명한 것이며, 범행 방식이나 가해자가 입증됐다는 뜻은 아닙니다."},{"q":"목격자 조지프 숀스의 진술을 다룰 때 가장 타당한 태도는?","o":["진술 하나로 다섯 사람의 이동 경로를 확정한다","진술이 바뀐 적이 있으므로 모든 다른 기록도 거짓으로 본다","보도된 진술의 변동과 본인의 불확실성 표현을 함께 고려하고 단독 증거로 단정하지 않는다","목격자가 언급한 불빛을 곧바로 특정 인물의 신원 증거로 삼는다"],"a":2,"e":"목격담은 조사할 가치가 있지만, 진술의 변화와 불확실성을 고려해야 하며 독립적인 뒷받침 없이 사실로 확정할 수 없습니다."}];
let i=0,score=0,done=false;const $=x=>document.getElementById(x);

function answer(n){if(done)return;done=true;const x=qs[i];if(n===x.a)score++;$('opts').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#d6b77f';if(j===n&&n!==x.a)b.style.borderColor='#b66b61'});$('fb').textContent=(n===x.a?'정답! ':'정답은 '+x.o[x.a]+'. ')+x.e;$('fb').classList.add('show');$('next').hidden=false;$('next').textContent=i===qs.length-1?'결과 보기':'다음 문제 →';}
$('next').onclick=()=>{if(i<qs.length-1){i++;draw();}else{$('count').textContent='RESULT';$('q').textContent=qs.length+'문제 중 '+score+'문제 정답';$('opts').innerHTML='<a href="/yuba-county-five.html">다큐 다시 보기</a>';$('fb').textContent='좋은 추리는 기록의 강도와 불확실성을 함께 평가합니다.';$('fb').classList.add('show');$('next').hidden=true;}};draw();
</script></body></html>
