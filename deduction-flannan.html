<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 010 추리 퀴즈 · 플래넌 제도 등대지기 실종 | 셈플리</title><meta name="description" content="Northern Lighthouse Board와 National Records of Scotland의 공개 기록을 바탕으로 플래넌 제도 등대지기 실종 사건의 사실과 조사관의 추론을 구분하는 8문제 퀴즈."><link rel="canonical" href="https://dontime.kr/deduction-flannan.html"><style>body{margin:0;background:#09151e;color:#edf2f3;font:15px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 18px 70px}.nav{display:flex;justify-content:space-between}.nav a{color:#e5bd82;text-decoration:none;font-weight:900}.card{background:#132530;border:1px solid #3b5663;border-radius:16px;padding:22px;margin:18px 0}.eyebrow{font:900 10px monospace;color:#e5bd82;letter-spacing:.16em}h1{font-size:clamp(30px,6vw,45px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #405965;border-radius:10px;background:#0b1b26;color:#edf2f3;font:inherit;cursor:pointer}.opts button:disabled{cursor:default}.feedback{display:none;background:#1c343f;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#e5bd82;color:#14232b;border:0;border-radius:9px;padding:12px 17px;font-weight:900}.muted{color:#b2c1c7}</style></head><body><main class="wrap"><header class="nav"><a href="/">셈플리</a><a href="/flannan-isles.html">CASE 010 다큐</a></header><section class="card"><div class="eyebrow">CASE 010 · EVIDENCE-BASED QUIZ</div><h1>불이 꺼진 등대의 기록</h1><p class="muted">Northern Lighthouse Board가 공개한 1900년 무어의 편지와 1901년 뮤어헤드 보고서, National Records of Scotland의 기록 안내를 바탕으로 구성했습니다. 확인된 기록과 조사관의 추론, 문학적 각색을 구분해 보세요.</p></section><section class="card"><div class="eyebrow" id="count"></div><p class="question" id="q"></p><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button id="next" hidden>다음 문제 →</button></section><section class="card"><h2>더 살펴보기</h2><p><a href="/maze14.html" style="color:#e5bd82">미궁 PART 14 · 북쪽 등대의 기록실</a></p><p><a href="/mystery.html" style="color:#e5bd82">해외 미제사건 목록</a></p></section></main><script>
const qs=[
{q:"1900년 12월 당시 플래넌 제도 등대에 근무하던 세 사람은?",o:["제임스 듀캇, 토머스 마셜, 도널드 맥아더","조지프 무어, 윌리엄 로스, 로버트 뮤어헤드","제임스 듀캇, 조지프 무어, 윌리엄 로스","토머스 마셜, 로버트 뮤어헤드, 조지프 무어"],a:0,e:"Northern Lighthouse Board의 기록은 제임스 듀캇, 토머스 마셜, 도널드 맥아더를 당시 세 근무자로 적습니다. 조지프 무어는 해안 기지에 있었고 윌리엄 로스는 병가 중이었습니다."},
{q:"보급선 Hesperus가 빈 등대를 확인한 날짜는?",o:["1900년 12월 15일","1900년 12월 18일","1900년 12월 20일","1900년 12월 26일"],a:3,e:"Hesperus는 정기 교대 방문으로 1900년 12월 26일 도착했고, 조지프 무어가 등대 안에 아무도 없음을 확인했습니다."},
{q:"등대 근무 일지의 마지막 정식 기재 날짜는?",o:["12월 7일","12월 13일","12월 15일","12월 26일"],a:1,e:"공식 자료는 근무 일지의 마지막 정식 기재를 12월 13일로 설명합니다. 12월 15일 오전 관측은 나중에 옮겨 적기 전 슬레이트에 남아 있었습니다."},
{q:"12월 15일 오전 슬레이트에 남아 있었다고 기록된 관측 시각은?",o:["오전 3시","오전 6시","오전 9시","정오"],a:2,e:"기압·온도와 바람 상태 등은 12월 15일 오전 9시까지 슬레이트에 기록되어 있었고, 오전 업무가 끝났음을 시사합니다."},
{q:"조지프 무어가 등대 안에서 확인한 상태와 가장 가까운 것은?",o:["램프와 렌즈가 파손되고 주방이 어질러져 있었다","램프는 준비되어 있었고 렌즈·기계는 청소됐으며 주방은 정돈되어 있었다","세 근무자의 짐과 일지가 모두 사라져 있었다","불이 켜진 채로 등대 문이 활짝 열려 있었다"],a:1,e:"무어의 편지는 램프가 청소됐고 연료 분수대가 가득했으며, 후속 기록은 렌즈와 기계가 깨끗하고 주방이 정돈돼 있었다고 설명합니다."},
{q:"뮤어헤드 보고서가 서쪽 착륙장 부근에서 기록한 물적 흔적은?",o:["등대 탑이 무너지고 렌즈가 바다로 떨어졌다","철제 난간이 비틀리고 큰 돌과 계류 장비가 옮겨져 있었다","동쪽 착륙장의 밧줄이 모두 잘려 있었다","보급선의 닻이 절벽 위에서 발견됐다"],a:1,e:"보고서는 서쪽 통로의 난간 손상, 20cwt가 넘는 돌의 이동, 계류 밧줄 상자와 장비의 유실, 높은 곳의 구명 부표 유실을 기록합니다."},
{q:"1901년 1월 8일 뮤어헤드가 가장 유력하다고 본 설명은?",o:["세 사람이 다른 배를 타고 섬을 떠났다","세 사람이 폭풍을 피해 등대 안에 숨어 있었다","서쪽 착륙장 근처에서 예상하지 못한 큰 너울에 휩쓸렸다","등대의 불빛이 고장 나 실종 신고가 잘못됐다"],a:2,e:"뮤어헤드는 세 사람이 계류 장비를 확인하러 서쪽 착륙장 근처에 갔다가 거대한 너울에 휩쓸렸다는 설명이 가장 유력하다고 썼습니다. 이는 조사관의 결론이지 목격된 장면은 아닙니다."},
{q:"National Records of Scotland가 현재 소장하지 않는다고 명시한 자료는?",o:["1901년 1월 8일 뮤어헤드 조사 보고서","1900년 12월 28일 조지프 무어의 편지","플래넌 제도 등대의 원래 근무 일지","Hesperus 선장의 실종 전보 사본"],a:2,e:"NRS는 플래넌 등대의 원래 근무 일지가 자신들이 인수한 기록에 포함되지 않았다고 명시합니다. 다른 조사 문서와 편지, 전보 사본은 NLC3/1/1 등에서 확인할 수 있습니다."}
];
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);
function draw(){locked=false;const x=qs[i];$("count").textContent="QUESTION "+(i+1)+" / "+qs.length;$("q").textContent=x.q;$("opts").innerHTML=x.o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$("fb").className="feedback";$("fb").textContent="";$("next").hidden=true;$("opts").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(+b.dataset.n))}
function answer(n){if(locked)return;locked=true;const x=qs[i];if(n===x.a)score++;$("opts").querySelectorAll("button").forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#8bc5b5";if(j===n&&n!==x.a)b.style.borderColor="#c17d74"});$("fb").textContent=(n===x.a?"정답입니다. ":"정답은 "+x.o[x.a]+". ")+x.e;$("fb").classList.add("show");$("next").hidden=false;$("next").textContent=i===qs.length-1?"결과 보기":"다음 문제 →"}
$("next").onclick=()=>{if(i<qs.length-1){i++;draw()}else{$("count").textContent="RESULT";$("q").textContent=qs.length+"문제 중 "+score+"문제 정답";$("opts").innerHTML='<a href="/flannan-isles.html" style="color:#e5bd82">다큐 다시 보기</a> · <a href="/maze14.html" style="color:#e5bd82">연결 미궁</a>';$("fb").textContent="공식 조사관의 설명은 기록에 근거한 추론입니다. 직접 목격되지 않은 마지막 장면은 확인된 사실로 바꿔 쓰지 않습니다.";$("fb").classList.add("show");$("next").hidden=true}};
draw();
</script></body></html>
