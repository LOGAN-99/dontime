<header class="hero"><div class="eyebrow">PART 10 · THE SEALED DRAWER ARCHIVE</div><h1 class="title">봉인된 서랍의 기록실</h1><p class="muted">열네 개의 기록실을 지나며 날짜, 출처, 인수 절차를 맞춰라. 단 하나의 열쇠는 빈칸을 억지로 채우지 않는 태도다.</p><p class="note">완전한 허구의 기록관 이야기입니다. 실제 시카고 타이레놀 사건의 인물·증거·수사 장면을 재현하지 않습니다.</p></header>
<section class="card"><div class="meter"><span id="label">CHAPTER 01 / 14</span><span id="score">정답 0개</span></div><div class="progress"><span id="bar"></span></div><h2 id="title" class="title" style="font-size:24px"></h2><p id="story" class="story"></p><p id="question" class="question"></p><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" hidden>다음 장면 →</button></section>
</main><script>
const chapters=[
{title:"첫 번째 봉인",story:"야간 기록관의 문이 열렸다. 세 장의 반입표에는 08:10, 08:25, 08:40이 적혀 있다. 관장은 가장 이른 기록부터 배열하라고 했다.",q:"세 기록의 올바른 시간 순서는?",o:["08:40 → 08:25 → 08:10","08:10 → 08:25 → 08:40","08:25 → 08:10 → 08:40","08:10 → 08:40 → 08:25"],a:1,e:"08:10, 08:25, 08:40 순으로 시간이 증가합니다."},
{title:"엇갈린 봉인 번호",story:"상자의 봉인 번호가 인수대장과 다르다. 담당자는 차이가 생긴 이유를 아직 모른다.",q:"가장 먼저 해야 할 조치는?",o:["누군가 열었다고 단정한다","차이를 기록하고 원본 대장과 봉인 이력을 확인한다","상자를 폐기한다","대장 번호를 임의로 고친다"],a:1,e:"번호 불일치는 확인해야 할 차이입니다. 그 자체만으로 누가 언제 열었는지 입증하지는 않습니다."},
{title:"관찰과 해석",story:"현장 메모에는 '봉투 오른쪽 모서리에 2cm 찢김이 있다'고 적혀 있다. 옆에는 '누군가 문서를 빼냈다'는 추측이 쓰여 있다.",q:"직접 관찰한 사실은?",o:["누군가 문서를 빼냈다","봉투 오른쪽 모서리에 2cm 찢김이 있다","담당자가 고의로 훼손했다","문서가 반드시 사라졌다"],a:1,e:"찢김의 위치와 크기는 관찰 가능한 내용입니다. 원인과 의도는 추가 자료가 필요합니다."},
{title:"원본의 목소리",story:"같은 사건을 설명하는 자료가 두 개 있다. 하나는 작성자와 시각이 적힌 서명 원본이고, 다른 하나는 출처가 없는 요약 메모다.",q:"내용을 검증할 때 먼저 확인할 자료는?",o:["출처 없는 요약 메모","서명과 작성 시각이 있는 원본 기록","가장 짧은 메모","가장 최근에 복사된 종이"],a:1,e:"서명·시각·작성 경로가 확인되는 원본은 출처를 추적할 수 있어 우선 확인할 가치가 큽니다."},
{title:"끊긴 인수 서명",story:"상자 이동 기록에는 10:00 반출과 11:00 반입이 적혀 있지만, 중간 인수자의 서명이 비어 있다.",q:"확인 가능한 가장 정확한 설명은?",o:["상자가 한 시간 동안 사라졌다","중간 시간대의 인수 담당자를 기록만으로 확인할 수 없다","인수자가 상자를 훼손했다","반출 기록이 거짓이다"],a:1,e:"서명 공백은 인수 연속성의 확인 구간을 남깁니다. 누가 무엇을 했는지 단정할 수 없습니다."},
{title:"서로 다른 사본",story:"두 사본의 문장 하나가 다르다. 어느 쪽이 바뀌었는지 아직 모른다. 기록관장은 원본 확인 전까지 둘 다 보존하라고 했다.",q:"가장 적절한 처리 방법은?",o:["한 사본을 지우고 하나만 남긴다","두 사본을 보존하고 차이를 기록한 뒤 원본을 찾는다","다수결로 문장을 선택한다","두 문장을 평균해 새 문장을 만든다"],a:1,e:"충돌하는 자료는 둘 다 보존해야 검증이 가능합니다. 원본과 복사 경로를 확인해야 합니다."},
{title:"세 개의 서랍",story:"18개의 파일을 세 서랍에 똑같이 나누어 넣으라는 지시가 있다. 각 서랍에는 같은 수의 파일이 들어가야 한다.",q:"서랍 하나에 들어갈 파일 수는?",o:["5개","6개","7개","9개"],a:1,e:"18을 3으로 나누면 서랍마다 6개입니다."},
{title:"두 번째 사본의 행방",story:"목록에는 '사본 1/3, 사본 2/3, 사본 3/3'이 적혀 있다. 실제 선반에는 1과 3만 보인다.",q:"현재 확정할 수 있는 내용은?",o:["두 번째 사본의 내용","두 번째 사본이 현재 선반에서 확인되지 않는다","두 번째 사본은 처음부터 존재하지 않았다","첫 번째와 세 번째 사본이 위조됐다"],a:1,e:"현재 확인되는 것은 두 번째 사본이 선반에서 보이지 않는다는 사실뿐입니다."},
{title:"날짜 없는 메모",story:"한 메모에는 내용과 작성자 서명이 있지만 날짜가 없다. 다른 문서와 비슷한 문장이 있어 같은 날 작성됐을 것이라는 의견이 나왔다.",q:"메모의 날짜는 어떻게 분류해야 할까?",o:["비슷한 문서의 날짜로 확정한다","날짜 미확인으로 남긴다","가장 오래된 날짜를 적는다","오늘 날짜로 바꾼다"],a:1,e:"문장 유사성만으로 작성일을 확정할 수 없으므로 날짜 미확인으로 표시해야 합니다."},
{title:"엇갈리는 두 시각",story:"독립 작성 여부가 확인되지 않은 두 기록이 같은 시각을 적고 있다. 기록관은 그 일치가 무엇을 뜻하는지 물었다.",q:"가장 신중한 결론은?",o:["두 기록이 완전히 독립된 증거다","한 기록이 다른 기록을 복사했다","같은 시각이 적혀 있지만 기록의 독립성은 아직 미확인이다","시각이 반드시 틀렸다"],a:2,e:"표기된 시각의 일치는 관찰되지만, 두 문서가 독립적으로 작성됐는지는 별도 검증이 필요합니다."},
{title:"스캔본의 한 페이지",story:"스캔본에는 12쪽이 있지만 종이 원본 묶음에는 11쪽만 있다. 스캔 날짜와 스캔 담당자는 기록돼 있다.",q:"다음으로 확인할 항목은?",o:["스캔본을 삭제한다","스캔 장비·파일 이력과 원본 묶음의 보관 기록을 비교한다","12쪽이 위조됐다고 발표한다","원본을 임의로 12쪽으로 수정한다"],a:1,e:"스캔 과정과 원본 보관 경로를 함께 확인해야 페이지 차이의 원인을 좁힐 수 있습니다."},
{title:"동기화되지 않은 시계",story:"출입 기록은 10:05, 벽시계 사진은 10:08을 가리킨다. 두 시계가 같은 기준으로 맞춰졌다는 자료는 없다.",q:"시간 순서를 확정하기 전에 필요한 것은?",o:["두 시각을 평균한다","시계의 오차와 동기화 기록을 확인한다","더 늦은 시각을 버린다","사진의 시각을 무조건 신뢰한다"],a:1,e:"시계가 동기화되지 않았다면 표시된 시각만으로 사건 순서를 단정할 수 없습니다."},
{title:"세 번째 열쇠",story:"열쇠 규칙에는 '서랍 번호의 두 배가 열쇠 번호'라고 적혀 있다. 세 번째 서랍 앞에 열쇠 꾸러미가 놓였다.",q:"세 번째 서랍에 맞는 열쇠 번호는?",o:["3","5","6","9"],a:2,e:"서랍 번호 3의 두 배는 6입니다."},
{title:"마지막 기록실",story:"관장은 마지막 문 앞에 세 칸을 남겼다. 첫 칸은 관찰, 둘째 칸은 해석, 셋째 칸은 아직 모르는 내용이다. 세 칸을 섞지 않는 사람이 문을 열 수 있다.",q:"기록을 공개할 때 가장 중요한 원칙은?",o:["빈칸을 추측으로 채운다","흥미로운 가설을 사실처럼 쓴다","관찰된 사실·추론·미확인 사항을 분리한다","서로 다른 출처의 차이를 지운다"],a:2,e:"사실과 추론, 미확인 사항을 구분해야 기록을 검증할 수 있고 과장된 결론을 막을 수 있습니다."}
];
let at=0,score=0,locked=false;const $=id=>document.getElementById(id);
function render(){locked=false;const x=chapters[at];$("label").textContent="CHAPTER "+String(at+1).padStart(2,"0")+" / "+chapters.length;$("score").textContent="정답 "+score+"개";$("bar").style.width=((at+1)/chapters.length*100)+"%";$("title").textContent=x.title;$("story").textContent=x.story;$("question").textContent=x.q;$("options").innerHTML="";x.o.forEach((v,n)=>{const b=document.createElement("button");b.textContent=String.fromCharCode(65+n)+". "+v;b.onclick=()=>answer(n);$("options").appendChild(b)});$("feedback").className="feedback";$("feedback").textContent="";$("next").hidden=true}
function answer(n){if(locked)return;locked=true;const x=chapters[at];if(n===x.a)score++;[...$("options").children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#8bb5b2";if(j===n&&n!==x.a)b.style.borderColor="#c18b82"});$("feedback").textContent=(n===x.a?"기록이 맞아떨어졌습니다. ":"다른 단서를 다시 살펴보세요. ")+x.e;$("feedback").classList.add("show");$("score").textContent="정답 "+score+"개";$("next").hidden=false;$("next").textContent=at===chapters.length-1?"기록실 최종 확인":"다음 장면 →"}
$("next").onclick=()=>{if(at<chapters.length-1){at++;render()}else{$("label").textContent="ARCHIVE COMPLETE";$("title").textContent="봉인된 서랍이 열렸다";$("story").textContent="기록관은 빠진 정보를 억지로 채우지 않았다. 확인된 시간은 시간표에, 직접 관찰한 흔적은 사실란에, 설명이 필요한 가설은 추론란에 남겼다. 마지막 서랍에는 '모르는 것을 모른다고 적는 것'이 가장 정확한 기록이라는 문장이 있었다.";$("question").textContent=chapters.length+"개 퍼즐 중 "+score+"개 정답";$("options").innerHTML='<a href="/tylenol-murders.html">CASE 006 다큐 보기</a> · <a href="/maze.html">미궁 목록으로</a>';$("feedback").textContent="정확한 기록은 빈칸을 상상으로 채우지 않는 데서 시작됩니다.";$("feedback").classList.add("show");$("next").hidden=true;$("bar").style.width="100%"}};
render();
</script></body></html>
