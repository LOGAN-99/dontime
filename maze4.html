<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101722"><meta name="description" content="비가 멈춘 적 없는 도시의 폐쇄된 천문대. 14장의 단서와 논리 퍼즐로 사라진 관측자의 마지막 밤을 추적하는 인터랙티브 추리 스토리."><link rel="canonical" href="https://dontime.kr/maze4.html"><meta name="robots" content="index,follow"><title>미궁 4부: 별이 사라진 밤 | 셈플리</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@500;600;700;800;900&display=swap" rel="stylesheet"><style>

led{opacity:.8}.feedback{margin-top:14px;padding:13px;border-radius:12px;background:#263b46;line-height:1.8;display:none}.feedback.show{display:block}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.controls button:last-child{background:var(--ice);color:#14202b;border-color:var(--ice)}.muted{color:var(--muted);font-size:11px;margin-top:20px}@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:18px 13px 45px}.side{padding:17px}.chapters{grid-template-columns:repeat(7,1fr)}.story{min-height:0;padding:22px}.head{padding:17px 14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3220276859043248" crossorigin="anonymous"></script></head>
<body><header class="head"><a class="brand" href="/maze.html">셈플리 미궁<small>ORIGINAL MYSTERY · PART 04</small></a><a class="link" href="/maze.html">스토리 목록</a></header><main class="wrap"><aside class="side"><div class="kicker">THE VANISHING STAR</div><h1>별이 사라진 밤</h1><p>폐쇄된 산악 천문대에서 관측 기록과 연구원이 동시에 사라졌다. 마지막 관측 시각, 잠긴 문, 서로 다른 시계. 14개의 장에서 단서를 모아 진실을 밝혀라.</p><div class="progress"><span id="bar"></span></div><p id="progressText">1 / 14장</p><div class="chapters" id="chapters"></div><p class="muted">진행 상황은 이 기기에 자동 저장됩니다.</p></aside><article class="story"><div class="kicker" id="chapterKicker">CHAPTER 01 · FIRST SIGNAL</div><h2 id="title"></h2><div class="text" id="body"></div><div class="clue" id="clue"></div><section class="puzzle"><div class="kicker">DEDUCTION TEST</div><p id="question" class="text"></p><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div></section><div class="controls"><button id="reset">처음부터 다시</button><button id="next" disabled>다음 장으로 →</button></div></article></main>
<script>
const chapters=[
{t:"불 꺼진 돔",b:"폭풍이 지나간 새벽, 산악 천문대의 돔은 안쪽에서 잠겨 있다. 연구 책임자 서윤은 보이지 않고, 망원경은 하늘이 아니라 바닥을 향한다. 제어실에는 세 개의 시계가 남아 있다.",c:"벽시계는 23:40, 컴퓨터는 23:35, 손목시계는 23:50을 가리킨다. 전원 기록에는 23:35에 정전이 시작되었다고 적혀 있다.",q:"정전이 시작된 시각과 일치하는 시계는?",o:["벽시계","컴퓨터 시계","손목시계","세 시계 모두"],a:1,e:"컴퓨터 시계가 전원 기록과 같은 23:35를 가리킨다. 다만 시계가 맞는다고 기록 전체가 진실인 것은 아니다."},
{t:"젖지 않은 우산",b:"현관에는 젖은 우산 두 개가 놓여 있다. 그러나 서윤의 책상 아래에는 접힌 우산 하나가 바싹 마른 채 발견된다. 그날 밤 천문대 밖에는 폭우가 쏟아졌다.",c:"현관 출입 기록에는 22:10 이후 외부 출입이 없다고 적혀 있다.",q:"마른 우산이 가장 강하게 시사하는 것은?",o:["서윤은 비를 맞았다","우산은 정전 뒤에 새로 도착했다","우산 주인은 건물 안에 있었을 수 있다","비가 오지 않았다"],a:2,e:"마른 우산만으로 주인을 확정할 수는 없지만, 우산 주인이 이미 건물 안에 있었을 가능성이 있다."},
{t:"세 번의 노크",b:"야간 경비원 도현은 23시 무렵 금속문에서 세 번 두드리는 소리를 들었다고 한다. 복도 녹음에는 소리가 없지만, 난방 배관의 압력이 그 시각 급격히 변했다.",c:"배관은 식으면서 금속이 수축할 때 불규칙한 소리를 낸다.",q:"현재 단서만으로 가장 신중한 판단은?",o:["누군가 문을 두드렸다","소리는 배관에서 났을 가능성이 있다","서윤이 사라졌다는 증거다","경비원이 거짓말했다"],a:1,e:"배관 압력 변화는 대안 설명이다. 소리만으로 사람의 존재를 단정하지 않는다."},
{t:"빈 관측 기록",b:"그날 밤의 별 관측 파일은 비어 있다. 다만 프린터에는 별자리 좌표가 한 줄 인쇄되어 있고, 종이 가장자리에는 파란 잉크가 묻어 있다.",c:"좌표는 북쪽 하늘의 베가를 가리킨다. 출력 시각은 23:32다.",q:"이 기록이 확실히 보여 주는 사실은?",o:["서윤이 베가를 직접 보았다","23:32에 좌표 출력이 있었다","별이 사라졌다","파일이 조작되었다"],a:1,e:"출력물은 좌표가 출력되었다는 사실을 보여 줄 뿐, 누가 출력했는지는 알려 주지 않는다."},
{t:"잠긴 서랍",b:"서윤의 책상 서랍은 잠겨 있다. 열쇠는 서랍 위 유리컵 안에 들어 있다. 서랍 안에는 빈 봉투와 낡은 사진 한 장이 있다.",c:"사진 뒤에는 ‘빛은 사라져도 그림자는 남는다’라고 적혀 있다.",q:"열쇠의 위치로부터 알 수 있는 것은?",o:["누군가 서랍을 열었다고 확정된다","열쇠가 컵 안에 있다는 것뿐이다","사진이 범행 동기다","서랍은 잠긴 적이 없다"],a:1,e:"열쇠가 컵 안에 있다는 관찰과 누가 서랍을 열었는지는 별개의 주장이다."},
{t:"세 사람의 알리바이",b:"도현은 경비실에 있었다고 하고, 민재는 발전기실을 점검했다고 한다. 지안은 기록실에서 데이터를 복사했다고 주장한다. 세 사람의 출입 카드가 모두 23:30에 사용됐다.",c:"카드 시스템은 같은 카드가 복제되면 중복 사용을 경고한다. 이번 로그에는 경고가 없다.",q:"로그가 가장 직접적으로 뒷받침하는 것은?",o:["세 사람이 모두 한곳에 있었다","세 카드가 23:30에 사용됐다","세 사람의 진술이 모두 참이다","서윤은 외부에 있었다"],a:1,e:"로그는 카드 사용 시각을 기록할 뿐, 카드 소지자의 실제 위치를 완전히 증명하지는 않는다."},
{t:"뒤집힌 망원경",b:"망원경은 창문이 아니라 바닥의 원형 자국을 향한다. 바닥에는 삼각대가 놓였던 먼지 없는 자국이 남아 있다.",c:"삼각대 자국의 중심은 돔 중앙이 아니라 오래된 바닥 패널 위다.",q:"가장 유력한 다음 조사 대상은?",o:["천장 조명","바닥 패널","현관 우산","식당 메뉴"],a:1,e:"망원경과 삼각대가 같은 바닥 패널을 향하고 있어 패널을 조사할 이유가 생긴다."},
{t:"패널 아래",b:"패널 아래에는 좁은 서비스 통로가 있다. 통로 바닥의 먼지는 한 방향으로 쓸려 있고, 끝에는 오래된 케이블이 연결되어 있다.",c:"케이블은 관측 돔의 비상 전원 스위치로 이어진다.",q:"먼지 자국이 말해 주는 가장 합리적인 것은?",o:["누군가 최근 통로를 지났을 수 있다","서윤이 반드시 통로를 이용했다","통로는 오늘 만들어졌다","케이블은 가짜다"],a:0,e:"먼지의 흔적은 최근 이동 가능성을 시사하지만 이동한 사람을 특정하지 않는다."},
{t:"비상 전원",b:"비상 전원 스위치에는 파란 잉크가 묻어 있다. 기록실 프린터 주변의 잉크와 색조가 비슷하지만, 잉크 성분 분석은 아직 끝나지 않았다.",c:"스위치 기록은 23:36에 수동 전환이 있었다고 표시한다.",q:"현재 가장 강한 연결 고리는?",o:["파란 잉크가 같은 잉크임이 입증됐다","23:36 수동 전환 기록","서윤의 지문이 발견됐다","돔이 폭발했다"],a:1,e:"수동 전환 기록은 시간 정보가 있는 직접 단서다. 잉크 유사성은 추가 검증이 필요하다."},
{t:"사라진 별",b:"서윤의 노트에는 ‘별은 사라진 것이 아니라 가려졌다’라는 문장이 있다. 관측 장비의 렌즈 덮개가 닫힌 채 발견되었다.",c:"베가는 그날 밤 실제 하늘에 떠 있었으며, 구름은 23:30에 걷혔다.",q:"‘별이 사라졌다’는 표현의 가장 타당한 해석은?",o:["베가가 우주에서 사라졌다","관측 장비가 별빛을 가렸을 수 있다","천문대가 다른 행성으로 이동했다","기록이 모두 진실이다"],a:1,e:"렌즈 덮개가 닫혀 있으면 별은 장비 안에서 보이지 않을 수 있다. 관측의 실패와 천체의 소멸은 다르다."},
{t:"찢긴 사진",b:"낡은 사진은 두 조각으로 찢겨 있다. 한쪽에는 서윤과 연구팀이, 다른 쪽에는 돔 바닥의 원형 패널이 찍혀 있다. 사진 뒷면의 글씨는 서윤의 노트와 닮았다.",c:"사진은 8년 전 촬영된 것으로 인화지 날짜가 확인된다.",q:"사진으로 확실히 알 수 있는 것은?",o:["현재의 범인을 확인했다","8년 전 패널이 사진에 찍혔다","서윤이 오늘 밤 떠났다","글씨가 반드시 서윤의 것이다"],a:1,e:"사진은 과거의 패널 존재를 보여 주지만 현재 사건의 책임자나 글씨의 필자를 확정하지 않는다."},
{t:"기록의 빈틈",b:"지안의 복사 기록은 23:31에 시작해 23:39에 끝난다. 그러나 파일의 생성 시간은 23:34로 표시된다. 시스템은 복사 도중에도 생성 시각을 기록할 수 있다.",c:"서버 설명서에 따르면 파일 생성 시간은 복사 시작 시각과 일치하지 않을 수 있다.",q:"시간 차이를 해석하는 가장 좋은 태도는?",o:["지안이 거짓말했다고 단정한다","시간 기록의 의미를 확인한 뒤 판단한다","컴퓨터가 범인이다","기록을 전부 버린다"],a:1,e:"시간 차이는 의심할 단서지만, 시스템의 기록 방식부터 확인해야 정확한 해석이 가능하다."},
{t:"마지막 신호",b:"비상 전원 로그와 통로 먼지, 닫힌 렌즈 덮개를 겹쳐 보니 누군가 관측 장비를 의도적으로 우회해 전원을 바꾼 흔적이 드러난다. 서윤의 책상에는 연구 윤리 위반을 알리는 초안이 남아 있다.",c:"초안에는 특정인의 이름이 적혀 있지 않다. 서윤은 증거를 모으려 했던 것으로 보인다.",q:"현재 증거로 가장 타당한 결론은?",o:["범인의 이름까지 확정됐다","장비 조작 가능성이 높지만 행위자는 미확정이다","서윤이 별을 훔쳤다","모든 일이 우연이었다"],a:1,e:"여러 단서는 장비 조작 가능성을 뒷받침하지만 행위자를 특정할 증거는 부족하다."},
{t:"새벽의 해답",b:"새벽이 밝자 서비스 통로의 끝에서 서윤의 음성 기록이 발견된다. ‘관측을 멈춘 건 내가 아니다. 기록을 지우려는 사람보다 먼저 원본을 숨겼다.’ 음성 파일의 위치는 연구팀 모두가 접근할 수 있는 공용 보관함이었다.",c:"파일은 서윤이 직접 남겼지만, 누가 장비를 조작했는지는 아직 추가 조사와 대조가 필요하다.",q:"사건을 마무리하는 가장 책임 있는 결론은?",o:["의심만으로 한 사람을 범인으로 지목한다","원본을 보존하고 출입·전원 기록을 추가 대조한다","단서를 모두 삭제한다","서윤이 돌아왔으니 조사를 끝낸다"],a:1,e:"추리의 결론은 증거의 강도에 맞춰야 한다. 원본을 보존하고 독립적인 기록을 대조하는 것이 다음 단계다."}
];
let current=Number(localStorage.getItem("maze4Chapter")||0);let solved=new Set(JSON.parse(localStorage.getItem("maze4Solved")||"[]"));
const $=id=>document.getElementById(id);
function draw(){const x=chapters[current];$("chapterKicker").textContent="CHAPTER "+String(current+1).padStart(2,"0")+" · CASE FILE";$("title").textContent=x.t;$("body").textContent=x.b;$("clue").textContent="단서: "+x.c;$("question").textContent=x.q;$("options").innerHTML="";$("feedback").className="feedback";$("feedback").textContent="";$("next").disabled=!solved.has(current);$("next").textContent=current===13?"사건 기록 다시 보기 ↻":"다음 장으로 →";$("progressText").textContent=(current+1)+" / 14장";$("bar").style.width=((current+1)/14*100)+"%";$("chapters").innerHTML="";chapters.forEach((v,i)=>{const b=document.createElement("button");b.textContent=i+1;b.className=i===current?"active":"";b.disabled=i>0&&!solved.has(i-1);b.onclick=()=>{current=i;save();draw()};$("chapters").appendChild(b)});x.o.forEach((v,i)=>{const b=document.createElement("button");b.textContent=String.fromCharCode(65+i)+". "+v;b.onclick=()=>answer(i);$("options").appendChild(b)})}
function answer(i){const x=chapters[current];const bs=[...$("options").children];bs.forEach(b=>b.disabled=true);if(i===x.a){solved.add(current);$("feedback").textContent="정답입니다. "+x.e;$("feedback").className="feedback show";$("next").disabled=false;save()}else{$("feedback").textContent="아직 단서가 부족해요. 다시 읽고 선택해 보세요.";$("feedback").className="feedback show";bs[i].disabled=false}}
function save(){localStorage.setItem("maze4Chapter",String(current));localStorage.setItem("maze4Solved",JSON.stringify([...solved]))}
$("next").onclick=()=>{if(current===13){current=0;solved.clear();localStorage.removeItem("maze4Solved")}else current++;save();draw()};
$("reset").onclick=()=>{if(confirm("14장 진행 기록을 모두 초기화할까요?")){current=0;solved.clear();localStorage.removeItem("maze4Solved");save();draw()}};
draw();
</script></body></html>
