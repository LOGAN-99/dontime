<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PART 13. 마지막 교대의 기록실. 시간표, 문서 출처, 자료 인계와 추론의 경계를 확인하는 14개 논리 퍼즐."><link rel="canonical" href="https://dontime.kr/maze13.html"><meta property="og:title" content="미궁 PART 13 · 마지막 교대의 기록실 | 셈플리"><meta property="og:description" content="가상의 기록관에서 사실과 추정의 경계를 확인하는 14개 논리 퍼즐."><title>미궁 PART 13 · 마지막 교대의 기록실 | 셈플리</title><style>*{box-sizing:border-box}body{margin:0;background:#07131d;color:#edf2f3;font-family:Arial,'Noto Sans KR',sans-serif;line-height:1.75}.wrap{max-width:900px;margin:auto;padding:22px 18px 70px}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:#e5bd82;text-decoration:none;font-weight:900}.hero,.card{border:1px solid #3a5664;background:#12232f;border-radius:18px;padding:23px;margin:18px 0}.hero{background:linear-gradient(120deg,rgba(5,15,23,.96),rgba(7,22,31,.62)),url('/assets/brianna-maitland-road.svg') center/cover}.eyebrow{font:900 10px monospace;letter-spacing:.17em;color:#e5bd82}.title{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:8px 0}.muted{color:#b3c2c8}.meter{display:flex;justify-content:space-between;gap:12px;color:#b3c2c8;font-size:12px;font-weight:800}.progress{height:7px;background:#2b404c;border-radius:10px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:#d6b17e;transition:width .2s}.story{font-size:15px;color:#dce5e7;min-height:90px}.question{font-size:19px;font-weight:900;margin:14px 0}.options{display:grid;gap:9px}.options button{background:#0b1b26;border:1px solid #405b68;color:#edf2f3;text-align:left;padding:13px 15px;border-radius:11px;font-size:14px;cursor:pointer}.options button:disabled{opacity:.9;cursor:default}.feedback{display:none;background:#203744;border-radius:10px;padding:14px;margin-top:14px;color:#e0e8e9}.feedback.show{display:block}#next{margin-top:15px;border:0;background:#e5bd82;color:#172630;border-radius:9px;padding:11px 18px;font-weight:900;cursor:pointer}.note{font-size:12px;color:#9fb1b9}</style></head><body><main class="wrap"><nav class="nav"><a href="/">셈플리</a><a href="/maze.html">미궁 목록</a></nav><header class="hero"><div class="eyebrow">PART 13 · THE LAST SHIFT ARCHIVE</div><h1 class="title">마지막 교대의 기록실</h1><p class="muted">가상의 기록관에 남겨진 열네 개의 봉투. 시간표와 출처, 인계 순서를 확인하고 관찰과 해석을 구분하라.</p><p class="note">완전한 창작 미궁입니다. 실제 브리아나 메이틀랜드 사건의 인물·차량·증거·수사 장면을 재현하지 않습니다. 실제 사건의 정답을 추측하는 게임이 아닙니다.</p></header><section class="card"><div class="meter"><span id="label">CHAPTER 01 / 14</span><span id="score">정답 0개</span></div><div class="progress"><span id="bar"></span></div><h2 id="title" class="title" style="font-size:24px"></h2><p id="story" class="story"></p><p id="question" class="question"></p><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" hidden>다음 장면 →</button></section></main><script>const chapters=[{"title":"첫 접수표","story":"가상의 북부 기록관에 19:05, 19:20, 19:45가 적힌 세 장의 접수표가 도착했다. 담당자는 먼저 시간 순서를 정리하라고 한다.","q":"올바른 시간 순서는?","o":["19:45 → 19:20 → 19:05","19:05 → 19:20 → 19:45","19:20 → 19:05 → 19:45","19:20 → 19:45 → 19:05"],"a":1,"e":"시각을 오름차순으로 배열하면 19:05, 19:20, 19:45입니다."},{"title":"마흔 분의 간격","story":"첫 접수 기록은 19:05, 마지막 기록은 19:45다. 두 시각은 같은 시계로 기록됐다.","q":"두 기록 사이의 간격은?","o":["30분","35분","40분","45분"],"a":2,"e":"19:05에서 19:45까지는 40분입니다."},{"title":"세 장의 사본","story":"서랍에 같은 문서의 복사본 세 장이 있다. 문서번호와 원본 해시값이 모두 같다.","q":"독립된 원본 출처의 수로 가장 타당한 것은?","o":["1개","2개","3개","확인할 수 없이 10개"],"a":0,"e":"복사본이 세 장이어도 모두 같은 원본에서 나왔다면 독립된 출처는 하나입니다."},{"title":"봉인의 순서","story":"가상의 기록물은 작성, 봉인, 인계 서명, 보관소 접수 순으로 처리해야 한다.","q":"자료의 연속성을 확인하기에 가장 타당한 순서는?","o":["접수 → 작성 → 봉인 → 인계","작성 → 봉인 → 인계 서명 → 접수","봉인 → 접수 → 작성 → 인계","인계 서명 → 접수 → 봉인 → 작성"],"a":1,"e":"작성된 자료를 봉인하고 인계 기록을 남긴 뒤 접수해야 보관 경로를 추적할 수 있습니다."},{"title":"지도 위의 거리","story":"가상의 지도 축척은 1cm가 실제 거리 0.75km를 뜻한다. 두 점 사이가 지도에서 4cm다.","q":"두 점 사이의 실제 거리는?","o":["2km","2.5km","3km","4km"],"a":2,"e":"0.75km×4cm는 3km입니다."},{"title":"기록된 발언","story":"메모에는 '직원이 멀리서 종소리를 들었다고 말했다'고 적혀 있다. 녹음이나 다른 관찰 자료는 첨부되지 않았다.","q":"이 메모가 직접 확인해 주는 것은?","o":["종의 정확한 위치","종소리의 실제 발생 시각","직원이 그렇게 말했다고 기록된 사실","종을 친 사람의 신원"],"a":2,"e":"메모는 발언이 기록됐다는 점을 보여줍니다. 종소리의 실제 발생 여부와 출처는 별도 자료가 필요합니다."},{"title":"비어 있는 한 줄","story":"대장에는 20:10과 20:40이 적혀 있지만 그 사이 한 줄이 비어 있다. 빈칸에 관한 별도 자료는 없다.","q":"가장 정확한 처리 방법은?","o":["20:25라고 임의로 채운다","누군가 조작했다고 단정한다","누락으로 표시하고 원본과 다른 사본을 확인한다","앞뒤 기록을 모두 삭제한다"],"a":2,"e":"빈칸은 기록이 없다는 사실만 보여줍니다. 내용과 원인은 원본, 사본, 작성 이력으로 확인해야 합니다."},{"title":"빠른 시계","story":"기록관의 벽시계는 실제보다 6분 빠르다. 벽시계에 22:18이라고 표시됐다.","q":"보정한 실제 시각은?","o":["22:12","22:18","22:24","22:28"],"a":0,"e":"시계가 6분 빠르므로 표시 시각에서 6분을 빼면 22:12입니다."},{"title":"같은 게시물","story":"두 보고서의 작성 날짜는 다르지만 두 작성자 모두 같은 온라인 게시물을 출처로 적었다.","q":"두 보고서를 독립된 관찰 두 건으로 보기 어려운 이유는?","o":["작성 날짜가 다르기 때문","같은 원출처를 반복했기 때문","문서가 서로 다른 색이기 때문","문장 길이가 같기 때문"],"a":1,"e":"같은 게시물에서 나온 정보는 독립된 현장 관찰 두 건으로 셀 수 없습니다."},{"title":"최종 승인본","story":"문서 A에는 초안 표시가 있고 서명이 없다. 문서 B에는 승인 서명과 발행 날짜가 있다.","q":"공식 기록 여부를 확인할 때 우선 검토할 자료는?","o":["서명이 없는 초안 A","승인 서명과 발행 날짜가 있는 문서 B","파일명이 먼저인 문서","더 짧은 문서"],"a":1,"e":"승인 서명과 발행 날짜가 있는 문서가 최종 기록인지 확인하기에 더 적합합니다."},{"title":"넓은 차량 묘사","story":"가상의 메모에는 '어두운 색의 승용차를 보았다'고 적혀 있다. 번호판이나 제조사, 모델 정보는 없다.","q":"이 메모만으로 확정할 수 있는 것은?","o":["차량 소유자의 신원","특정 차량의 제조사와 모델","어두운 색 승용차를 봤다는 진술이 기록됐다는 점","차량 운전자의 이름"],"a":2,"e":"구체적인 식별 정보가 없으므로 차량이나 운전자의 신원을 특정할 수 없습니다."},{"title":"표본 출처의 의미","story":"가상의 기록에서 한 표본의 출처가 확인됐지만, 조사 결과 해당 출처는 사건과 관련 없는 것으로 배제됐다.","q":"가장 타당한 결론은?","o":["출처가 확인됐으므로 그 사람이 용의자다","출처 확인은 신원 정보일 뿐, 사건 관련성은 별도로 평가해야 한다","표본이 사건 전체를 해결했다","출처 확인만으로 범행 시각을 알 수 있다"],"a":1,"e":"출처가 확인됐다는 사실과 사건 관련성이 입증됐다는 판단은 서로 다릅니다."},{"title":"영장과 판결","story":"문서에는 수사기관이 특정 가능성을 조사하기 위해 영장을 신청했다고 적혀 있다. 법원의 유죄 판결은 없다.","q":"영장 신청 문서의 의미를 가장 정확히 설명한 것은?","o":["특정인의 유죄가 확정됐다는 뜻","수사기관이 법적 절차를 통해 조사하려 했다는 뜻","모든 가설이 사실이라는 뜻","사건이 종결됐다는 뜻"],"a":1,"e":"영장 신청은 수사 목적의 절차이며 유죄 판결과 동일하지 않습니다."},{"title":"마지막 서랍","story":"기록관장은 세 칸을 남겼다. 첫 칸은 확인된 사실, 둘째 칸은 설명 후보, 셋째 칸은 아직 모르는 내용이다.","q":"가장 신뢰할 수 있는 최종 정리 방식은?","o":["빈칸을 상상으로 채운다","설명 후보를 확인된 사실로 바꾼다","사실·가설·미확인 사항을 분리해 기록한다","서로 다른 출처의 차이를 지운다"],"a":2,"e":"확인된 사실과 가설, 아직 알 수 없는 내용을 구분해야 합니다."}];let at=0,score=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;const x=chapters[at];$('label').textContent='CHAPTER '+String(at+1).padStart(2,'0')+' / '+chapters.length;$('score').textContent='정답 '+score+'개';$('bar').style.width=((at+1)/chapters.length*100)+'%';$('title').textContent=x.title;$('story').textContent=x.story;$('question').textContent=x.q;$('options').innerHTML='';x.o.forEach((v,n)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+n)+'. '+v;b.onclick=()=>answer(n);$('options').appendChild(b)});$('feedback').className='feedback';$('feedback').textContent='';$('next').hidden=true}function answer(n){if(locked)return;locked=true;const x=chapters[at];if(n===x.a)score++;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#8bc5b6';if(j===n&&n!==x.a)b.style.borderColor='#c37d74'});$('feedback').textContent=(n===x.a?'기록이 맞아떨어졌습니다. ':'다른 단서를 다시 살펴보세요. ')+x.e;$('feedback').classList.add('show');$('score').textContent='정답 '+score+'개';$('next').hidden=false;$('next').textContent=at===chapters.length-1?'기록실 최종 확인':'다음 장면 →'}$('next').onclick=()=>{if(at<chapters.length-1){at++;render()}else{$('label').textContent='ARCHIVE COMPLETE';$('title').textContent='기록관의 마지막 문';$('story').textContent='기록관장은 확인된 사실을 사실란에, 설명 후보를 가설란에, 아직 확인되지 않은 내용은 빈칸 그대로 남겼다. 기록관의 문은 모르는 것을 정확히 표시한 사람에게 열렸다.';$('question').textContent=chapters.length+'개 퍼즐 중 '+score+'개 정답';$('options').innerHTML='<a href="/brianna-maitland.html" style="color:#e5bd82">CASE 009 다큐 보기</a> · <a href="/maze.html" style="color:#e5bd82">미궁 목록으로</a>';$('feedback').textContent='모르는 것을 모른다고 기록하는 일도 정확한 결론의 일부입니다.';$('feedback').classList.add('show');$('next').hidden=true;$('bar').style.width='100%'}};render();</script></body></html>
