<style>
:root{color-scheme:dark;--bg:#101d1b;--panel:#192925;--line:#38564b;--ink:#f3f1df;--muted:#a8bbb0;--mint:#bfe5c9;--gold:#e4c77d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2b5144 0,transparent 48%),var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}
.site-head{max-width:1320px;margin:auto;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff12}.brand{color:var(--ink);text-decoration:none;font-size:20px;font-weight:900;letter-spacing:-.05em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em;margin-top:3px}.head-actions{display:flex;gap:9px}.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:9px 14px;font-size:12px;font-weight:800;text-decoration:none}
.shell{max-width:1320px;margin:auto;padding:34px 26px 70px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}.rail{position:sticky;top:20px;border:1px solid var(--line);border-radius:20px;background:#14231f;padding:18px}.rail-kicker,.eyebrow{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--mint)}.rail-title{font-size:21px;font-weight:900;line-height:1.25;margin:8px 0 16px}.rail-progress{height:5px;background:#31473e;border-radius:99px;overflow:hidden;margin:0 0 17px}.rail-progress span{display:block;height:100%;width:0;background:var(--mint);transition:width .25s}.chapter-list{display:grid;gap:5px}.chapter-link{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;color:#a7b7ad;padding:9px 10px;font-size:11px}.chapter-link b{font-size:10px;color:#718b7d;min-width:22px}.chapter-link.active{background:#29463b;border-color:#4e7561;color:#fff}.chapter-link.done b{color:var(--mint)}.rail-foot{margin-top:16px;padding-top:14px;border-top:1px solid #ffffff14;font-size:10px;line-height:1.6;color:#8da296}
.story-area{min-width:0}.story-hero{padding:28px 0 23px;border-bottom:1px solid #ffffff1c;margin-bottom:24px}.story-hero h1{font-size:clamp(38px,5vw,66px);line-height:1.03;letter-spacing:-.065em;margin:10px 0 14px}.story-hero p{max-width:690px;color:var(--muted);font-size:14px;line-height:1.9;margin:0}.chapter-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:11px}.chapter-count{border:1px solid var(--line);border-radius:999px;padding:7px 10px;white-space:nowrap}.chapter-card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#1d302a,#14231f 72%);box-shadow:0 22px 60px #0002}.chapter-banner{padding:26px 28px 23px;border-bottom:1px solid #ffffff15;background:linear-gradient(120deg,#244b3d,#192c26 75%)}.chapter-place{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--gold)}.chapter-title{font-size:clamp(25px,3vw,38px);line-height:1.2;letter-spacing:-.04em;margin:11px 0 0}.chapter-body{padding:27px 28px}.chapter-story{font-size:15px;line-height:2;color:#d3ded5;margin:0 0 25px;white-space:pre-line}.riddle{padding:22px;border:1px solid #476456;border-radius:16px;background:#12221d}.riddle-label{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--mint)}.riddle h3{font-size:18px;line-height:1.55;margin:10px 0 17px}.options{display:grid;gap:9px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 15px;border:1px solid #3b584b;border-radius:12px;background:#1a3028;color:var(--ink);line-height:1.6;font-size:13px;transition:transform .12s,border-color .12s,background .12s}.option:hover:not(:disabled){transform:translateY(-1px);border-color:#a1c6ac;background:#223d31}.option-key{display:grid;place-items:center;flex:0 0 25px;height:25px;border:1px solid #5c7968;border-radius:7px;color:var(--mint);font-size:10px;font-weight:900}.option.correct{border-color:var(--mint);background:#244936}.option.wrong{border-color:#a05e5a;background:#432b29;color:#f3d4cf}.option:disabled{cursor:default}.feedback{min-height:46px;margin-top:15px;color:var(--muted);font-size:12px;line-height:1.8}.feedback strong{color:var(--mint)}.feedback p{margin:8px 0 0;color:#d7e3d8}.chapter-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid var(--line);border-radius:11px;padding:12px 16px;color:var(--ink);background:#22372f;font-size:12px;font-weight:900}.btn.primary{background:var(--mint);border-color:var(--mint);color:#10221a}.btn:disabled{opacity:.35;cursor:not-allowed}.save-note{font-size:10px;line-height:1.7;color:#7f988a;margin-top:15px}.ending{padding:clamp(28px,5vw,60px);text-align:center}.ending-mark{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:900}.ending h2{font-size:clamp(34px,5vw,60px);letter-spacing:-.06em;line-height:1.1;margin:15px 0}.ending p{max-width:650px;margin:0 auto;color:var(--muted);line-height:2;font-size:14px}.score-big{font-size:50px;font-weight:900;letter-spacing:-.06em;color:var(--mint);margin:25px 0 2px}.score-caption{font-size:10px;letter-spacing:.14em;color:#8ba397}.grade{font-size:18px;font-weight:900;margin:12px 0 20px}.ending-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}
@media(max-width:800px){.shell{grid-template-columns:minmax(0,1fr);padding:22px 14px 44px;gap:20px}.rail{position:relative;top:auto;padding:14px}.rail-title{margin-bottom:10px}.chapter-list{display:flex;overflow-x:auto;padding-bottom:3px}.chapter-link{flex:0 0 auto;width:auto;min-width:104px;max-width:150px;white-space:nowrap}.chapter-link span{overflow:hidden;text-overflow:ellipsis}.rail-foot{display:none}.site-head{padding:17px 14px}.story-hero{padding:16px 0 20px}.story-hero h1{font-size:42px}.chapter-banner{padding:21px 19px}.chapter-body{padding:18px 14px}.chapter-story{font-size:14px;line-height:1.9}.riddle{padding:15px}.riddle h3{font-size:16px}.option{padding:12px;font-size:12px}.chapter-meta{align-items:flex-start;flex-direction:column}.chapter-actions .btn{flex:1}.head-actions .ghost{padding:8px 10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<main class="shell"><aside class="rail"><div class="rail-kicker">Original story / 13 chapters</div><div class="rail-title">내일역의 비밀</div><div class="rail-progress"><span id="railProgress"></span></div><div class="chapter-list" id="chapterList"></div><div class="rail-foot">기억은 기록이 되고<br>선택은 길이 된다.<br><br>진행 상황은 이 기기의 브라우저에 저장됩니다.</div></aside>
<section class="story-area"><div class="story-hero"><div class="eyebrow">SEMPLY / THE MAZE</div><h1>길을 잃어야<br>열리는 문이 있다.</h1><p>시간이 거꾸로 흐르는 내일역. 열세 장의 이야기와 논리 퍼즐을 지나, 사라진 출발역과 아직 쓰이지 않은 내일을 찾아보세요.</p></div><div id="chapterHost"></div></section></main>
<script>
const chapters=[
  {title:'프롤로그 · 0시 17분의 편지',place:'비가 거꾸로 내리는 역',story:'막차가 떠난 뒤, 당신의 주머니에서 젖지 않은 승차권 한 장이 발견된다. 목적지는 지도에 없는 ‘내일역’. 뒷면에는 당신의 필체로 적힌 문장이 있다. “문이 열리면 가장 먼저 시간을 믿지 말 것.” 플랫폼의 시계는 00:17을 가리키지만 초침은 왼쪽으로 흐른다. 선로 끝에서 우산을 든 역무원이 손짓한다. “표를 끊은 사람은 당신이지만, 도착한 사람은 아직 당신이 아닙니다.”',q:'역무원이 내민 세 개의 표 중 문을 여는 표는?',opts:['도착 시간이 적힌 표','출발역이 지워진 표','뒷면에 아무것도 없는 표'],ans:1,why:'이곳은 목적지가 아니라 출발점을 잊은 사람을 가둔다. 출발역이 지워진 표만 새 출발을 허락한다.',choice:'표를 뒤집자 종이 속에서 작은 별가루가 떨어진다. 역무원은 이름 대신 “기억하는 자”라고 당신을 부른다.'},
  {title:'제1장 · 이름을 먹는 매표소',place:'유리 천장의 매표소',story:'매표소 창구 뒤에는 얼굴이 없는 직원이 앉아 있다. 벽에는 수천 개의 이름표가 매달려 있고, 이름표마다 작은 종이 새가 쪼아 먹은 흔적이 있다. 직원은 통행료로 이름 하나를 요구한다. 이름을 내주면 사람들은 당신을 기억하지 못할 것이다. 이름을 지키려면 당신이 누구인지 증명해야 한다. 창구 위에는 “불릴수록 작아지지만, 나누어 줄수록 커지는 것”이라는 수수께끼가 떠오른다.',q:'이름을 빼앗기지 않고 건넬 수 있는 것은?',opts:['침묵','약속','그림자'],ans:1,why:'약속은 나눌수록 관계 속에서 커진다. 당신은 이름 대신 “돌아오겠다”는 약속을 맡기고 통과한다.',choice:'직원은 약속을 작은 유리병에 담아 서랍에 넣는다. “잊지 마세요. 이곳에서 약속은 화폐입니다.”'},
  {title:'제2장 · 비가 쌓이는 도서관',place:'천장 대신 바다가 있는 서고',story:'책장은 물속으로 이어지고, 책의 페이지마다 비가 한 방울씩 고여 있다. 사서 이오는 자신의 기억을 책으로 묶어 두었다고 말한다. 그런데 책을 펼치면 문장이 한 줄씩 사라진다. 이오는 잃어버린 문장을 되찾아야 집으로 돌아갈 수 있다. 세 권의 책이 놓여 있다. ‘어제의 사실’, ‘오늘의 선택’, ‘내일의 가능성’. 문이 원하는 것은 미래를 맞히는 예언이 아니라, 읽는 순간 달라지는 책이다.',q:'읽는 사람이 읽은 뒤 행동을 바꾸면 내용도 달라지는 책은?',opts:['어제의 사실','오늘의 선택','내일의 가능성'],ans:1,why:'선택은 독자의 행동으로 내용이 달라진다. 당신은 이오에게 기억은 보관만 하는 것이 아니라 다시 선택하는 것이라고 알려준다.',choice:'이오는 책갈피를 건넨다. “잊은 문장보다 중요한 건, 다시 쓸 수 있는 여백이에요.”'},
  {title:'제3장 · 거꾸로 된 시장',place:'가격표가 사람을 사는 골목',story:'시장에서는 물건에 가격이 붙어 있지 않다. 대신 상인들의 손목에 남은 시간이 진열되어 있다. 한 노점상은 당신에게 녹슨 나침반을 건네며 값을 묻는다. “이 나침반은 북쪽이 아니라 가장 후회할 선택을 가리킵니다.” 상인은 돈을 받지 않는다. 당신이 가진 것 가운데 잃어도 다시 만들 수 없는 것을 내놓으라고 한다. 시장 바닥의 저울에는 ‘기억’, ‘시간’, ‘기회’가 놓여 있다.',q:'한 번 지나가면 같은 순간으로 되돌릴 수 없는 것은?',opts:['시간','기억의 기록','기회에 대한 계획'],ans:0,why:'기억은 기록하거나 다시 떠올릴 수 있고 계획은 고칠 수 있지만, 이미 지나간 시간 자체는 되돌릴 수 없다.',choice:'나침반 바늘이 당신의 발밑을 가리킨다. 길은 언제나 다음 걸음에서 시작된다는 뜻이다.'},
  {title:'제4장 · 두 개의 그림자',place:'빛이 두 개인 골목',story:'골목의 가로등은 두 개지만 당신의 그림자는 하나가 아니다. 왼쪽 그림자는 당신이 실제로 한 일을 따라 하고, 오른쪽 그림자는 당신이 하지 못한 일을 연기한다. 둘은 서로 자기가 진짜라고 주장한다. 골목 끝 문에는 “거짓말쟁이 그림자는 언제나 반대 방향을 가리킨다”라고 적혀 있다. 두 그림자 중 하나에게 딱 한 번 질문할 수 있다. 어느 쪽이 진짜인지 묻는다면 답은 믿을 수 없을 것이다.',q:'한 번의 질문으로 출구 방향을 알아내려면 무엇을 물어야 할까?',opts:['네가 진짜 그림자니?','다른 그림자라면 어느 길을 가리킬까?','네가 가리키는 길은 맞니?'],ans:1,why:'상대의 답을 한 번 더 뒤집는 구조를 만들면 진실과 거짓의 차이를 상쇄할 수 있다. 두 그림자가 가리킬 방향을 서로에게 묻게 하는 것이 핵심이다.',choice:'두 그림자가 겹치는 순간 문이 열린다. 당신은 진실이 언제나 단독으로 서 있지는 않다는 걸 배운다.'},
  {title:'제5장 · 잠들지 않는 온실',place:'계절이 한 화분에 피는 정원',story:'온실의 꽃들은 햇빛 대신 질문을 먹고 자란다. 정원사 마루는 마지막 꽃을 피우지 못해 문 앞에 멈춰 있다. 꽃잎에는 숫자가 새겨져 있다. 2, 3, 5, 8, 12, 17. 마루는 “이 정원은 정답보다 규칙을 찾는 사람에게 문을 내준다”고 말한다. 유리 천장 너머에서는 여름과 겨울이 동시에 지나간다. 다음 꽃잎에 새길 숫자를 고르면 온실의 온도가 바뀐다.',q:'규칙을 이어 다음에 올 숫자는?',opts:['21','23','24'],ans:1,why:'차이가 1, 2, 3, 4, 5로 커진다. 다음 차이는 6이므로 17+6=23이다.',choice:'23번째 꽃잎이 열리며 씨앗 하나가 손바닥에 떨어진다. 씨앗은 아직 심을 곳을 정하지 못했다.'},
  {title:'제6장 · 침묵의 법정',place:'증언이 그림으로 나타나는 재판소',story:'법정에는 판사도 변호사도 없다. 세 개의 그림만 벽에 걸려 있다. 첫 번째는 빈 의자, 두 번째는 깨진 시계, 세 번째는 닫힌 문이다. 사건 기록에는 “누군가 문을 열었고, 그 순간 시계가 멈췄으며, 의자는 비어 있었다”라고 적혀 있다. 그림들은 순서를 바꾸어 놓아도 모두 사실이다. 하지만 이 법정은 사실만으로 결론을 내리는 사람을 믿지 않는다. 무엇이 빠졌는지 말해야 한다.',q:'세 그림만으로는 확정할 수 없는 것은?',opts:['시계가 깨졌다는 사실','의자에 앉아 있던 사람의 의도','문이 닫혀 있다는 사실'],ans:1,why:'관찰된 상태는 알 수 있어도 사람의 의도는 증거만으로 단정할 수 없다. 당신은 모르는 것을 모른다고 말한다.',choice:'판결문에 처음으로 빈칸이 남는다. 그 빈칸은 실패가 아니라, 함부로 단정하지 않은 증거다.'},
  {title:'제7장 · 기억의 우체국',place:'배달되지 않은 편지의 강',story:'강 위에는 종이배가 떠 있고, 배마다 아직 보내지 못한 편지가 실려 있다. 우체국장 단은 편지를 과거로 보낼 수는 있지만 답장을 받을 수는 없다고 말한다. 단 하나, 받는 사람의 주소를 모르는 편지만 강 건너편으로 갈 수 있다. 당신은 미래의 자신에게 편지를 쓰려 하지만, 봉투에는 날짜만 적혀 있고 주소 칸은 비어 있다. 우체국의 규칙은 기묘하다. 도착지를 확정하는 순간 배는 물에 잠긴다.',q:'편지가 강을 건너게 하려면 주소 칸에 무엇을 남겨야 할까?',opts:['정확한 집 주소','아직 정하지 않은 가능성','받는 사람의 본명'],ans:1,why:'이 우체국에서는 도착지를 단정하지 않아야 배가 뜬다. 미래는 고정된 주소가 아니라 열려 있는 가능성이다.',choice:'편지는 물 위로 떠오르고, 봉투 안에는 아직 쓰지 않은 문장 한 줄이 남는다.'},
  {title:'제8장 · 13번째 계단',place:'올라갈수록 낮아지는 탑',story:'탑에는 계단이 열두 개라고 안내되어 있지만 실제로는 열세 개가 있다. 첫 번째 계단에는 1, 두 번째에는 2, 세 번째에는 4, 네 번째에는 7이 새겨져 있다. 탑은 숫자를 세는 사람에게만 모습을 바꾼다. 꼭대기에는 작은 문과 큰 문이 있다. 작은 문은 당신 혼자 들어갈 수 있고, 큰 문은 지금까지 만난 사람들의 이름을 기억해야 열린다. 당신은 혼자 빨리 나갈 수도 있고, 함께 늦게 도착할 수도 있다.',q:'같은 규칙이 이어진다면 다섯 번째 계단의 숫자는?',opts:['10','11','12'],ans:1,why:'증가량이 +1, +2, +3으로 커지므로 다음은 +4다. 7+4=11이다.',choice:'당신은 큰 문을 고른다. 지금까지 만난 이들의 이름표가 주머니에서 따뜻해진다.'},
  {title:'제9장 · 목소리 없는 합창단',place:'소리가 색으로 보이는 극장',story:'무대 위 합창단은 노래하지만 소리가 들리지 않는다. 대신 관객의 마음속에서 색이 피어난다. 지휘자는 “모두 같은 음을 내면 노래는 완성되지 않는다”고 말한다. 악보에는 쉼표, 낮은 음, 높은 음이 반복된다. 빈 마디를 채우려면 가장 큰 소리를 넣는 것이 아니라, 앞뒤의 소리가 서로 들릴 자리를 만들어야 한다. 당신이 고른 마디에 따라 극장의 벽이 가까워지거나 멀어진다.',q:'합창이 서로를 들을 수 있도록 만드는 기호는?',opts:['가장 높은 음','쉼표','같은 음의 반복'],ans:1,why:'쉼표는 소리의 부재가 아니라 다른 소리가 들릴 공간이다. 침묵도 합주의 일부다.',choice:'극장의 벽이 물러나고, 무대 뒤에 숨겨진 문이 드러난다.'},
  {title:'제10장 · 선택을 저장하는 방',place:'벽마다 다른 결말이 비치는 기록실',story:'기록실에는 당신이 고르지 않았던 길들이 유리벽마다 비친다. 어떤 벽에서는 혼자 탈출했고, 어떤 벽에서는 누군가를 기다렸으며, 어떤 벽에서는 문을 닫아 두었다. 기록관은 말한다. “모든 가능성을 살 수는 없습니다. 하지만 선택한 길의 책임은 남길 수 있습니다.” 방 한가운데에는 세 개의 버튼이 있다. 완벽한 선택, 빠른 선택, 되돌릴 수 있는 선택. 그러나 안내문에는 완벽한 선택은 존재하지 않는다고 적혀 있다.',q:'불확실한 상황에서 가장 책임 있는 선택은?',opts:['결과를 확인하지 않고 완벽하다고 믿기','정보와 위험을 살피고 필요하면 수정하기','가장 빠른 선택을 무조건 반복하기'],ans:1,why:'좋은 결정은 무오류가 아니라 근거를 살피고 결과를 확인하며 수정할 수 있는 결정이다.',choice:'기록관은 당신의 선택을 지우지 않는다. 대신 왜 골랐는지 옆에 기록한다.'},
  {title:'제11장 · 내일역의 심장',place:'멈춘 시계들이 매달린 기관실',story:'기관실의 중심에는 거대한 시계가 떠 있다. 시계는 시간을 만들지 않는다. 사람들의 약속이 모일 때만 초침이 한 칸 움직인다. 역무원, 사서, 상인, 정원사, 우체국장, 지휘자가 하나씩 나타나 각자의 작은 부품을 내려놓는다. 마지막 자리는 비어 있다. 그 자리에 무엇을 놓을지 당신이 정해야 한다. 과거를 되돌리는 열쇠는 없고, 미래를 보장하는 기계도 없다. 남은 것은 오늘 실제로 할 수 있는 한 가지 행동뿐이다.',q:'시계의 마지막 부품으로 어울리는 것은?',opts:['절대 바뀌지 않는 계획','작게 시작해 계속 확인하는 행동','실패하지 않을 거라는 확신'],ans:1,why:'시간은 확신보다 실제 행동과 반복되는 점검으로 움직인다. 작은 행동이 약속을 현실로 만든다.',choice:'초침이 처음으로 앞으로 움직인다. 기관실 전체에 새벽의 소리가 퍼진다.'},
  {title:'에필로그 · 문 밖의 날씨',place:'아직 이름이 없는 아침',story:'문을 열자 처음의 역으로 돌아온 듯 보인다. 하지만 플랫폼 시계는 00:18을 가리킨다. 단 한 분이 지났는데, 당신은 열한 장의 계절을 통과했다. 역무원은 더 이상 우산을 들고 있지 않다. 그가 누구였는지는 끝내 밝혀지지 않는다. 중요한 것은 그가 누구였느냐가 아니라, 당신이 무엇을 들고 나왔느냐는 것이다. 주머니에는 이름표, 책갈피, 씨앗, 빈 편지가 남아 있다. 각각은 기억, 선택, 가능성, 그리고 아직 쓰지 않은 다음 문장을 뜻한다.',q:'미궁의 마지막 문에 새길 문장은?',opts:['모든 답을 이미 안다','길은 선택한 뒤에야 생긴다','다시는 길을 잃지 않는다'],ans:1,why:'미궁은 모든 답을 주지 않는다. 다음 걸음을 선택할 수 있다는 사실을 돌려준다.',choice:'문이 열린다. 밖의 날씨는 당신이 정할 수 없지만, 우산을 펼칠지는 당신이 정할 수 있다.'}
];
const KEY='dontimeMazeSave';
let index=0,score=0,answered=new Set();
function restore(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Number.isInteger(x.index)&&x.index>=0&&x.index<chapters.length){index=x.index;score=Math.max(0,Number(x.score)||0);answered=new Set(Array.isArray(x.answered)?x.answered:[]);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({index,score,answered:[...answered]}));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function paintRail(){document.getElementById('railProgress').style.width=Math.round(answered.size/chapters.length*100)+'%';document.getElementById('chapterList').innerHTML=chapters.map((ch,i)=>'<button class="chapter-link '+(i===index?'active ':'')+(answered.has(i)?'done':'')+'" data-index="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b><span>'+esc(ch.title.replace(/^프롤로그 · |^제\d+장 · |^에필로그 · /,''))+'</span></button>').join('');document.querySelectorAll('.chapter-link').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.index);if(n>index&&!answered.has(index))return;index=n;save();render();});}
function render(){paintRail();const ch=chapters[index],done=answered.has(index);document.getElementById('chapterHost').innerHTML='<div class="chapter-meta"><span>기억 점수 '+score+' / '+chapters.length+'</span><span class="chapter-count">CHAPTER '+String(index+1).padStart(2,'0')+' / '+chapters.length+'</span></div><article class="chapter-card" style="margin-top:12px"><header class="chapter-banner"><div class="chapter-place">'+esc(ch.place)+'</div><h2 class="chapter-title">'+esc(ch.title)+'</h2></header><div class="chapter-body"><p class="chapter-story">'+esc(ch.story)+'</p><section class="riddle"><div class="riddle-label">THE GATEKEEPER\'S QUESTION</div><h3>'+esc(ch.q)+'</h3><div class="options">'+ch.opts.map((o,i)=>'<button class="option" type="button" data-choice="'+i+'" '+(done?'disabled':'')+'><span class="option-key">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>').join('')+'</div><div class="feedback" id="feedback">'+(done?'이 장의 기록이 저장되어 있습니다. 다음 장으로 이동할 수 있어요.':'단서를 읽고 답을 골라 문을 열어보세요. 틀려도 다시 시도할 수 있습니다.')+'</div></section><div class="chapter-actions"><button class="btn" id="restartBtn" type="button">처음부터 다시</button><button class="btn primary" id="nextBtn" type="button" '+(!done?'disabled':'')+'>'+(index===chapters.length-1?'결말 확인':'다음 장으로')+' →</button></div><div class="save-note">진행 상황은 현재 브라우저에 저장됩니다. 다른 기기와는 자동 동기화되지 않습니다.</div></div></article>';
document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(answered.has(index))return;const picked=Number(b.dataset.choice),ok=picked===ch.ans,feedback=document.getElementById('feedback');if(ok){score++;answered.add(index);document.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(Number(x.dataset.choice)===ch.ans)x.classList.add('correct')});feedback.innerHTML='<strong>문이 열렸다.</strong> '+esc(ch.why)+'<p>'+esc(ch.choice)+'</p>';document.getElementById('nextBtn').disabled=false;save();paintRail();}else{b.classList.add('wrong');b.disabled=true;feedback.textContent='문이 아직 열리지 않는다. 단서와 조건을 다시 살펴보자.';}});document.getElementById('nextBtn').onclick=()=>{if(!answered.has(index))return;if(index<chapters.length-1){index++;save();render();window.scrollTo({top:0,behavior:'smooth'});}else ending();};document.getElementById('restartBtn').onclick=restart;}
function ending(){document.getElementById('chapterHost').innerHTML='<article class="chapter-card ending"><div class="ending-mark">THE END / SEMPLY ORIGINAL</div><h2>당신은 미궁을<br>통과했다.</h2><p>내일역의 문이 닫히고, 역의 모든 시계가 각자의 속도로 움직이기 시작한다. 끝은 답을 얻는 순간이 아니라, 다음 선택을 시작하는 순간이다.</p><div class="score-big">'+score+' / '+chapters.length+'</div><div class="score-caption">CORRECT ANSWERS</div><div class="grade">'+(score>=10?'기억을 지키는 길잡이':score>=7?'틈을 읽는 탐험가':'다시 길을 만들 줄 아는 사람')+'</div><p>당신이 놓친 문도 사라지지 않았다. 다른 계절에 다시 열릴 수 있도록 기록실에 남겨 두었다. 오늘의 선택이 내일의 길이 되기를.</p><div class="ending-actions"><button class="btn primary" id="replayBtn">새 여정 시작</button><button class="btn" id="reviewBtn">마지막 장 다시 읽기</button></div></article>';document.getElementById('replayBtn').onclick=restart;document.getElementById('reviewBtn').onclick=()=>{index=chapters.length-1;render();};}
function restart(){if(!confirm('미궁을 처음부터 다시 시작할까요? 저장된 미궁 기록이 초기화됩니다.'))return;index=0;score=0;answered=new Set();save();render();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('resumeBtn').onclick=()=>{restore();render();document.querySelector('.story-hero').scrollIntoView({behavior:'smooth',block:'start'});};
restore();render();
</script></body></html>
