rd-build.has-word{color:var(--gold);font-size:21px;font-weight:900}.drop-seal{min-height:78px;display:grid;place-items:center;border:2px dashed #9a8555;border-radius:16px;background:#302c20;color:#f0d99b;font-weight:900;text-align:center;padding:18px;transition:.18s}.drop-seal.ready{border-style:solid;background:#3b432e;transform:scale(1.01)}.drop-seal.unlocked{border-color:var(--mint);background:#244936;color:var(--mint)}.pattern-strip{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:22px;font-weight:900;margin:20px 0;color:var(--gold)}.pattern-strip span{color:#829b8c;font-size:14px}.hint-box{margin-top:16px;border:1px solid #38564b;border-radius:11px;padding:12px 14px;color:var(--muted);font-size:12px}.hint-box summary{cursor:pointer;color:var(--mint);font-weight:800}.hint-box p{line-height:1.8;margin:10px 0 0}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

<main class="shell"><aside class="rail"><div class="rail-kicker">Original story / 13 chapters</div><div class="rail-title">내일역의 비밀</div><div class="rail-progress"><span id="railProgress"></span></div><div class="chapter-list" id="chapterList"></div><div class="rail-foot">기억은 기록이 되고<br>선택은 길이 된다.<br><br>진행 상황은 이 기기의 브라우저에 저장됩니다.</div></aside>
<section class="story-area"><div class="story-hero"><div class="eyebrow">SEMPLY / THE MAZE</div><h1>길을 잃어야<br>열리는 문이 있다.</h1><p>시간이 거꾸로 흐르는 내일역. 열세 장의 이야기와 논리 퍼즐을 지나, 사라진 출발역과 아직 쓰이지 않은 내일을 찾아보세요.</p></div><div id="chapterHost"></div></section></main>
<script>
const chapters=[
  {title:'프롤로그 · 0시 17분의 편지',place:'비가 거꾸로 내리는 역',story:'막차가 떠난 뒤, 당신의 주머니에서 젖지 않은 승차권 한 장이 발견된다. 목적지는 지도에 없는 ‘내일역’. 뒷면에는 당신의 필체로 적힌 문장이 있다. “문이 열리면 가장 먼저 시간을 믿지 말 것.” 플랫폼의 시계는 00:17을 가리키지만 초침은 왼쪽으로 흐른다. 선로 끝에서 우산을 든 역무원이 손짓한다. “표를 끊은 사람은 당신이지만, 도착한 사람은 아직 당신이 아닙니다.”',q:'역무원이 내민 세 개의 표 중 문을 여는 표는?',opts:['도착 시간이 적힌 표','출발역이 지워진 표','뒷면에 아무것도 없는 표'],ans:1,why:'이곳은 목적지가 아니라 출발점을 잊은 사람을 가둔다. 출발역이 지워진 표만 새 출발을 허락한다.',choice:'표를 뒤집자 종이 속에서 작은 별가루가 떨어진다. 역무원은 이름 대신 “기억하는 자”라고 당신을 부른다.'},
  {title:'제1장 · 이름을 먹는 매표소',place:'유리 천장의 매표소',story:'매표소 창구 뒤에는 얼굴이 없는 직원이 앉아 있다. 벽에는 수천 개의 이름표가 매달려 있고, 이름표마다 작은 종이 새가 쪼아 먹은 흔적이 있다. 직원은 통행료로 이름 하나를 요구한다. 이름을 내주면 사람들은 당신을 기억하지 못할 것이다. 이름을 지키려면 당신이 누구인지 증명해야 한다. 창구 위에는 “불릴수록 작아지지만, 나누어 줄수록 커지는 것”이라는 수수께끼가 떠오른다.',q:'이름을 빼앗기지 않고 건넬 수 있는 것은?',opts:['침묵','약속','그림자'],ans:1,why:'약속은 나눌수록 관계 속에서 커진다. 당신은 이름 대신 “돌아오겠다”는 약속을 맡기고 통과한다.',choice:'직원은 약속을 작은 유리병에 담아 서랍에 넣는다. “잊지 마세요. 이곳에서 약속은 화폐입니다.”'},
  {title:'제2장 · 비가 쌓이는 도서관',place:'천장 대신 바다가 있는 서고',story:'책장은 물속으로 이어지고, 책의 페이지마다 비가 한 방울씩 고여 있다. 사서 이오는 자신의 기억을 책으로 묶어 두었다고 말한다. 그런데 책을 펼치면 문장이 한 줄씩 사라진다. 이오는 잃어버린 문장을 되찾아야 집으로 돌아갈 수 있다. 세 권의 책이 놓여 있다. ‘어제의 사실’, ‘오늘의 선택’, ‘내일의 가능성’. 문이 원하는 것은 미래를 맞히는 예언이 아니라, 읽는 순간 달라지는 책이다.',q:'읽는 사람이 읽은 뒤 행동을 바꾸면 내용도 달라지는 책은?',opts:['어제의 사실','오늘의 선택','내일의 가능성'],ans:1,why:'선택은 독자의 행동으로 내용이 달라진다. 당신은 이오에게 기억은 보관만 하는 것이 아니라 다시 선택하는 것이라고 알려준다.',choice:'이오는 책갈피를 건넨다. “잊은 문장보다 중요한 건, 다시 쓸 수 있는 여백이에요.”'},
  {title:'제3장 · 거꾸로 된 시장',place:'가격표가 사람을 사는 골목',story:'시장에서는 물건에 가격이 붙어 있지 않다. 대신 상인들의 손목에 남은 시간이 진열되어 있다. 한 노점상은 당신에게 녹슨 나침반을 건네며 값을 묻는다. “이 나침반은 북쪽이 아니라 가장 후회할 선택을 가리킵니다.” 상인은 돈을 받지 않는다. 당신이 가진 것 가운데 잃어도 다시 만들 수 없는 것을 내놓으라고 한다. 시장 바닥의 저울에는 ‘기억’, ‘시간’, ‘기회’가 놓여 있다.',q:'한 번 지나가면 같은 순간으로 되돌릴 수 없는 것은?',opts:['시간','기억의 기록','기회에 대한 계획'],ans:0,why:'기억은 기록하거나 다시 떠올릴 수 있고 계획은 고칠 수 있지만, 이미 지나간 시간 자체는 되돌릴 수 없다.',choice:'나침반 바늘이 당신의 발밑을 가리킨다. 길은 언제나 다음 걸음에서 시작된다는 뜻이다.'},
  {title:'제4장 · 두 개의 그림자',place:'빛이 두 개인 골목',story:'골목 끝에는 왼쪽 문과 오른쪽 문이 있다. 하나만 출구이며, 두 그림자 중 하나는 언제나 진실을 말하고 다른 하나는 언제나 거짓을 말한다. 어느 그림자가 진실을 말하는지는 알 수 없다. 둘 중 한 그림자에게 질문은 단 한 번만 할 수 있다. 그림자들은 두 문 중 출구가 어디인지 알고 있지만, 자기 성격은 밝히지 않는다.',q:'어느 그림자에게 물어도 출구를 알아낼 수 있는 질문은?',opts:['“네가 진실을 말하는 그림자니?”','“다른 그림자에게 출구가 어느 문인지 물으면, 어느 문이라고 답할까?”','“왼쪽 문이 출구라고 생각하니?”'],ans:1,why:'진실을 말하는 그림자에게 물으면 거짓말쟁이가 할 거짓 답을 알려주고, 거짓말쟁이에게 물으면 진실쟁이가 할 답을 거짓으로 바꿔 말한다. 어느 쪽이든 출구와 반대 문을 가리키므로, 답으로 들은 문이 아닌 반대쪽 문을 선택해야 한다.',choice:'당신은 그림자가 가리킨 문이 아닌 반대편 문을 연다. 두 그림자는 겹쳐지며, 골목의 빛이 하나로 돌아온다.'},
  {title:'제5장 · 잠들지 않는 온실',place:'계절이 한 화분에 피는 정원',story:'온실의 꽃들은 햇빛 대신 질문을 먹고 자란다. 정원사 마루는 마지막 꽃을 피우지 못해 문 앞에 멈춰 있다. 꽃잎에는 숫자가 새겨져 있다. 2, 3, 5, 8, 12, 17. 마루는 “이 정원은 정답보다 규칙을 찾는 사람에게 문을 내준다”고 말한다. 유리 천장 너머에서는 여름과 겨울이 동시에 지나간다. 다음 꽃잎에 새길 숫자를 고르면 온실의 온도가 바뀐다.',q:'규칙을 이어 다음에 올 숫자는?',opts:['21','23','24'],ans:1,why:'차이가 1, 2, 3, 4, 5로 커진다. 다음 차이는 6이므로 17+6=23이다.',choice:'23번째 꽃잎이 열리며 씨앗 하나가 손바닥에 떨어진다. 씨앗은 아직 심을 곳을 정하지 못했다.'},
  {title:'제6장 · 침묵의 법정',place:'증언이 그림으로 나타나는 재판소',story:'법정에는 판사도 변호사도 없다. 세 개의 그림만 벽에 걸려 있다. 첫 번째는 빈 의자, 두 번째는 깨진 시계, 세 번째는 닫힌 문이다. 사건 기록에는 “누군가 문을 열었고, 그 순간 시계가 멈췄으며, 의자는 비어 있었다”라고 적혀 있다. 그림들은 순서를 바꾸어 놓아도 모두 사실이다. 하지만 이 법정은 사실만으로 결론을 내리는 사람을 믿지 않는다. 무엇이 빠졌는지 말해야 한다.',q:'세 그림만으로는 확정할 수 없는 것은?',opts:['시계가 깨졌다는 사실','의자에 앉아 있던 사람의 의도','문이 닫혀 있다는 사실'],ans:1,why:'관찰된 상태는 알 수 있어도 사람의 의도는 증거만으로 단정할 수 없다. 당신은 모르는 것을 모른다고 말한다.',choice:'판결문에 처음으로 빈칸이 남는다. 그 빈칸은 실패가 아니라, 함부로 단정하지 않은 증거다.'},
  {title:'제7장 · 기억의 우체국',place:'배달되지 않은 편지의 강',story:'강 위에는 종이배가 떠 있고, 배마다 아직 보내지 못한 편지가 실려 있다. 우체국장 단은 편지를 과거로 보낼 수는 있지만 답장을 받을 수는 없다고 말한다. 단 하나, 받는 사람의 주소를 모르는 편지만 강 건너편으로 갈 수 있다. 당신은 미래의 자신에게 편지를 쓰려 하지만, 봉투에는 날짜만 적혀 있고 주소 칸은 비어 있다. 우체국의 규칙은 기묘하다. 도착지를 확정하는 순간 배는 물에 잠긴다.',q:'편지가 강을 건너게 하려면 주소 칸에 무엇을 남겨야 할까?',opts:['정확한 집 주소','아직 정하지 않은 가능성','받는 사람의 본명'],ans:1,why:'이 우체국에서는 도착지를 단정하지 않아야 배가 뜬다. 미래는 고정된 주소가 아니라 열려 있는 가능성이다.',choice:'편지는 물 위로 떠오르고, 봉투 안에는 아직 쓰지 않은 문장 한 줄이 남는다.'},
  {title:'제8장 · 13번째 계단',place:'올라갈수록 낮아지는 탑',story:'탑에는 계단이 열두 개라고 안내되어 있지만 실제로는 열세 개가 있다. 첫 번째 계단에는 1, 두 번째에는 2, 세 번째에는 4, 네 번째에는 7이 새겨져 있다. 탑은 숫자를 세는 사람에게만 모습을 바꾼다. 꼭대기에는 작은 문과 큰 문이 있다. 작은 문은 당신 혼자 들어갈 수 있고, 큰 문은 지금까지 만난 사람들의 이름을 기억해야 열린다. 당신은 혼자 빨리 나갈 수도 있고, 함께 늦게 도착할 수도 있다.',q:'같은 규칙이 이어진다면 다섯 번째 계단의 숫자는?',opts:['10','11','12'],ans:1,why:'증가량이 +1, +2, +3으로 커지므로 다음은 +4다. 7+4=11이다.',choice:'당신은 큰 문을 고른다. 지금까지 만난 이들의 이름표가 주머니에서 따뜻해진다.'},
  {title:'제9장 · 목소리 없는 합창단',place:'소리가 색으로 보이는 극장',story:'무대 위 합창단은 노래하지만 소리가 들리지 않는다. 대신 관객의 마음속에서 색이 피어난다. 지휘자는 “모두 같은 음을 내면 노래는 완성되지 않는다”고 말한다. 악보에는 쉼표, 낮은 음, 높은 음이 반복된다. 빈 마디를 채우려면 가장 큰 소리를 넣는 것이 아니라, 앞뒤의 소리가 서로 들릴 자리를 만들어야 한다. 당신이 고른 마디에 따라 극장의 벽이 가까워지거나 멀어진다.',q:'합창이 서로를 들을 수 있도록 만드는 기호는?',opts:['가장 높은 음','쉼표','같은 음의 반복'],ans:1,why:'쉼표는 소리의 부재가 아니라 다른 소리가 들릴 공간이다. 침묵도 합주의 일부다.',choice:'극장의 벽이 물러나고, 무대 뒤에 숨겨진 문이 드러난다.'},
  {title:'제10장 · 선택을 저장하는 방',place:'벽마다 다른 결말이 비치는 기록실',story:'기록실에는 당신이 고르지 않았던 길들이 유리벽마다 비친다. 어떤 벽에서는 혼자 탈출했고, 어떤 벽에서는 누군가를 기다렸으며, 어떤 벽에서는 문을 닫아 두었다. 기록관은 말한다. “모든 가능성을 살 수는 없습니다. 하지만 선택한 길의 책임은 남길 수 있습니다.” 방 한가운데에는 세 개의 버튼이 있다. 완벽한 선택, 빠른 선택, 되돌릴 수 있는 선택. 그러나 안내문에는 완벽한 선택은 존재하지 않는다고 적혀 있다.',q:'불확실한 상황에서 가장 책임 있는 선택은?',opts:['결과를 확인하지 않고 완벽하다고 믿기','정보와 위험을 살피고 필요하면 수정하기','가장 빠른 선택을 무조건 반복하기'],ans:1,why:'좋은 결정은 무오류가 아니라 근거를 살피고 결과를 확인하며 수정할 수 있는 결정이다.',choice:'기록관은 당신의 선택을 지우지 않는다. 대신 왜 골랐는지 옆에 기록한다.'},
  {title:'제11장 · 내일역의 심장',place:'멈춘 시계들이 매달린 기관실',story:'기관실의 중심에는 거대한 시계가 떠 있다. 시계는 시간을 만들지 않는다. 사람들의 약속이 모일 때만 초침이 한 칸 움직인다. 역무원, 사서, 상인, 정원사, 우체국장, 지휘자가 하나씩 나타나 각자의 작은 부품을 내려놓는다. 마지막 자리는 비어 있다. 그 자리에 무엇을 놓을지 당신이 정해야 한다. 과거를 되돌리는 열쇠는 없고, 미래를 보장하는 기계도 없다. 남은 것은 오늘 실제로 할 수 있는 한 가지 행동뿐이다.',q:'시계의 마지막 부품으로 어울리는 것은?',opts:['절대 바뀌지 않는 계획','작게 시작해 계속 확인하는 행동','실패하지 않을 거라는 확신'],ans:1,why:'시간은 확신보다 실제 행동과 반복되는 점검으로 움직인다. 작은 행동이 약속을 현실로 만든다.',choice:'초침이 처음으로 앞으로 움직인다. 기관실 전체에 새벽의 소리가 퍼진다.'},
  {title:'에필로그 · 문 밖의 날씨',place:'아직 이름이 없는 아침',story:'문을 열자 처음의 역으로 돌아온 듯 보인다. 하지만 플랫폼 시계는 00:18을 가리킨다. 단 한 분이 지났는데, 당신은 열한 장의 계절을 통과했다. 역무원은 더 이상 우산을 들고 있지 않다. 그가 누구였는지는 끝내 밝혀지지 않는다. 중요한 것은 그가 누구였느냐가 아니라, 당신이 무엇을 들고 나왔느냐는 것이다. 주머니에는 이름표, 책갈피, 씨앗, 빈 편지가 남아 있다. 각각은 기억, 선택, 가능성, 그리고 아직 쓰지 않은 다음 문장을 뜻한다.',q:'미궁의 마지막 문에 새길 문장은?',opts:['모든 답을 이미 안다','길은 선택한 뒤에야 생긴다','다시는 길을 잃지 않는다'],ans:1,why:'미궁은 모든 답을 주지 않는다. 다음 걸음을 선택할 수 있다는 사실을 돌려준다.',choice:'문이 열린다. 밖의 날씨는 당신이 정할 수 없지만, 우산을 펼칠지는 당신이 정할 수 있다.'}
];

const puzzles=[{"type":"short","label":"주관식 · 단서 추리","q":"본문에서 역무원이 강조한 경고를 기억해 보세요. 문이 열리면 가장 먼저 무엇을 믿지 말라고 했나요?","answer":["시간"],"why":"본문의 편지에는 “문이 열리면 가장 먼저 시간을 믿지 말 것”이라고 적혀 있습니다. 이야기의 시계를 거꾸로 흐르게 한 이유도 여기에 있어요.","hint":"프롤로그에서 승차권 뒷면에 적힌 문장을 다시 읽어보세요."},{"type":"word","label":"단어 조합 · 글자 타일","q":"다음 글자 타일을 조합해, 이름을 대신 맡길 수 있었던 단어를 완성하세요.","tiles":["속","약","그","림","자"],"answer":["약속"],"why":"‘약속’은 이름을 내주는 대신 매표소에 맡겼던 말입니다. 타일을 ‘약’ + ‘속’ 순서로 조합하면 됩니다.","hint":"두 글자이며, 누군가에게 지키겠다고 말하는 것입니다."},{"type":"wordsearch","label":"숨은 단어 · 드래그해서 발견하기","q":"글자판 속에 숨은 두 글자 단어를 찾아보세요. 글자 위를 드래그하거나 차례대로 눌러 선택한 뒤 확인하세요.","grid":[["기","억","시","계"],["약","속","선","택"],["내","일","역","문"],["꿈","길","빛","밤"]],"answer":["선택"],"why":"두 번째 줄 오른쪽에 ‘선택’이 숨어 있었습니다. 다음 길을 바꾸는 힘은 결국 선택에서 시작됩니다.","hint":"두 번째 줄의 오른쪽 두 글자를 이어 읽어보세요."},{"type":"nonsense","label":"넌센스 · 말장난","q":"거꾸로 된 시장에서 가장 비싼 것은 무엇일까요? 이 미궁의 규칙에 맞춰 답해 보세요.","answer":["시간"],"why":"시장 바닥에는 기억, 시간, 기회가 저울에 놓여 있고, 본문은 한 번 지나가면 같은 순간으로 되돌릴 수 없는 것을 묻습니다. 이 장의 말장난 정답은 ‘시간’입니다.","hint":"돈으로 더 살 수 없는 자원 하나를 떠올려 보세요."},{"type":"pattern","label":"규칙 찾기 · 숫자 패턴","q":"온실의 꽃잎 숫자입니다. 2, 3, 5, 8, 12, 17, □. 다음 숫자를 입력하세요.","answer":["23"],"why":"숫자 사이의 차이가 +1, +2, +3, +4, +5로 하나씩 커집니다. 다음 차이는 +6이므로 17+6=23입니다.","hint":"숫자 자체보다 이웃한 숫자 사이의 차이를 적어 보세요."},{"type":"short","label":"주관식 · 증거 읽기","q":"침묵의 법정에서 그림 세 장만으로는 확정할 수 없었던 것은 무엇인가요? 사람의 행동에 담긴 ______ 을(를) 입력하세요.","answer":["의도"],"why":"빈 의자, 멈춘 시계, 닫힌 문은 관찰된 상태입니다. 하지만 그것만으로 사람의 의도를 확정할 수는 없습니다.","hint":"겉으로 보이는 행동과 마음속 이유는 같은 것이 아닙니다."},{"type":"word","label":"단어 조합 · 편지 봉인","q":"우체국에서 배를 띄우려면 도착지를 확정하지 않아야 합니다. 아래 타일을 조합해 미래에 열려 있는 상태를 나타내는 단어를 만드세요.","tiles":["능","가","성","확","정"],"answer":["가능성"],"why":"정해지지 않은 미래를 열어 두는 말은 ‘가능성’입니다. 이 우체국에서는 정확한 주소 대신 가능성을 남겨야 편지가 강을 건넙니다.","hint":"‘할 수 있음’을 뜻하는 두 글자에 ‘성’을 붙여 보세요."},{"type":"math","label":"수학 · 차이의 합","q":"계단 숫자가 1, 2, 4, 7로 늘어납니다. 같은 규칙으로 다음 숫자를 구하세요.","answer":["11"],"why":"증가량이 +1, +2, +3이므로 다음은 +4입니다. 7+4=11입니다.","hint":"매번 더해지는 수가 1씩 커지고 있습니다."},{"type":"vertical","label":"세로 암호 · 위에서 아래로","q":"글자판에서 세로줄을 읽어 두 글자 암호를 찾아보세요. 글자를 위에서 아래로 선택하세요.","grid":[["기","선","시","계"],["억","택","속","길"],["내","일","역","문"],["꿈","길","빛","밤"]],"answer":["선택"],"why":"두 번째 세로줄을 위에서 아래로 읽으면 ‘선택’입니다. 같은 글자도 읽는 방향에 따라 단서가 됩니다.","hint":"가로줄이 아니라 두 번째 세로줄을 읽어보세요."},{"type":"nonsense","label":"넌센스 · 논리 말장난","q":"선택을 저장하는 방에는 과거의 나와 미래의 내가 있습니다. 둘 사이에서 바꿀 수 있는 것은 ‘기록’일까요, ‘다음 행동’일까요? 본문과 맞는 답을 입력하세요.","answer":["다음 행동","행동"],"why":"기록은 이미 일어난 일을 남기지만, 지금의 선택으로 바꿀 수 있는 것은 다음 행동입니다. 미궁의 문도 그 행동으로 열립니다.","hint":"이미 일어난 일과 앞으로 할 수 있는 일을 구분하세요."},{"type":"math","label":"수학 · 역산하기","q":"내일역의 시계는 00:17을 보여 줍니다. 역무원이 시계가 실제 시간보다 8분 빠르다고 말했습니다. 실제 시각은 몇 시 몇 분인가요? 예: 00:09","answer":["00:09","0:09"],"why":"표시된 시각 00:17에서 8분을 빼면 실제 시각은 00:09입니다.","hint":"시계가 빠르다는 것은 실제보다 더 앞선 시각을 보여 준다는 뜻입니다."},{"type":"short","label":"주관식 · 마지막 암호","q":"에필로그에서 내일역의 문을 여는 것은 완벽한 정답이 아니라, 다음 ______ 을(를) 시작하는 순간이라고 말합니다. 빈칸을 입력하세요.","answer":["선택"],"why":"이야기는 끝이 답을 얻는 순간이 아니라 다음 선택을 시작하는 순간이라고 말합니다.","hint":"앞으로 무엇을 할지 결정하는 일을 가리키는 단어입니다."},{"type":"wordsearch","label":"숨은 단어 · 마지막 글자 찾기","q":"글자판 안에서 본문이 말하는 ‘내일을 바꾸는 것’을 찾아 드래그하거나 글자를 차례대로 누르세요.","grid":[["시","간","후","회"],["기","억","선","택"],["문","길","내","일"],["꿈","빛","약","속"]],"answer":["선택"],"why":"두 번째 줄의 ‘선택’이 마지막 숨은 단서입니다. 기억과 후회는 지나온 길을 돌아보게 하지만, 선택은 앞으로의 길을 바꿉니다.","hint":"두 번째 줄의 오른쪽 두 글자를 읽어보세요."}];



let index=0,score=0,answered=new Set();
function restore(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Number.isInteger(x.index)&&x.index>=0&&x.index<chapters.length){index=x.index;score=Math.max(0,Number(x.score)||0);answered=new Set(Array.isArray(x.answered)?x.answered:[]);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({index,score,answered:[...answered]}));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function paintRail(){document.getElementById('railProgress').style.width=Math.round(answered.size/chapters.length*100)+'%';document.getElementById('chapterList').innerHTML=chapters.map((ch,i)=>'<button class="chapter-link '+(i===index?'active ':'')+(answered.has(i)?'done':'')+'" data-index="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b><span>'+esc(ch.title.replace(/^프롤로그 · |^제\d+장 · |^에필로그 · /,''))+'</span></button>').join('');document.querySelectorAll('.chapter-link').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.index);if(n>index&&!answered.has(index))return;index=n;save();render();});}
function normAnswer(v){return String(v||'').normalize('NFC').replace(/[\\s.,!?·~]/g,'').toLowerCase();}
function render(){
 paintRail();
 const ch=chapters[index],p=puzzles[index],done=answered.has(index);
 const symbols=['🎟️','🏷️','📚','🧭','🌒','🌱','⚖️','✉️','🪜','🎼','🪞','🚉','🌦️'];
 let task='';
 if(p.type==='short'||p.type==='math'||p.type==='nonsense'){
   task='<div class="answer-entry"><label for="freeAnswer">답 입력하기</label><div class="answer-row"><input id="freeAnswer" type="text" autocomplete="off" placeholder="'+(p.type==='math'?'숫자 또는 시각을 입력하세요':'정답을 직접 입력하세요')+'" '+(done?'disabled':'')+'><button class="btn primary" id="submitAnswer" type="button" '+(done?'disabled':'')+'>정답 확인</button></div></div>';
 }else if(p.type==='word'){
   task='<div class="puzzle-help">타일을 눌러 순서대로 조합하세요. 잘못 고른 타일은 조합 영역에서 다시 누르면 빠집니다.</div><div class="word-bank">'+p.tiles.map((t,i)=>'<button class="tile" type="button" data-tile="'+i+'" '+(done?'disabled':'')+'>'+esc(t)+'</button>').join('')+'</div><div class="word-build" id="wordBuild" aria-label="조합한 단어">'+(done?esc(p.answer[0]):'조합한 단어가 여기에 표시됩니다')+'</div><div class="answer-row"><button class="btn" id="clearWord" type="button" '+(done?'disabled':'')+'>다시 조합</button><button class="btn primary" id="submitWord" type="button" '+(done?'disabled':'')+'>단어 확인</button></div>';
 }else if(p.type==='drag'){
   task='<div class="puzzle-help">PC에서는 단서를 봉인 위로 드래그하세요. 모바일에서는 단서를 누른 뒤 봉인을 누르면 됩니다.</div><div class="drag-bank">'+p.tiles.map((t,i)=>'<button class="tile drag-tile" draggable="true" type="button" data-drag="'+i+'" '+(done?'disabled':'')+'>'+esc(t)+'</button>').join('')+'</div><div class="drop-seal '+(done?'unlocked':'')+'" id="dropSeal" tabindex="0" role="button" aria-label="정답 단서 놓기">'+(done?'봉인이 열렸습니다 ✓':'여기에 단서를 놓으세요')+'</div>';
 }else if(p.type==='wordsearch'||p.type==='vertical'){
   task='<div class="puzzle-help">PC에서는 글자 위를 드래그해 단어를 찾아보세요. 모바일에서는 글자를 차례대로 누른 뒤 확인할 수 있습니다.</div><div class="letter-grid '+(p.type==='vertical'?'vertical-grid':'')+'" id="letterGrid" style="--grid-cols:'+p.grid[0].length+'">'+p.grid.flat().map((letter,i)=>'<button type="button" class="letter-cell" data-letter="'+i+'" aria-label="글자 '+esc(letter)+'" '+(done?'disabled':'')+'>'+esc(letter)+'</button>').join('')+'</div><div class="word-build" id="foundWord">선택한 글자가 여기에 표시됩니다</div><div class="answer-row"><button class="btn" id="clearLetters" type="button" '+(done?'disabled':'')+'>선택 지우기</button><button class="btn primary" id="checkLetters" type="button" '+(done?'disabled':'')+'>숨은 단어 확인</button></div>';
 }else if(p.type==='pattern'){
   task='<div class="pattern-strip">2 <span>→</span> 3 <span>→</span> 5 <span>→</span> 8 <span>→</span> 12 <span>→</span> 17 <span>→</span> ?</div><div class="answer-entry"><label for="freeAnswer">다음 숫자</label><div class="answer-row"><input id="freeAnswer" type="number" inputmode="numeric" placeholder="숫자 입력" '+(done?'disabled':'')+'><button class="btn primary" id="submitAnswer" type="button" '+(done?'disabled':'')+'>규칙 확인</button></div></div>';
 }
 document.getElementById('chapterHost').innerHTML='<div class="chapter-meta"><span>기억 점수 '+score+' / '+chapters.length+'</span><span class="chapter-count">CHAPTER '+String(index+1).padStart(2,'0')+' / '+chapters.length+'</span></div><article class="chapter-card" style="margin-top:12px"><header class="chapter-banner"><div class="chapter-place">'+esc(ch.place)+'</div><h2 class="chapter-title">'+esc(ch.title)+'</h2></header><div class="chapter-visual" role="img" aria-label="'+esc(ch.place)+'의 상징 장면"><span class="chapter-visual-symbol" aria-hidden="true">'+(symbols[index]||'✦')+'</span><span class="chapter-visual-caption">SEMPLY · TOMORROW STATION</span></div><div class="chapter-body"><p class="chapter-story">'+esc(ch.story)+'</p><section class="riddle"><div class="riddle-label">'+esc(p.label)+'</div><h3>'+esc(p.q)+'</h3>'+task+'<details class="hint-box"><summary>힌트 보기</summary><p>'+esc(p.hint)+'</p></details><div class="feedback" id="feedback">'+(done?'<strong>기록 완료.</strong> '+esc(p.why):'단서를 살펴보고 답을 입력하거나 타일을 조합해 보세요.')+'</div></section><div class="chapter-actions"><button class="btn" id="restartBtn" type="button">처음부터 다시</button><button class="btn primary" id="nextBtn" type="button" '+(!done?'disabled':'')+'>'+(index===chapters.length-1?'결말 확인':'다음 장으로')+' →</button></div><div class="save-note">진행 상황은 현재 브라우저에 저장됩니다. 다른 기기와는 자동 동기화되지 않습니다.</div></div></article>';
 let pickedTiles=[];
 const feedback=document.getElementById('feedback');
 function check(value){
   if(answered.has(index))return;
   const ok=p.answer.some(a=>normAnswer(a)===normAnswer(value));
   if(ok){score++;answered.add(index);save();paintRail();document.getElementById('nextBtn').disabled=false;feedback.innerHTML='<strong>문이 열렸다.</strong> '+esc(p.why)+'<p>'+esc(ch.choice||'새로운 단서가 기록되었습니다. 다음 문으로 이동할 수 있어요.')+'</p>';document.querySelectorAll('.tile,.letter-cell,#freeAnswer,#submitAnswer,#submitWord,#clearWord,#checkLetters,#clearLetters').forEach(el=>el.disabled=true);const seal=document.getElementById('dropSeal');if(seal){seal.classList.add('unlocked');seal.textContent='봉인이 열렸습니다 ✓';}}
   else{feedback.innerHTML='아직 문이 열리지 않았어요. <strong>힌트</strong>를 보거나 본문 속 단서를 다시 살펴보세요.';const input=document.getElementById('freeAnswer');if(input){input.classList.add('answer-wrong');input.focus();setTimeout(()=>input.classList.remove('answer-wrong'),700);}}
 }
 const input=document.getElementById('freeAnswer');
 if(input){document.getElementById('submitAnswer').onclick=()=>check(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')check(input.value);});}
 if(p.type==='word'){
   const build=document.getElementById('wordBuild');
   const refresh=()=>{build.textContent=pickedTiles.length?pickedTiles.map(i=>p.tiles[i]).join(''):'조합한 단어가 여기에 표시됩니다';build.classList.toggle('has-word',pickedTiles.length>0);};
   document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.tile);if(pickedTiles.includes(n))return;pickedTiles.push(n);b.classList.add('selected');refresh();});
   build.onclick=()=>{pickedTiles=[];document.querySelectorAll('[data-tile]').forEach(b=>b.classList.remove('selected'));refresh();};
   document.getElementById('clearWord').onclick=()=>{pickedTiles=[];document.querySelectorAll('[data-tile]').forEach(b=>b.classList.remove('selected'));refresh();};
   document.getElementById('submitWord').onclick=()=>check(pickedTiles.map(i=>p.tiles[i]).join(''));
 }
 if(p.type==='drag'){
   let selected=null;
   const seal=document.getElementById('dropSeal');
   document.querySelectorAll('[data-drag]').forEach(b=>{
     b.addEventListener('dragstart',e=>{selected=Number(b.dataset.drag);e.dataTransfer?.setData('text/plain',String(selected));});
     b.onclick=()=>{selected=Number(b.dataset.drag);document.querySelectorAll('[data-drag]').forEach(x=>x.classList.toggle('selected',x===b));seal.classList.add('ready');seal.textContent='선택한 단서를 여기에 놓으려면 누르세요';};
   });
   seal.addEventListener('dragover',e=>{e.preventDefault();seal.classList.add('ready');});
   seal.addEventListener('dragleave',()=>seal.classList.remove('ready'));
   seal.addEventListener('drop',e=>{e.preventDefault();const n=Number(e.dataTransfer?.getData('text/plain'));check(p.tiles[n]);});
   seal.onclick=()=>{if(selected!==null)check(p.tiles[selected]);};
   seal.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected!==null){e.preventDefault();check(p.tiles[selected]);}});
 }
 if(p.type==='wordsearch'||p.type==='vertical'){
   const grid=document.getElementById('letterGrid'),cells=[...grid.querySelectorAll('.letter-cell')],found=document.getElementById('foundWord');let selected=[],dragging=false,suppressClick=false,pointerStart=-1,didDrag=false;
   const refresh=()=>{cells.forEach((b,i)=>b.classList.toggle('selected',selected.includes(i)));found.textContent=selected.length?selected.map(i=>p.grid.flat()[i]).join(''):'선택한 글자가 여기에 표시됩니다';found.classList.toggle('has-word',selected.length>0);};
   const attempt=()=>{const word=selected.map(i=>p.grid.flat()[i]).join('');if(word)check(word);};
   cells.forEach((cell,i)=>{cell.addEventListener('pointerdown',()=>{if(answered.has(index))return;dragging=true;pointerStart=i;didDrag=false;suppressClick=false;});cell.addEventListener('pointerenter',e=>{if(!dragging||answered.has(index))return;if(e.pointerType==='mouse'&&e.buttons===0)return;const n=Number(cell.dataset.letter);if(n!==pointerStart&&!didDrag){didDrag=true;selected=[pointerStart];}if(didDrag&&!selected.includes(n)){selected.push(n);refresh();}});cell.addEventListener('pointerup',()=>{if(dragging){dragging=false;if(didDrag){suppressClick=true;attempt();}}});cell.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return;}const n=Number(cell.dataset.letter);selected=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n];refresh();});});
   document.getElementById('checkLetters').onclick=attempt;document.getElementById('clearLetters').onclick=()=>{selected=[];refresh();};
 }
 document.getElementById('nextBtn').onclick=()=>{if(!answered.has(index))return;if(index<chapters.length-1){index++;save();render();window.scrollTo({top:0,behavior:'smooth'});}else ending();};
 document.getElementById('restartBtn').onclick=restart;
}
function ending(){document.getElementById('chapterHost').innerHTML='<article class="chapter-card ending"><div class="ending-mark">THE END / SEMPLY ORIGINAL</div><h2>당신은 미궁을<br>통과했다.</h2><p>내일역의 문이 닫히고, 역의 모든 시계가 각자의 속도로 움직이기 시작한다. 끝은 답을 얻는 순간이 아니라, 다음 선택을 시작하는 순간이다.</p><div class="score-big">'+score+' / '+chapters.length+'</div><div class="score-caption">CORRECT ANSWERS</div><div class="grade">'+(score>=10?'기억을 지키는 길잡이':score>=7?'틈을 읽는 탐험가':'다시 길을 만들 줄 아는 사람')+'</div><p>당신이 놓친 문도 사라지지 않았다. 다른 계절에 다시 열릴 수 있도록 기록실에 남겨 두었다. 오늘의 선택이 내일의 길이 되기를.</p><div class="ending-actions"><button class="btn primary" id="replayBtn">새 여정 시작</button><button class="btn" id="reviewBtn">마지막 장 다시 읽기</button></div></article>';document.getElementById('replayBtn').onclick=restart;document.getElementById('reviewBtn').onclick=()=>{index=chapters.length-1;render();};}
function restart(){if(!confirm('미궁을 처음부터 다시 시작할까요? 저장된 미궁 기록이 초기화됩니다.'))return;index=0;score=0;answered=new Set();save();render();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('resumeBtn').onclick=()=>{restore();render();document.querySelector('.story-hero').scrollIntoView({behavior:'smooth',block:'start'});};
restore();render();
</script></body></html>
