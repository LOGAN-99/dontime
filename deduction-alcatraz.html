<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE 011 알카트라즈 탈옥 사건 추리 퀴즈 | 셈플리</title><meta name="description" content="FBI와 연방교도소의 공개 기록을 바탕으로 1962년 알카트라즈 탈옥 사건의 사실과 추정을 구분하는 8문제."><link rel="canonical" href="https://dontime.kr/deduction-alcatraz.html"><style>body{margin:0;background:#091724;color:#edf2f4;font:15px/1.8 Arial,'Noto Sans KR',sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 18px 70px}.nav{display:flex;justify-content:space-between}.nav a{color:#e6bd82;text-decoration:none;font-weight:bold}.card{background:#102433;border:1px solid #3c5668;border-radius:18px;padding:23px;margin:18px 0}.eyebrow{font:900 11px monospace;color:#e6bd82;letter-spacing:.15em}h1{font-size:clamp(28px,6vw,42px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #4a6576;border-radius:11px;background:#142f40;color:#edf2f4;font:inherit;cursor:pointer}.opts button:disabled{cursor:default;opacity:.9}.feedback{display:none;background:#1b3544;padding:14px;border-radius:11px;margin-top:13px;color:#d7e3e8}.feedback.show{display:block}#next{margin-top:15px;background:#e6bd82;color:#16232b;border:0;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer}.small{color:#aebec7;font-size:13px}</style></head><body><main class="wrap"><header class="nav"><a href="/">셈플리</a><a href="/alcatraz-escape.html">다큐로 돌아가기</a></header><section class="card"><div class="eyebrow">CASE 011 · RECORD-BASED REASONING</div><h1>알카트라즈 탈옥 사건 추리 퀴즈</h1><p class="small">공식 기록에서 확인되는 사실을 골라보세요. 생존설이나 사망설을 확정된 정답처럼 다루지 않습니다.</p></section><section class="card"><div class="eyebrow" id="count"></div><p class="question" id="q"></p><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button id="next" hidden>다음 문제 →</button></section><section class="card"><div class="eyebrow">SOURCE</div><p><a href="https://www.fbi.gov/history/cases-and-criminals/alcatraz-escape">FBI · Alcatraz Escape</a></p><p><a href="https://www2.fed.bop.gov/about/history/alcatraz.jsp">Federal Bureau of Prisons · Alcatraz</a></p><p><a href="https://www.usmarshals.gov/what-we-do/fugitive-apprehension/profiled-fugitives/frank-lee-morris">U.S. Marshals Service · Frank Lee Morris</a></p></section></main><script>const qs=[{"q":"세 명의 수감자가 감방에 없다는 사실이 확인된 날은?","o":["1962년 6월 10일","1962년 6월 11일","1962년 6월 12일","1962년 6월 13일"],"a":2,"e":"FBI는 1962년 6월 12일 이른 아침 정기 점호에서 세 사람의 부재가 확인됐다고 기록합니다."},{"q":"FBI가 알카트라즈 탈옥 사건의 주요 실종자로 기록한 세 사람은?","o":["프랭크 모리스와 앵글린 형제","앨런 웨스트와 앵글린 형제","프랭크 모리스와 웨스트 형제","존 앵글린과 웨스트 형제"],"a":0,"e":"주요 실종자는 프랭크 모리스, 존 앵글린, 클래런스 앵글린입니다. 앨런 웨스트는 계획에 참여했지만 감방에 남았습니다."},{"q":"야간 점호에서 침대가 비어 보이지 않도록 사용한 것은?","o":["담요로 만든 사람 모형","석고와 페인트, 실제 머리카락으로 만든 모형 머리","옷을 채운 나무 상자","벽에 붙인 그림자 장치"],"a":1,"e":"FBI 기록은 석고, 피부색 페인트, 실제 사람 머리카락을 사용한 모형 머리가 침대에 놓였다고 설명합니다."},{"q":"감방 뒤편 환기구를 넓히는 데 사용한 즉석 드릴의 모터는 무엇에서 가져왔는가?","o":["탁상 선풍기","전기면도기","고장 난 진공청소기","휴대용 라디오"],"a":2,"e":"FBI 기록에 따르면 고장 난 진공청소기의 모터를 이용해 즉석 드릴을 만들었습니다."},{"q":"FBI 기록에서 임시 구명 장비와 뗏목을 만드는 데 사용한 주요 재료는?","o":["교도소 우비","침대 매트리스","목재 문짝","금속 식판"],"a":0,"e":"FBI는 50벌이 넘는 우비를 모아 임시 구명복과 약 6×14피트 크기의 뗏목을 만들었다고 기록합니다."},{"q":"탈옥 계획에 참여했지만 감방에서 빠져나오지 못한 인물은?","o":["프랭크 모리스","존 앵글린","클래런스 앵글린","앨런 웨스트"],"a":3,"e":"앨런 웨스트는 환기구를 제때 완전히 열지 못해 감방에 남았고, 이후 수사관에게 계획 일부를 설명했습니다."},{"q":"FBI가 자체 수사를 공식 종료한 날짜는?","o":["1963년 3월 21일","1979년 12월 31일","1982년 6월 12일","1990년 1월 1일"],"a":1,"e":"FBI는 1979년 12월 31일 자체 사건을 종결하고 미 연방보안관청으로 책임을 넘겼습니다."},{"q":"현재 공개 기록을 가장 정확하게 요약한 설명은?","o":["세 사람의 생존이 공식 확인됐다","세 사람의 시신이 모두 확인됐다","FBI 수사는 종결됐지만 행방은 확정되지 않았고 미 연방보안관청은 수배 프로필을 유지한다","세 사람은 모두 1963년 교도소 폐쇄 전에 체포됐다"],"a":2,"e":"FBI는 1979년 자체 수사를 종결했지만 미 연방보안관청은 세 사람을 탈옥 혐의로 수배 중인 인물로 공개하고 있습니다. 생사와 행방은 확정되지 않았습니다."}];let i=0,score=0,done=false;const $=x=>document.getElementById(x);function draw(){done=false;$('count').textContent='QUESTION '+(i+1)+' / '+qs.length;$('q').textContent=qs[i].q;$('opts').innerHTML=qs[i].o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$('fb').className='feedback';$('fb').textContent='';$('next').hidden=true;$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.n));}function answer(n){if(done)return;done=true;const x=qs[i];if(n===x.a)score++;$('opts').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#d6b37c';if(j===n&&n!==x.a)b.style.borderColor='#b56f68'});$('fb').textContent=(n===x.a?'정답! ':'정답은 '+x.o[x.a]+'. ')+x.e;$('fb').classList.add('show');$('next').hidden=false;$('next').textContent=i===qs.length-1?'결과 보기':'다음 문제 →';}$('next').onclick=()=>{if(i<qs.length-1){i++;draw()}else{$('count').textContent='RESULT';$('q').textContent='8문제 중 '+score+'문제 정답';$('opts').innerHTML='';$('fb').textContent=score>=6?'기록과 추론을 잘 구분했어요.':'다시 다큐의 근거와 설명을 비교해 보세요.';$('fb').classList.add('show');$('next').hidden=true;}};draw();</script></body></html>
