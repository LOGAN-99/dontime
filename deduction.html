<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미제사건 추리 퀴즈 | 셈플리</title><meta name="description" content="셈플리 해외 미제사건 다큐의 공개 사실과 단서를 바탕으로 추리해보세요."><link rel="canonical" href="https://dontime.kr/deduction.html"><meta name="robots" content="index,follow"><style>body{margin:0;background:#f1f3f1;color:#1d2925;font:15px/1.8 Arial,sans-serif}.wrap{max-width:800px;margin:auto;padding:25px 18px}.nav{display:flex;justify-content:space-between}.nav a{color:inherit;text-decoration:none;font-weight:bold}.card{background:white;border:1px solid #d8dfda;border-radius:16px;padding:23px;margin:18px 0}.eyebrow{font:900 11px monospace;color:#927044;letter-spacing:.15em}h1{font-size:clamp(30px,6vw,46px);line-height:1.2}.question{font-size:20px;font-weight:900}.opts{display:grid;gap:9px}.opts button{padding:13px;text-align:left;border:1px solid #d6ded8;border-radius:10px;background:white;font:inherit;cursor:pointer}.feedback{display:none;background:#edf2ec;padding:13px;border-radius:10px;margin-top:12px}.feedback.show{display:block}#next{margin-top:14px;background:#203e34;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:bold}</style></head><body><main class="wrap"><header class="nav"><a href="/">셈플리</a><a href="/mystery.html">다큐로 돌아가기</a></header><section class="card"><div class="eyebrow">CASE 001 · D. B. COOPER</div><h1>기록으로 추리하기</h1><p>공개된 사실만으로 답을 골라보세요. 미확인 가설을 정답처럼 취급하지 않습니다.</p></section><section class="card"><div class="eyebrow" id="count"></div><p class="question" id="q"></p><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button id="next" hidden>다음 문제 →</button></section><section class="card" style="border:1px solid #d8dfda;border-radius:16px;padding:22px;margin:18px 0;background:#fff"><div class="eyebrow">MORE CASE FILES</div><h2>다른 사건의 공개 단서도 살펴보세요</h2><p><a href="/deduction-isdal.html">CASE 002 · 이스달 여성 추리 퀴즈</a></p><p><a href="/deduction-setagaya.html">CASE 003 · 세타가야 사건 추리 퀴즈</a></p><p><a href="/mystery.html">해외 미제사건 다큐 목록</a></p></section></main><script>const qs=[{q:"사건이 발생한 해는?",o:["1961년","1971년","1981년","1991년"],a:1,e:"FBI 공개 기록의 사건 발생일은 1971년 11월 24일입니다."},{q:"요구한 몸값은?",o:["2만 달러","10만 달러","20만 달러","100만 달러"],a:2,e:"요구한 몸값은 20만 달러였습니다."},{q:"항공기에서 사라진 경위로 알려진 것은?",o:["기내에 숨었다","후방 계단을 통해 낙하산으로 뛰어내렸다","다른 비행기로 옮겼다","공항에서 내렸다"],a:1,e:"후방 계단이 작동한 상태에서 용의자가 사라졌습니다. 착지와 생존 여부는 확인되지 않았습니다."},{q:"용의자가 사용한 이름은?",o:["댄 쿠퍼","존 스미스","로버트 힐","마이클 브라운"],a:0,e:"탑승 시 사용한 이름은 댄 쿠퍼였습니다. D. B. Cooper는 보도 과정에서 굳어진 명칭입니다."},{q:"현재 사건에 대한 가장 정확한 설명은?",o:["범인이 확정됐다","생존이 확인됐다","신원과 행방이 미해결이다","조작으로 판명됐다"],a:2,e:"수사기관은 신원과 행방을 확정하지 못했습니다."}];let i=0,score=0,done=false;const $=x=>document.getElementById(x);function draw(){done=false;$('count').textContent='QUESTION '+(i+1)+' / '+qs.length;$('q').textContent=qs[i].q;$('opts').innerHTML=qs[i].o.map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('');$('fb').className='feedback';$('fb').textContent='';$('next').hidden=true;$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.n));}function answer(n){if(done)return;done=true;let x=qs[i];if(n===x.a)score++;$('opts').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#4c8b67';if(j===n&&n!==x.a)b.style.borderColor='#b66b61'});$('fb').textContent=(n===x.a?'정답! ':'정답은 '+x.o[x.a]+'. ')+x.e;$('fb').classList.add('show');$('next').hidden=false;$('next').textContent=i===qs.length-1?'결과 보기':'다음 문제 →';}$('next').onclick=()=>{if(i<4){i++;draw()}else{$('count').textContent='RESULT';$('q').textContent='5문제 중 '+score+'문제 정답';$('opts').innerHTML='<a href="/mystery.html">다큐 다시 보기</a>';$('fb').textContent='사실과 추측을 구분하는 것이 좋은 추리의 출발점입니다.';$('fb').classList.add('show');$('next').hidden=true;}};draw();</script></body></html>
