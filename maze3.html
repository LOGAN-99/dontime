<main class="wrap"><aside class="side"><div class="kicker">MAZE · PART 03</div><h2>자정 우체국의<br>마지막 편지</h2><div class="progress"><span id="progress"></span></div><div class="chapters" id="chapterNav"></div></aside><section><div class="hero"><div class="kicker">미궁 시리즈 · 세 번째 이야기</div><h1>자정 우체국의<br>마지막 편지</h1><p>자정마다 비가 내리는 도시에서 주소 없는 편지의 수신인을 찾아보세요. 14장의 이야기와 논리 퍼즐을 따라 기록과 기억을 대조하고, 마지막 편지가 향하는 곳을 밝혀내세요.</p></div><div class="ad-slot" aria-label="광고">광고</div><div id="host"></div><div class="ad-slot" aria-label="광고">광고</div></section></main>
<script>
const KEY='dontimeMazePart3Save';
const chapters=[{"title":"01 · 봉인된 편지","place":"비가 멈춘 자정의 창구","symbol":"✉️","story":"편지에는 발신 시각 23:48, 분류 시각 00:03, 출발 시각 00:18이 찍혀 있다. 수신인 칸은 비어 있고, 다음 기록만 칼로 긁혀 나갔다. 우체국 시계가 00:20을 가리키자 직원은 기록의 간격이 일정했다고 말했다.","q":"긁혀 나간 다음 기록의 시각은?","opts":["00:28","00:33","00:38"],"answer":1,"why":"세 기록은 각각 15분 간격이다. 00:18에서 15분 뒤는 00:33이다.","hint":""},{"title":"02 · 멈춘 우체국 시계","place":"서쪽 창구의 낡은 시계","symbol":"🕰️","story":"배달부는 오후 2시 14분에 출발했고 오후 2시 47분에 돌아왔다. 벽시계는 11시 40분에서 멈춰 있었지만, 두 시각은 각각 접수기에 자동으로 찍힌 기록이다. 배달부는 장갑을 벗어 놓고 경과 시간을 묻는 질문에 고개를 끄덕였다.","q":"기록상 배달에 걸린 시간은?","opts":["23분","33분","43분"],"answer":1,"why":"14분에서 47분까지는 33분이다. 멈춘 벽시계는 이 계산에 영향을 주지 않는다.","hint":""},{"title":"03 · 세 개의 주소","place":"갈림길에 선 세 우편함","symbol":"📮","story":"우편함은 서쪽, 중앙, 동쪽 세 자리에 놓여 있고 라벨은 ‘서쪽’, ‘중앙’, ‘동쪽’이다. 라벨은 모두 잘못 붙었다. 조사 기록에는 ‘동쪽’ 라벨이 붙은 우편함이 실제 중앙 자리에 있다고 적혀 있다. 종이 울리기 전, 실제 동쪽 자리에 붙은 라벨을 찾아야 한다.","q":"실제 동쪽 자리에 붙은 라벨은 무엇인가요?","opts":["서쪽","중앙","동쪽"],"answer":0,"why":"동쪽 라벨이 실제 중앙에 있으므로 남은 서쪽과 중앙 라벨은 실제 서쪽과 동쪽에 각각 놓인다. 모든 라벨이 틀려야 하므로 중앙 라벨은 실제 서쪽, 서쪽 라벨은 실제 동쪽이다.","hint":""},{"title":"04 · 사라진 우표","place":"기억을 파는 골목","symbol":"🎟️","story":"은색 우표 세 장이 들어왔다는 장부와 두 장만 남은 서랍이 발견됐다. 열쇠를 가진 사람은 미라, 준, 태오다. 미라는 그날 휴가였고 준은 창구 카메라에 계속 찍혀 있다. 태오의 출입 기록만 7분 동안 비어 있다. 기록이 비어 있다는 이유만으로 범인이라고 단정할 수는 없다.","q":"다음으로 가장 먼저 확인할 기록은 누구의 것인가요?","opts":["미라의 출근 기록","준의 창구 기록","태오의 동선 기록"],"answer":2,"why":"미라는 현장에 없었고 준의 동선은 카메라로 확인된다. 태오의 7분 공백을 추가 기록으로 확인해야 한다. 이는 범인 확정이 아니라 조사 순서다.","hint":""},{"title":"05 · 뒤집힌 배달 지도","place":"북쪽이 없는 지도실","symbol":"🗺️","story":"지도에는 우체국에서 등대까지 3km, 등대에서 역까지 4km, 우체국에서 역까지 5km라고 적혀 있다. 배달부는 등대를 거쳐 역으로 가야 한다. 지도 아래에는 두 경로의 차이를 적는 칸이 남아 있다.","q":"등대를 거치는 길은 역으로 바로 가는 길보다 몇 km 더 긴가요?","opts":["2km","3km","4km"],"answer":0,"why":"등대를 거치는 길은 3+4=7km이고 바로 가는 길은 5km다. 7-5=2km 더 길다.","hint":""},{"title":"06 · 빈칸으로 온 답장","place":"비어 있는 수신함","symbol":"📝","story":"답장에는 4, 9, 16, 25만 적혀 있다. 봉투 모서리에는 네 개의 작은 정사각형이 그려져 있고, 그 옆에는 다음 칸을 만들다 멈춘 연필 자국이 남았다. 발신인은 설명 대신 숫자 하나를 더 적어 달라고 했다.","q":"같은 방식으로 이어지는 다음 숫자는?","opts":["30","36","49"],"answer":1,"why":"숫자는 2², 3², 4², 5²이다. 다음은 6²인 36이다.","hint":"숫자와 봉투의 정사각형 흔적을 함께 살펴보세요."},{"title":"07 · 두 번 찍힌 소인","place":"동쪽 분류대","symbol":"🔖","story":"편지에는 같은 날짜의 소인이 두 번 찍혀 있다. 첫 소인은 ‘접수’, 둘째는 ‘분류’라고 적혀 있다. 배달부는 소인이 두 개이니 두 번 배달된 편지라고 주장한다. 장부에는 접수, 분류, 배달, 반송이 서로 다른 단계로 나뉘어 있다.","q":"두 소인으로 확정할 수 있는 것은 무엇인가요?","opts":["편지가 두 번 배달됐다","편지가 접수되고 분류됐다","수신인에게 전달이 끝났다"],"answer":1,"why":"소인에 적힌 단계는 접수와 분류다. 배달 완료를 뜻하는 표시는 없으므로 그 이상은 확정할 수 없다.","hint":""},{"title":"08 · 배달되지 않은 꽃","place":"유리 지붕 아래의 정원","symbol":"🌷","story":"꽃다발은 시들지 않은 채 돌아왔다. 배달표에는 ‘수취인 부재’라고 적혀 있지만 현관 카메라에는 배달부가 문을 두드리지 않고 돌아서는 장면이 찍혀 있다. 초인종은 고장 나 있었고, 문 옆에는 ‘노크해 주세요’라는 안내가 붙어 있었다.","q":"증거가 가장 직접적으로 뒷받침하는 것은?","opts":["수취인이 집에 없었다","배달 절차가 지켜지지 않았다","꽃다발이 늦게 도착했다"],"answer":1,"why":"카메라는 배달부가 문을 두드리지 않고 돌아선 것을 보여 준다. 수취인이 없었다는 확인은 없다.","hint":""},{"title":"09 · 빗속의 두 배달부","place":"시계탑 아래 교차로","symbol":"☂️","story":"두 배달부의 작업표에는 같은 숫자 314가 적혀 있다. 한 장은 접수번호, 다른 장은 이동번호다. 장부에는 한 편지에 접수번호와 이동번호가 각각 부여된다고 적혀 있다. 두 사람은 같은 편지를 맡았을 수 있지만, 번호만으로는 아직 확인되지 않는다.","q":"번호가 같다는 사실만으로 확정할 수 있는 것은?","opts":["두 사람이 같은 편지를 배달했다","두 기록이 서로 모순된다","두 기록에 숫자 314가 적혀 있다"],"answer":2,"why":"접수번호와 이동번호는 서로 다른 역할의 번호다. 같은 숫자가 적혔다는 것만 확인할 수 있으며, 같은 편지인지 여부는 추가 확인이 필요하다.","hint":""},{"title":"10 · 주소 없는 집","place":"마지막 골목의 문","symbol":"🚪","story":"배달표에는 ‘수신인: 윤서, 도착 조건: 종이 울린 뒤’라고 적혀 있다. 종이 한 번 울리고 창문에 불이 켜졌다. 문 앞에는 같은 이름의 우편물이 두 개 놓여 있다. 우체국장은 이름만으로 봉투를 고르지 말라고 한다.","q":"정확한 편지를 고르려면 무엇을 추가로 확인해야 하나요?","opts":["봉투의 색과 크기","수신인 이름 외의 식별 정보","골목의 길이"],"answer":1,"why":"동명이인이나 같은 이름의 우편물이 있으므로 이름 외에 주소나 접수번호 같은 식별 정보가 필요하다.","hint":""},{"title":"11 · 배달 시간의 계산","place":"분침이 두 개인 탑","symbol":"⏳","story":"세 편지의 배달 시간은 18분, 24분, 30분이었다. 장부의 네 번째 줄은 지워졌지만, 배달부는 같은 간격으로 배달했다고 서명했다. 네 번째 편지의 기록을 복원해야 한다.","q":"네 번째 편지의 배달 시간은 몇 분인가요?","opts":["34분","36분","42분"],"answer":1,"why":"각 기록은 6분씩 늘어난다. 30분 다음은 36분이다.","hint":""},{"title":"12 · 봉인된 반송 편지","place":"반송 우편 보관실","symbol":"🔒","story":"접수번호 72의 장부에는 주소 오류가 오전 9시, 수취 거절이 오후 4시로 기록돼 있다. 봉투에는 오후 4시 소인이 찍혀 있다. 담당자는 봉투와 같은 시각의 기록을 찾아 반송 이유를 확인한다.","q":"반송 사유를 가장 직접적으로 뒷받침하는 기록은?","opts":["오전 9시 주소 오류","오후 4시 수취 거절","두 기록 모두 같은 정도로 직접적이다"],"answer":1,"why":"봉투의 소인과 수취 거절 기록이 모두 오후 4시다. 시간 정보가 일치하는 수취 거절이 더 직접적인 근거다.","hint":""},{"title":"13 · 마지막 배달 목록","place":"새벽이 시작되는 창구","symbol":"📋","story":"마지막 배달 목록에는 세 편지가 남았다. A는 주소가 확인됐고 수취인은 집에 있다. B는 주소가 확인됐지만 수취인은 부재중이다. C는 수취인이 집에 있지만 주소가 한 글자 빠져 있다. 종이 울리기 전 한 통만 전달할 수 있다.","q":"지금 조건에서 바로 전달할 수 있는 편지는?","opts":["A","B","C"],"answer":0,"why":"A는 주소와 수취인 상태가 모두 확인됐다. B는 수취인이 없고 C는 주소가 불완전하다.","hint":""},{"title":"14 · 수신인에게 도착한 편지","place":"비가 그친 중앙 광장","symbol":"🌅","story":"마지막 편지에는 예정 시각, 분류 완료, 수취인 서명이 있는 완료 기록이 들어 있다. 우체국장이 남긴 마지막 질문은 짧았다. ‘계획과 실제 도착을 구분하려면 어떤 기록을 믿어야 하는가?’","q":"실제 배달 완료를 증명하는 기록은?","opts":["배달 예정 시각","수취인 서명이 있는 완료 기록","분류대에 도착했다는 기록"],"answer":1,"why":"예정 시각은 계획이고 분류대 도착은 중간 단계다. 수취인 서명이 있는 완료 기록이 실제 전달을 직접 증명한다.","hint":""}];
let index=0,score=0,done=new Set();
function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Number.isInteger(v.index)&&v.index>=0&&v.index<chapters.length){index=v.index;score=Number(v.score)||0;done=new Set(Array.isArray(v.done)?v.done:[]);if(Number(v.startedAt)>0)startedAt=Number(v.startedAt);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({index,score,done:[...done],startedAt}));}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){document.getElementById('progress').style.width=(done.size/chapters.length*100)+'%';document.getElementById('chapterNav').innerHTML=chapters.map((c,i)=>'<button class="chapter-nav '+(i===index?'active':'')+'" data-i="'+i+'">'+esc(c.title)+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.i);if(n<=index||done.has(index)){index=n;save();render();}});}
function render(){nav();const c=chapters[index],answered=done.has(index);document.getElementById('host').innerHTML='<div class="meta"><span>기억 점수 '+score+' / '+chapters.length+'</span><span>CHAPTER '+String(index+1).padStart(2,'0')+' / '+chapters.length+'</span></div><article class="card"><header class="banner"><div class="place">'+esc(c.place)+'</div><h2 class="title">'+esc(c.title)+'</h2></header><div class="art" role="img" aria-label="'+esc(c.place)+'">'+c.symbol+'</div><div class="body"><p class="story">'+esc(c.story)+'</p><section class="puzzle"><small>THE RIDDLE</small><h3>'+esc(c.q)+'</h3><div class="options">'+c.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'" '+(answered?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+esc(o)+'</span></button>').join('')+'</div><div class="feedback" id="feedback">'+(answered?'<strong>기록 완료.</strong> '+esc(c.why):'단서를 읽고 가장 타당한 답을 골라 보세요.')+'</div>'+(c.hint?'<details class="hint"><summary>힌트 보기</summary><p>'+esc(c.hint)+'</p></details>':'')+'</section><div class="actions"><button class="btn" id="restart">처음부터</button><button class="btn primary" id="next" '+(!answered?'disabled':'')+'>'+(index===chapters.length-1?'결말 보기':'다음 장으로')+' →</button></div></div></article>';
document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(done.has(index))return;const n=Number(b.dataset.opt);if(n===c.answer){score++;done.add(index);save();render();}else{b.classList.add('bad');document.getElementById('feedback').textContent='아직 문이 열리지 않았어요. 이야기 속 단서를 다시 살펴보세요.';}});document.getElementById('next').onclick=()=>{if(!done.has(index))return;if(index<chapters.length-1){index++;save();render();window.scrollTo({top:0,behavior:'smooth'});}else ending();};document.getElementById('restart').onclick=()=>{if(confirm('세 번째 이야기를 처음부터 다시 시작할까요?')){index=0;score=0;done=new Set();save();render();}};}
function ending(){document.getElementById('host').innerHTML='<article class="card ending"><div class="kicker">THE END · PART 03</div><h2>마지막 편지는<br>당신에게 도착했다.</h2><p>도시의 마지막 빗방울이 멎는다. 편지는 사라진 것이 아니었다. 단서를 확인하고 다음 행동을 고르는 순간, 멈췄던 우체국의 시계가 다시 움직이기 시작했다.</p><div class="score">'+score+' / '+chapters.length+'</div><p>정답을 맞힌 수만큼 길을 기억했다. 이제 남은 것은 그 길을 현실에서 어떻게 걸을지 정하는 일이다.</p><section style="margin:24px auto;padding:18px;max-width:520px;border:1px solid var(--line);border-radius:16px;text-align:left"><h3 style="margin-top:0">🏆 온라인 랭킹</h3><label for="sempliNickname">닉네임 (최대 20자)</label><div style="display:flex;gap:8px;margin:8px 0"><input id="sempliNickname" maxlength="20" autocomplete="nickname" placeholder="닉네임 입력" style="min-width:0;flex:1;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:inherit"><button class="btn primary" id="sempliSaveRecord">기록 등록</button></div><p id="sempliRecordStatus" role="status" style="font-size:12px"></p><p style="font-size:11px;opacity:.7">기록은 검증 전 상태로 등록됩니다. 점수 조작 방지 기능은 아직 제한적입니다.</p><div id="sempliLeaderboard">랭킹을 불러오는 중…</div></section><div class="actions"><a class="btn" href="/maze.html">1부 다시 보기</a><button class="btn primary" id="again">3부 다시 시작</button></div></article>';document.getElementById('again').onclick=()=>{if(confirm('기록을 초기화하고 다시 시작할까요?')){index=0;score=0;done=new Set();startedAt=Date.now();try{localStorage.setItem('dontimeStartedAtMaze3',String(startedAt));}catch(e){}save();render();}};document.getElementById('sempliSaveRecord').onclick=sempliSubmitRecord;sempliLoadLeaderboard();}

function sempliEscape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function sempliLoadLeaderboard(){
 const box=document.getElementById('sempliLeaderboard');if(!box)return;
 box.textContent='랭킹을 불러오는 중…';
 try{const u=new URL(SEMPLI_RANKING_API);u.searchParams.set('action','leaderboard');u.searchParams.set('category','미궁');u.searchParams.set('gameId',"maze-03");u.searchParams.set('limit','10');const r=await fetch(u.toString());const d=await r.json();if(!d.ok)throw new Error('랭킹 조회 실패');if(!d.records.length){box.innerHTML='<p>아직 등록된 기록이 없습니다. 첫 기록을 남겨보세요!</p>';return;}box.innerHTML='<ol style="text-align:left;padding-left:24px">'+d.records.map(x=>'<li style="padding:6px 0">'+sempliEscape(x.nickname)+' · '+x.score+'점 · '+sempliTime(x.elapsedSeconds)+'</li>').join('')+'</ol>';}catch(e){box.textContent='랭킹을 불러오지 못했습니다. 배포 상태를 확인한 뒤 다시 시도해 주세요.';}

async function sempliSubmitRecord(){
 const input=document.getElementById('sempliNickname'),status=document.getElementById('sempliRecordStatus'),btn=document.getElementById('sempliSaveRecord');const nickname=(input.value||'').trim();
 if(!nickname||nickname.length>20){status.textContent='닉네임을 1~20자로 입력해 주세요.';input.focus();return;}
 btn.disabled=true;status.textContent='기록을 저장하는 중…';
 try{const r=await fetch(SEMPLI_RANKING_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({category:'미궁',gameId:"maze-03",nickname,elapsedSeconds:sempliElapsed(),score})});const d=await r.json();if(!d.ok)throw new Error(d.error||'저장 실패');status.textContent='기록이 접수됐어요. 검증 전 기록입니다.';await sempliLoadLeaderboard();}catch(e){status.textContent='저장 실패. 웹 앱 배포 주소와 액세스 권한을 확인해 주세요.';btn.disabled=false;}
