<main class="wrap"><aside class="side"><div class="kicker">MAZE · PART 03</div><h2>자정 우체국의<br>마지막 편지</h2><div class="progress"><span id="progress"></span></div><div class="chapters" id="chapterNav"></div></aside><section><div class="hero"><div class="kicker">미궁 시리즈 · 세 번째 이야기</div><h1>자정 우체국의<br>마지막 편지</h1><p>자정마다 비가 내리는 도시에서 주소 없는 편지의 수신인을 찾아보세요. 14장의 이야기와 논리 퍼즐을 따라 기록과 기억을 대조하고, 마지막 편지가 향하는 곳을 밝혀내세요.</p></div><div class="ad-slot" aria-label="광고">광고</div><div id="host"></div><div class="ad-slot" aria-label="광고">광고</div></section></main>
<script>
const KEY='dontimeMazePart3Save';
const chapters=[{"title":"01 · 비에 젖지 않는 편지","place":"자정의 우편 광장","symbol":"✉️","story":"도시는 매일 자정에 비가 내린다. 그런데 광장 한가운데 놓인 편지 한 장만은 젖지 않는다. 봉투에는 받는 사람도 주소도 없고, 뒷면에는 ‘도착한 뒤에야 보낼 수 있는 편지’라고 적혀 있다. 우편국의 문지기는 말한다. “이 도시에선 순서가 뒤집히는 일이 흔하지. 하지만 단서까지 거꾸로 읽을 필요는 없어.”","q":"편지의 정체를 알아내기 위해 가장 먼저 확인할 것은?","opts":["봉투의 색깔만 보고 보낸 사람을 추측한다","봉투에 적힌 문구와 주변의 기록을 함께 살핀다","주소가 없으니 바로 버린다"],"answer":1,"why":"단서는 하나만 떼어 보지 말고 주변 기록과 함께 해석해야 한다.","hint":"눈에 띄는 특징 하나보다 서로 연결되는 정보를 찾아보세요."},{"title":"02 · 멈춘 우체국 시계","place":"서쪽 창구의 낡은 시계","symbol":"🕰️","story":"우체국 시계는 11시 40분에서 멈췄다. 벽에는 ‘마지막 배달은 20분 뒤’라고 쓰여 있지만, 날짜는 지워져 있다. 직원은 시계가 멈춘 순간과 실제 시간이 같다고 장담할 수 없다고 말한다. 책상 위에는 오늘 날짜가 찍힌 접수표가 놓여 있다.","q":"마지막 배달 시각을 판단할 때 가장 신뢰할 수 있는 방법은?","opts":["멈춘 시계만 믿고 계산한다","접수표 날짜와 배달 안내의 기준을 확인한다","가장 늦어 보이는 시간을 고른다"],"answer":1,"why":"멈춘 시계는 현재 시간을 보장하지 않으므로 기준 날짜와 기록을 대조해야 한다.","hint":"오래된 표시와 현재 기록 중 어느 쪽이 확인 가능한 정보인지 살펴보세요."},{"title":"03 · 세 개의 주소","place":"갈림길에 선 세 우편함","symbol":"📮","story":"세 우편함에는 각각 ‘어제의 집’, ‘지금의 집’, ‘아직 없는 집’이라고 쓰여 있다. 편지의 수신인은 이름만 남긴 채 주소를 지웠다. 우편 배달부는 “이름이 같아도 목적지는 다를 수 있어. 같은 사람인지, 같은 장소인지부터 분명히 해야 해”라고 말한다.","q":"수신인을 정확히 찾기 위해 필요한 정보는?","opts":["이름만으로 첫 번째 우편함을 고른다","수신인과 주소를 구분해 추가 단서를 확인한다","세 우편함에 모두 편지를 넣는다"],"answer":1,"why":"이름만으로 목적지를 확정할 수 없으므로 주소를 식별할 추가 단서가 필요하다.","hint":"비슷해 보이는 정보라도 서로 다른 의미일 수 있어요."},{"title":"04 · 사라진 우표","place":"기억을 파는 골목","symbol":"🎟️","story":"골목의 상인은 사라진 우표를 찾으려면 값을 치르라고 한다. 그는 우표가 은빛이었다고 기억하지만, 장부에는 푸른색이라고 적혀 있다. 상인은 자신의 기억이 틀렸을 수도 있다고 인정한다. 장부 아래에는 날짜와 함께 우표를 바꿔 붙였다는 메모가 있다.","q":"서로 다른 기록이 있을 때 가장 합리적인 행동은?","opts":["사람의 기억을 무조건 믿는다","기록의 날짜와 변경 내역을 확인한다","불일치를 무시하고 결론을 낸다"],"answer":1,"why":"기록이 달라진 이유와 시점을 확인해야 모순을 설명할 수 있다.","hint":"무엇이 언제 바뀌었는지 알려 주는 흔적을 찾아보세요."},{"title":"05 · 뒤집힌 배달 지도","place":"북쪽이 없는 지도실","symbol":"🗺️","story":"지도실의 지도는 위아래가 뒤집혀 있다. 문 앞 안내판은 북쪽을 가리키지만, 지도에는 방향 표시가 없다. 견습 배달부는 길을 외워서 가자고 한다. 관리인은 “외운 길은 편리하지만, 기준이 바뀌면 실수하기 쉽다”고 말하며 지도 모서리를 가리킨다.","q":"뒤집힌 지도를 안전하게 읽는 첫 단계는?","opts":["기억나는 방향대로 걷는다","방향 표시와 실제 기준점을 맞춘다","지도를 보지 않고 달린다"],"answer":1,"why":"지도는 방향과 기준점을 확인해야 현실의 위치와 연결할 수 있다.","hint":"지도를 현실에 맞춰 정렬할 기준이 필요해요."},{"title":"06 · 빈칸으로 온 답장","place":"비어 있는 수신함","symbol":"📝","story":"당신이 보낸 편지에 답장이 도착했다. 종이에는 문장 대신 빈칸 하나와 작은 점이 찍혀 있다. 우체국 기록에는 답장이 정상적으로 전달됐다고 적혀 있다. 직원은 “빈칸도 정보일 수 있지만, 의미를 정하려면 어떤 질문에 대한 답인지 알아야 한다”고 설명한다.","q":"빈칸의 의미를 섣불리 단정하지 않으려면?","opts":["거절이라고 확정한다","원래 보낸 질문과 전달 기록을 다시 확인한다","답장이 아니라고 버린다"],"answer":1,"why":"표현이 모호하면 앞뒤 맥락과 질문을 확인해야 의미를 판단할 수 있다.","hint":"이 답이 무엇에 대한 응답인지 먼저 떠올려 보세요."},{"title":"07 · 두 번 찍힌 소인","place":"동쪽 분류대","symbol":"🔖","story":"한 편지에는 같은 날짜의 소인이 두 번 찍혀 있다. 첫 번째는 새벽, 두 번째는 저녁이라고 기록돼 있다. 분류 담당자는 “두 번 기록됐다는 사실만으로 두 번 배달됐다고 말할 수는 없어. 기록이 무엇을 뜻하는지 구분해야 해”라고 한다.","q":"중복된 소인을 해석할 때 확인해야 할 것은?","opts":["무조건 두 번 배달됐다고 본다","각 소인이 접수인지 이동인지 배달인지 구분한다","하나의 기록을 임의로 지운다"],"answer":1,"why":"같은 표시가 여러 번 있어도 각각의 기록이 나타내는 단계가 다를 수 있다.","hint":"표시의 개수보다 각 표시의 역할을 확인하세요."},{"title":"08 · 배달되지 않은 꽃","place":"유리 지붕 아래의 정원","symbol":"🌷","story":"꽃다발이 한 송이도 시들지 않은 채 돌아왔다. 배달표에는 ‘수취인 부재’라고 쓰여 있지만, 정원 관리인은 그날 하루 종일 집에 있었다고 말한다. 문 앞에는 초인종이 고장 났다는 안내가 붙어 있다. 배달부는 자신의 절차를 다시 점검하기 시작한다.","q":"문제가 반복되지 않도록 가장 먼저 할 일은?","opts":["수취인에게 책임을 돌린다","배달 절차와 연락 방법을 확인하고 보완한다","꽃을 다시 보내지 않는다"],"answer":1,"why":"문제 원인을 확인하고 절차를 개선해야 같은 실패를 줄일 수 있다.","hint":"누가 잘못했는지 단정하기 전에 과정에서 빠진 단계가 있는지 살펴보세요."},{"title":"09 · 빗속의 두 배달부","place":"시계탑 아래 교차로","symbol":"☂️","story":"두 배달부가 같은 편지를 자신이 맡았다고 주장한다. 한 사람은 접수표를, 다른 사람은 배달 가방의 번호를 보여 준다. 두 기록은 서로 모순되지 않지만, 어느 한쪽도 전체 과정을 설명하지 못한다. 시계탑 아래에는 두 번호가 이어진 작업표가 떨어져 있다.","q":"두 배달부의 주장을 확인하는 가장 좋은 방법은?","opts":["먼저 말한 사람의 주장을 믿는다","접수표와 작업표를 연결해 전체 이동 경로를 확인한다","둘 중 한 명을 바로 의심한다"],"answer":1,"why":"개별 단서를 연결해 전체 과정을 확인해야 서로 다른 기록의 관계를 알 수 있다.","hint":"각 기록을 따로 보지 말고 시간 순서로 이어 보세요."},{"title":"10 · 주소 없는 집","place":"마지막 골목의 문","symbol":"🚪","story":"마지막 골목에는 문만 있고 집은 보이지 않는다. 문패에는 ‘기다리는 사람의 집’이라고 적혀 있다. 문을 두드리자 안에서 “주소를 찾으려 하지 말고, 내가 누구인지 물어보라”고 답한다. 당신은 편지에 적힌 이름을 다시 읽는다. 이름 옆에는 작은 질문 하나가 적혀 있다.","q":"집의 주인을 찾기 위해 다음으로 할 일은?","opts":["문패만 보고 집주인을 단정한다","편지의 이름과 질문을 활용해 신원을 확인한다","문을 부수고 들어간다"],"answer":1,"why":"정체를 확인할 때는 표식 하나보다 질문과 식별 정보를 활용해야 한다.","hint":"이야기 속 편지가 처음부터 가지고 있던 단서를 다시 보세요."},{"title":"11 · 배달 시간의 계산","place":"분침이 두 개인 탑","symbol":"⏳","story":"탑의 시계에는 분침이 두 개 있다. 하나는 출발 시각, 하나는 도착 시각을 가리키지만 색이 바래 구분하기 어렵다. 기록에는 출발이 오후 2시 15분, 도착이 오후 3시라고 적혀 있다. 배달부는 “눈대중보다 기록으로 계산하면 돼”라고 말한다.","q":"기록된 시간 사이의 경과 시간은?","opts":["35분","45분","55분"],"answer":1,"why":"오후 2시 15분에서 오후 3시까지는 45분이다.","hint":"2시 15분에서 3시까지 남은 분을 계산해 보세요."},{"title":"12 · 봉인된 반송 편지","place":"반송 우편 보관실","symbol":"🔒","story":"반송 보관실에는 봉인된 편지가 있다. 겉면에는 ‘보낸 사람에게 돌아갈 것’이라고 쓰였지만, 반송 사유 칸은 비어 있다. 담당자는 봉인을 뜯기 전에 접수번호를 장부에서 찾는다. 같은 번호의 기록에는 주소 오류와 수취 거절이라는 두 가지 가능성이 남아 있다.","q":"반송 사유를 확인하는 올바른 순서는?","opts":["가능성 중 하나를 무작정 고른다","접수번호로 원본 기록과 확인 가능한 증거를 찾는다","봉투를 버리고 새 편지를 쓴다"],"answer":1,"why":"가능성이 여러 개일 때는 식별 번호를 이용해 원본 기록을 확인해야 한다.","hint":"추측보다 원래 기록으로 돌아갈 수 있게 해 주는 정보가 무엇인가요?"},{"title":"13 · 마지막 배달 목록","place":"새벽이 시작되는 창구","symbol":"📋","story":"마지막 배달을 앞두고 목록에 세 이름이 남아 있다. 첫 번째는 주소가 확인됐고, 두 번째는 수취인이 부재중이며, 세 번째는 주소가 불완전하다. 배달부는 세 편지를 모두 들고 뛰려 하지만, 창구 직원은 순서를 정하라고 한다. “긴급함과 실행 가능성은 같은 기준이 아니야.”","q":"현재 조건에서 가장 먼저 처리할 편지는?","opts":["주소가 확인돼 바로 배달할 수 있는 편지","수취인이 부재중인 편지","주소가 불완전한 편지"],"answer":0,"why":"주소가 확인된 편지는 지금 실행할 수 있으므로 우선 처리할 수 있다. 나머지는 추가 확인이 필요하다.","hint":"중요도뿐 아니라 지금 실제로 실행 가능한지도 고려하세요."},{"title":"14 · 수신인에게 도착한 편지","place":"비가 그친 중앙 광장","symbol":"🌅","story":"자정이 끝나고 비가 그친다. 당신은 처음의 편지를 마침내 열어 본다. 안에는 짧은 문장이 적혀 있다. “당신이 찾던 수신인은 미래의 누군가가 아니라, 단서를 확인하고 다음 행동을 고른 지금의 당신이었다.” 우체국 시계가 다시 움직인다. 모든 편지가 목적지에 도착한 것은 아니지만, 당신은 이제 길을 잃었을 때 무엇부터 확인해야 하는지 안다.","q":"이 미궁에서 가장 중요한 배달 기술은 무엇이었을까요?","opts":["첫인상만으로 빠르게 결론 내리기","단서를 확인하고 기록을 연결해 다음 행동을 정하기","불확실한 정보는 모두 버리기"],"answer":1,"why":"단서를 검증하고 맥락을 연결한 뒤 행동하는 것이 이 이야기의 핵심이다.","hint":"첫 장부터 반복해서 등장한 우편국의 원칙을 떠올려 보세요."}];
let index=0,score=0,done=new Set();
function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Number.isInteger(v.index)&&v.index>=0&&v.index<chapters.length){index=v.index;score=Number(v.score)||0;done=new Set(Array.isArray(v.done)?v.done:[]);if(Number(v.startedAt)>0)startedAt=Number(v.startedAt);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({index,score,done:[...done],startedAt}));}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){document.getElementById('progress').style.width=(done.size/chapters.length*100)+'%';document.getElementById('chapterNav').innerHTML=chapters.map((c,i)=>'<button class="chapter-nav '+(i===index?'active':'')+'" data-i="'+i+'">'+esc(c.title)+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.i);if(n<=index||done.has(index)){index=n;save();render();}});}
function render(){nav();const c=chapters[index],answered=done.has(index);document.getElementById('host').innerHTML='<div class="meta"><span>기억 점수 '+score+' / '+chapters.length+'</span><span>CHAPTER '+String(index+1).padStart(2,'0')+' / '+chapters.length+'</span></div><article class="card"><header class="banner"><div class="place">'+esc(c.place)+'</div><h2 class="title">'+esc(c.title)+'</h2></header><div class="art" role="img" aria-label="'+esc(c.place)+'">'+c.symbol+'</div><div class="body"><p class="story">'+esc(c.story)+'</p><section class="puzzle"><small>THE RIDDLE</small><h3>'+esc(c.q)+'</h3><div class="options">'+c.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'" '+(answered?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+esc(o)+'</span></button>').join('')+'</div><div class="feedback" id="feedback">'+(answered?'<strong>기록 완료.</strong> '+esc(c.why):'단서를 읽고 가장 타당한 답을 골라 보세요.')+'</div><details class="hint"><summary>힌트 보기</summary><p>'+esc(c.hint)+'</p></details></section><div class="actions"><button class="btn" id="restart">처음부터</button><button class="btn primary" id="next" '+(!answered?'disabled':'')+'>'+(index===chapters.length-1?'결말 보기':'다음 장으로')+' →</button></div></div></article>';
document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(done.has(index))return;const n=Number(b.dataset.opt);if(n===c.answer){score++;done.add(index);save();render();}else{b.classList.add('bad');document.getElementById('feedback').textContent='아직 문이 열리지 않았어요. 힌트를 보고 단서를 다시 살펴보세요.';}});document.getElementById('next').onclick=()=>{if(!done.has(index))return;if(index<chapters.length-1){index++;save();render();window.scrollTo({top:0,behavior:'smooth'});}else ending();};document.getElementById('restart').onclick=()=>{if(confirm('세 번째 이야기를 처음부터 다시 시작할까요?')){index=0;score=0;done=new Set();save();render();}};}
function ending(){document.getElementById('host').innerHTML='<article class="card ending"><div class="kicker">THE END · PART 03</div><h2>마지막 편지는<br>당신에게 도착했다.</h2><p>도시의 마지막 빗방울이 멎는다. 편지는 사라진 것이 아니었다. 단서를 확인하고 다음 행동을 고르는 순간, 멈췄던 우체국의 시계가 다시 움직이기 시작했다.</p><div class="score">'+score+' / '+chapters.length+'</div><p>정답을 맞힌 수만큼 길을 기억했다. 이제 남은 것은 그 길을 현실에서 어떻게 걸을지 정하는 일이다.</p><section style="margin:24px auto;padding:18px;max-width:520px;border:1px solid var(--line);border-radius:16px;text-align:left"><h3 style="margin-top:0">🏆 온라인 랭킹</h3><label for="sempliNickname">닉네임 (최대 20자)</label><div style="display:flex;gap:8px;margin:8px 0"><input id="sempliNickname" maxlength="20" autocomplete="nickname" placeholder="닉네임 입력" style="min-width:0;flex:1;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:inherit"><button class="btn primary" id="sempliSaveRecord">기록 등록</button></div><p id="sempliRecordStatus" role="status" style="font-size:12px"></p><p style="font-size:11px;opacity:.7">기록은 검증 전 상태로 등록됩니다. 점수 조작 방지 기능은 아직 제한적입니다.</p><div id="sempliLeaderboard">랭킹을 불러오는 중…</div></section><div class="actions"><a class="btn" href="/maze.html">1부 다시 보기</a><button class="btn primary" id="again">3부 다시 시작</button></div></article>';document.getElementById('again').onclick=()=>{if(confirm('기록을 초기화하고 다시 시작할까요?')){index=0;score=0;done=new Set();startedAt=Date.now();try{localStorage.setItem('dontimeStartedAtMaze3',String(startedAt));}catch(e){}save();render();}};document.getElementById('sempliSaveRecord').onclick=sempliSubmitRecord;sempliLoadLeaderboard();}
restore();render();

const SEMPLI_RANKING_API="https://script.google.com/macros/s/AKfycbzWKifFsQvTwpJgNWZskSGm5RrDPVZgWfOKqoIxmsW7f8IGK8r469s2DhnV0Pb3-xt_/exec";
let startedAt=Number(localStorage.getItem("dontimeStartedAtMaze3")||0);
if(!startedAt){startedAt=Date.now();try{localStorage.setItem("dontimeStartedAtMaze3",String(startedAt));}catch(e){}}
function sempliEscape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sempliElapsed(){return Math.max(1,Math.floor((Date.now()-startedAt)/1000));}
function sempliTime(s){s=Math.max(0,Number(s)||0);return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초';}
async function sempliLoadLeaderboard(){
 const box=document.getElementById('sempliLeaderboard');if(!box)return;
 box.textContent='랭킹을 불러오는 중…';
 try{const u=new URL(SEMPLI_RANKING_API);u.searchParams.set('action','leaderboard');u.searchParams.set('category','미궁');u.searchParams.set('gameId',"maze-03");u.searchParams.set('limit','10');const r=await fetch(u.toString());const d=await r.json();if(!d.ok)throw new Error('랭킹 조회 실패');if(!d.records.length){box.innerHTML='<p>아직 등록된 기록이 없습니다. 첫 기록을 남겨보세요!</p>';return;}box.innerHTML='<ol style="text-align:left;padding-left:24px">'+d.records.map(x=>'<li style="padding:6px 0">'+sempliEscape(x.nickname)+' · '+x.score+'점 · '+sempliTime(x.elapsedSeconds)+'</li>').join('')+'</ol>';}catch(e){box.textContent='랭킹을 불러오지 못했습니다. 배포 상태를 확인한 뒤 다시 시도해 주세요.';}
}
async function sempliSubmitRecord(){
 const input=document.getElementById('sempliNickname'),status=document.getElementById('sempliRecordStatus'),btn=document.getElementById('sempliSaveRecord');const nickname=(input.value||'').trim();
 if(!nickname||nickname.length>20){status.textContent='닉네임을 1~20자로 입력해 주세요.';input.focus();return;}
 btn.disabled=true;status.textContent='기록을 저장하는 중…';
 try{const r=await fetch(SEMPLI_RANKING_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({category:'미궁',gameId:"maze-03",nickname,elapsedSeconds:sempliElapsed(),score})});const d=await r.json();if(!d.ok)throw new Error(d.error||'저장 실패');status.textContent='기록이 접수됐어요. 검증 전 기록입니다.';await sempliLoadLeaderboard();}catch(e){status.textContent='저장 실패. 웹 앱 배포 주소와 액세스 권한을 확인해 주세요.';btn.disabled=false;}
}

</script></body></html>
