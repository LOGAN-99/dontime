</main><script>
const qs=[
{q:"시카고 타이레놀 독극물 사건에서 사망자가 발생한 시기는?",o:["1982년 9월 29~30일","1982년 11월 5~6일","1983년 10월 12~13일","1984년 2월 5~6일"],a:0,e:"FBI와 AP의 사건 연혁은 1982년 9월 29일부터 시카고 일대에서 사망이 발생했다고 기록합니다."},
{q:"1982년 시카고 일대에서 타이레놀 사건으로 사망한 사람은 몇 명인가?",o:["5명","6명","7명","9명"],a:2,e:"FBI는 이 사건으로 7명이 사망했다고 정리합니다."},
{q:"당시 사망과 연결된 제품 형태는 무엇이었나?",o:["시럽형 감기약","엑스트라 스트렝스 타이레놀 캡슐","비타민 정제","외용 연고"],a:1,e:"공개 기록은 엑스트라 스트렝스 타이레놀 캡슐과 청산가리 오염을 사건의 핵심으로 설명합니다."},
{q:"James Lewis가 유죄 판결을 받은 사건은 무엇인가?",o:["타이레놀 살인","제약회사 갈취","의약품 제조 위반","시카고 연쇄 방화"],a:1,e:"Lewis는 제조사에 금전을 요구한 갈취 사건으로 유죄 판결을 받았지만 타이레놀 살인 사건으로 기소되지는 않았습니다."},
{q:"FDA가 tamper-resistant packaging 규정을 공표한 날짜는?",o:["1982년 9월 29일","1982년 11월 5일","1983년 10월 13일","1984년 2월 6일"],a:1,e:"FDA 자료는 관련 규정이 1982년 11월 5일 공표됐고, 요구사항은 1984년 2월 6일까지 발효됐다고 안내합니다."},
{q:"Federal Anti-Tampering Act of 1983이 제정된 날짜는?",o:["1982년 11월 5일","1983년 1월 1일","1983년 10월 13일","1984년 2월 6일"],a:2,e:"미 법무부 자료는 해당 법률이 1983년 10월 13일 제정됐다고 설명합니다."},
{q:"2026년 아이다호 수사팀이 Mathew Betkouski에 관해 공개한 내용으로 가장 정확한 것은?",o:["시카고 살인 사건의 유죄가 확정됐다","타이레놀 사건과의 가능성 있는 연결을 제시했으나 확정된 범인으로 입증하지는 않았다","시카고 경찰이 즉시 기소했다","1982년 사건 당시 시카고에 있었다는 사실이 확정됐다"],a:1,e:"2026년 9월 발표는 가능한 연결을 제시했지만, Chicago Police가 확정된 용의자 여부를 공개적으로 확인한 것은 아닙니다. AP는 관련 물질의 차이와 1982년 당시 시카고 체류가 확인되지 않았다는 점도 보도했습니다."},
{q:"현재 공개 자료만으로 내릴 수 있는 가장 신중한 결론은?",o:["Betkouski의 범행이 법적으로 입증됐다","James Lewis가 살인으로 유죄 판결을 받았다","살인 사건은 미해결이며 새 연결설도 추가 검증이 필요하다","2026년 발표로 사건이 종결됐다"],a:2,e:"살인 사건으로 기소된 사람은 없고, 2026년 연결설도 공개된 정황 단계입니다. 가능성과 입증을 구분해야 합니다."}
];
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);
function draw(){locked=false;const x=qs[i];$("count").textContent="QUESTION "+(i+1)+" / "+qs.length;$("q").textContent=x.q;$("opts").innerHTML="";x.o.forEach((v,n)=>{const b=document.createElement("button");b.textContent=String.fromCharCode(65+n)+". "+v;b.onclick=()=>answer(n);$("opts").appendChild(b)});$("fb").className="feedback";$("fb").textContent="";$("next").hidden=true;$("bar").style.width=(i/qs.length*100)+"%"}
function answer(n){if(locked)return;locked=true;const x=qs[i];if(n===x.a)score++;[...$("opts").children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#8bb5b2";if(j===n&&n!==x.a)b.style.borderColor="#c18b82"});$("fb").textContent=(n===x.a?"정답입니다. ":"정답은 "+x.o[x.a]+". ")+x.e;$("fb").classList.add("show");$("next").hidden=false;$("next").textContent=i===qs.length-1?"결과 보기":"다음 문제 →"}
$("next").onclick=()=>{if(i<qs.length-1){i++;draw()}else{$("count").textContent="RESULT";$("q").textContent=qs.length+"문제 중 "+score+"문제 정답";$("opts").innerHTML='<a href="/tylenol-murders.html">다큐 다시 보기</a> · <a href="/maze10.html">미궁 PART 10</a>'; $("fb").textContent="정황은 수사의 출발점이지만, 결론은 검증된 증거에 맞춰야 합니다.";$("fb").classList.add("show");$("next").hidden=true;$("bar").style.width="100%"}};
draw();
</script></body></html>
