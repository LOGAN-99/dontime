<title id="title">CASE 008, 18번 도로의 안개 낀 새벽</title><desc id="desc">실제 사건 현장이나 인물을 묘사하지 않은 창작 배경. 비에 젖은 가상의 노스캐롤라이나 시골 도로와 18번 표지판, 안개, 가로등을 표현한다.</desc>
