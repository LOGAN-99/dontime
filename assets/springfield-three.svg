<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A quiet Springfield street at dawn</title><desc id="desc">A fictional editorial illustration of a quiet Midwestern residential street, porch light and archive-like atmosphere. Not a depiction of an actual residence or crime scene.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#111f31"/><stop offset=".58" stop-color="#536477"/><stop offset="1" stop-color="#a17c62"/></linearGradient>
 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#263744"/><stop offset="1" stop-color="#101a25"/></linearGradient>
 <linearGradient id="house" x2="0" y2="1"><stop stop-color="#8b9aa0"/><stop offset="1" stop-color="#36444f"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#ffe0a2" stop-opacity=".9"/><stop offset="1" stop-color="#f6bb6a" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#dbe6e7" stop-opacity=".8"/><stop offset="1" stop-color="#8ea0a8" stop-opacity=".1"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.7 0 0 0 0 0.75 0 0 0 0 0.8 0 0 0 .09 0"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1220" cy="250" r="180" fill="#e7b98c" opacity=".13" filter="url(#blur)"/>
<path d="M0 450 Q210 380 420 455 T850 430 T1600 440 V900 H0Z" fill="#1c2a35"/>
<path d="M0 610 L1600 560 V900 H0Z" fill="url(#road)"/>
<path d="M0 770 Q450 710 850 765 T1600 740 V900 H0Z" fill="#0c1720" opacity=".75"/>
<!-- distant houses -->
<g opacity=".82">
 <path d="M90 490 L220 410 L360 485 V675 H90Z" fill="#354551"/><path d="M70 490 L220 385 L380 490" fill="none" stroke="#71808a" stroke-width="12"/>
 <rect x="125" y="525" width="55" height="80" fill="#c18f65" opacity=".48"/><rect x="245" y="520" width="58" height="65" fill="#e3c18b" opacity=".55"/>
 <path d="M430 500 L570 420 L725 505 V690 H430Z" fill="#45525c"/><path d="M410 505 L570 395 L748 505" fill="none" stroke="#829098" stroke-width="13"/>
 <rect x="475" y="535" width="70" height="70" fill="#e7c48d" opacity=".35"/><rect x="610" y="530" width="64" height="80" fill="#c88d61" opacity=".45"/>
</g>
<!-- foreground house -->
<path d="M960 470 L1240 285 L1570 455 V900 H960Z" fill="url(#house)"/>
<path d="M920 470 L1245 245 L1600 430" fill="none" stroke="#182630" stroke-width="32"/>
<path d="M1040 490 V900 M1510 480 V900" stroke="#202f39" stroke-width="14" opacity=".8"/>
<rect x="1100" y="490" width="150" height="190" rx="4" fill="#192b37" stroke="#a7b0b0" stroke-opacity=".3" stroke-width="7"/>
<rect x="1120" y="510" width="110" height="150" fill="#e8bb7b" opacity=".28"/>
<path d="M1120 580 H1230 M1175 510 V660" stroke="#9ba9ad" stroke-opacity=".45" stroke-width="5"/>
<rect x="1330" y="490" width="160" height="180" fill="#152430" stroke="#9ba7aa" stroke-opacity=".35" stroke-width="7"/>
<rect x="1350" y="510" width="120" height="140" fill="#e5b979" opacity=".32"/>
<path d="M1350 580 H1470 M1410 510 V650" stroke="#a2afb2" stroke-opacity=".4" stroke-width="5"/>
<!-- porch and lamp -->
<path d="M980 450 L1590 455 L1590 520 L980 520Z" fill="#182733" opacity=".88"/>
<path d="M1020 440 L1580 440" stroke="#a7b1b4" stroke-opacity=".45" stroke-width="8"/>
<rect x="1515" y="465" width="18" height="100" rx="7" fill="#121d26"/>
<path d="M1492 465 Q1524 410 1556 465Z" fill="#202d37" stroke="#b5a28a" stroke-width="5"/>
<circle cx="1524" cy="485" r="115" fill="url(#lamp)"/>
<path d="M1510 498 L1536 498" stroke="#f6d7a1" stroke-width="10" stroke-linecap="round"/>
<!-- bushes -->
<g fill="#172c2a"><circle cx="980" cy="680" r="70"/><circle cx="1050" cy="700" r="85"/><circle cx="1120" cy="690" r="65"/><circle cx="1460" cy="730" r="85"/><circle cx="1540" cy="750" r="95"/></g>
<g fill="#b17e75" opacity=".5"><circle cx="1010" cy="665" r="9"/><circle cx="1050" cy="650" r="7"/><circle cx="1090" cy="680" r="8"/><circle cx="1490" cy="700" r="8"/></g>
<!-- symbolic broken lamp glass on porch step, not a forensic reconstruction -->
<g transform="translate(1280 760)" fill="url(#glass)" stroke="#d7e1e2" stroke-opacity=".65" stroke-width="3">
 <path d="M0 20 L20 -15 L36 18 L54 -4 L66 35 L42 50 L16 44Z"/>
 <path d="M78 42 L95 9 L109 50 L93 66Z"/><path d="M-35 65 L-20 43 L-8 72Z"/>
</g>
<!-- wet pavement reflections -->
<g stroke="#c7a17d" stroke-opacity=".17" stroke-width="5"><path d="M1120 850 L1510 840"/><path d="M1080 880 L1460 872"/><path d="M80 820 L590 800"/><path d="M180 865 L650 848"/></g>
<!-- streetlamp silhouettes and tree canopy -->
<g fill="none" stroke="#101c27" stroke-width="18" stroke-linecap="round"><path d="M300 0 Q340 130 285 260 L230 420"/><path d="M285 180 L120 110"/><path d="M285 210 L470 100"/><path d="M1400 0 Q1360 120 1405 220 L1470 390"/><path d="M1395 180 L1240 95"/><path d="M1400 160 L1550 80"/></g>
<g fill="#101c27" opacity=".96"><ellipse cx="120" cy="70" rx="190" ry="130"/><ellipse cx="380" cy="20" rx="220" ry="110"/><ellipse cx="1510" cy="65" rx="210" ry="140"/></g>
<rect width="1600" height="900" filter="url(#grain)" opacity=".45"/>
<rect x="24" y="24" width="1552" height="852" fill="none" stroke="#e8d5b6" stroke-opacity=".24" stroke-width="2"/>
</svg>