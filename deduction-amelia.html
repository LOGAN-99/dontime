const questions=[
{q:"1937년 7월 2일 에어하트와 누넌이 라에에서 향한 목적지는?",o:["하울랜드섬","하와이","타히티","샌프란시스코"],a:0,e:"두 사람은 라에에서 하울랜드섬을 향해 Lockheed Electra 10-E를 운항했습니다."},
{q:"하울랜드섬 부근에서 비행 지원과 무선 연락을 담당한 함정은?",o:["USCGC Itasca","USS Lexington","USS Arizona","HMS Beagle"],a:0,e:"USCGC Itasca는 하울랜드섬 부근에서 에어하트의 비행을 지원했습니다."},
{q:"Itasca의 기록에서 항공기 통신을 식별한 호출 부호는?",o:["KHAQQ","SOS-17","NORA","ECHO"],a:0,e:"Itasca의 무선 기록은 에어하트 항공기의 통신을 KHAQQ로 식별합니다."},
{q:"미국 국립문서기록관리청이 소개한 마지막 무선 수신 시각은 대략?",o:["오전 8시 43분","오전 5시 15분","오후 2시 30분","오후 7시 12분"],a:0,e:"NARA의 Itasca 무선 기록 소개는 약 오전 8시 43분의 마지막 수신을 설명합니다."},

let i=0,score=0,locked=false;const $=id=>document.getElementById(id);function draw(){locked=false;$('no').textContent='QUESTION '+(i+1)+' / '+questions.length;$('q').textContent=questions[i].q;$('opts').innerHTML=questions[i].o.map((x,j)=>'<button data-i="'+j+'">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('');$('fb').className='feedback';$('fb').textContent='';$('next').hidden=true;$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i));}function answer(n){if(locked)return;locked=true;const x=questions[i];if(n===x.a)score++;$('opts').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor='#5b9472';if(j===n&&n!==x.a)b.style.borderColor='#bf8173';});$('fb').textContent=(n===x.a?'정답입니다. ':'정답은 '+x.o[x.a]+'. ')+x.e;$('fb').classList.add('show');$('next').hidden=false;$('next').textContent=i===questions.length-1?'결과 보기':'다음 문제 →';} $('next').onclick=()=>{if(i<questions.length-1){i++;draw();}else{$('no').textContent='CASE 014 · COMPLETE';$('q').textContent='8문제 중 '+score+'개를 맞혔습니다.';$('opts').innerHTML='<a href="/amelia-earhart.html">다큐로 돌아가기</a> · <a href="/maze18.html">미궁 PART 18</a>';$('fb').textContent='기록이 확인한 범위와 가설의 경계를 유지하는 것이 좋은 추리의 출발점입니다.';$('fb').classList.add('show');$('next').hidden=true;}};draw();</script></body></html>
