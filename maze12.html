<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PART 12. 18번 표식의 기록실. 시간표, 원본 출처, 인계 순서를 맞추는 14개의 논리 퍼즐."><link rel="canonical" href="https://dontime.kr/maze12.html"><meta property="og:title" content="미궁 PART 12 · 18번 표식의 기록실 | 셈플리"><meta property="og:description" content="가상의 기록관에서 시간과 출처를 검증하는 14개 논리 퍼즐."><title>미궁 PART 12 · 18번 표식의 기록실 | 셈플리</title><style>*{box-sizing:border-box}body{margin:0;background:#07131d;color:#edf2f3;font-family:Arial,'Noto Sans KR',sans-serif;line-height:1.75}.wrap{max-width:900px;margin:auto;padding:22px 18px 70px}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:#e5bd82;text-decoration:none;font-weight:900}.hero,.card{border:1px solid #3a5664;background:#12232f;border-radius:18px;padding:23px;margin:18px 0}.hero{background:linear-gradient(120deg,rgba(5,15,23,.96),rgba(7,22,31,.65)),url('/assets/asha-highway18.svg') center/cover}.eyebrow{font:900 10px monospace;letter-spacing:.17em;color:#e5bd82}.title{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:8px 0}.muted{color:#b3c2c8}.meter{display:flex;justify-content:space-between;gap:12px;color:#b3c2c8;font-size:12px;font-weight:800}.progress{height:7px;background:#2b404c;border-radius:10px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:#d6b17e;transition:width .2s}.story{font-size:15px;color:#dce5e7;min-height:90px}.question{font-size:19px;font-weight:900;margin:14px 0}.options{display:grid;gap:9px}.options button{background:#0b1b26;border:1px solid #405b68;color:#edf2f3;text-align:left;padding:13px 15px;border-radius:11px;font-size:14px;cursor:pointer}.options button:disabled{opacity:.9;cursor:default}.feedback{display:none;background:#203744;border-radius:10px;padding:14px;margin-top:14px;color:#e0e8e9}.feedback.show{display:block}#next{margin-top:15px;border:0;background:#e5bd82;color:#172630;border-radius:9px;padding:11px 18px;font-weight:900;cursor:pointer}.note{font-size:12px;color:#9fb1b9}</style></head><body><main class="wrap"><nav class="nav"><a href="/">셈플리</a><a href="/maze.html">미궁 목록</a></nav><header class="hero"><div class="eyebrow">PART 12 · THE MARKER 18 ARCHIVE</div><h1 class="title">18번 표식의 기록실</h1><p class="muted">가상의 도로 기록관에 도착한 열네 개의 봉투. 시간, 원본, 인계 순서를 맞추고 관찰과 해석을 구분하라.</p><p class="note">완전한 창작 미궁입니다. 실제 아샤 디그리 사건의 인물·증거·수사 장면을 재현하지 않습니다. 실제 사건의 정답을 추측하는 게임이 아닙니다.</p></header><section class="card"><div class="meter"><span id="label">CHAPTER 01 / 14</span><span id="score">정답 0개</span></div><div class="progress"><span id="bar"></span></div><h2 id="title" class="title" style="font-size:24px"></h2><p id="story" class="story"></p><p id="question" class="question"></p><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" hidden>다음 장면 →</button></section></main><script>
const chapters=[
{title:"첫 번째 봉투",story:"기록관 책상 위에 08:12, 08:20, 08:45가 적힌 세 장의 접수표가 놓였다. 담당자는 가장 먼저 접수된 자료부터 정리하라고 했다.",q:"올바른 시간 순서는?",o:["08:45 → 08:12 → 08:20","08:12 → 08:20 → 08:45","08:20 → 08:45 → 08:12","08:12 → 08:45 → 08:20"],a:1,e:"시각을 오름차순으로 배열하면 08:12, 08:20, 08:45입니다."},
{title:"33분의 간격",story:"첫 접수표는 08:12, 마지막 접수표는 08:45를 가리킨다. 두 기록은 같은 시계로 작성됐다고 표시되어 있다.",q:"두 접수 시각 사이의 간격은?",o:["23분","30분","33분","43분"],a:2,e:"08:12에서 08:45까지는 33분입니다."},
{title:"복사본의 수",story:"서랍에는 같은 문서의 복사본 세 장이 있다. 세 장의 문서번호와 내용, 원본 해시값이 모두 같다.",q:"독립된 원본 기록의 수로 가장 타당한 것은?",o:["1개","2개","3개","확인할 수 없이 10개"],a:0,e:"세 장은 같은 원본을 복사한 자료입니다. 복사본의 수가 독립된 출처의 수를 늘리지는 않습니다."},
{title:"봉인 번호",story:"봉투에는 봉인 번호 4418이 적혀 있다. 인수 대장에는 같은 번호가 한 번 기록되어 있고, 봉투의 봉인은 온전하다.",q:"다음으로 가장 먼저 확인할 것은?",o:["봉인 번호를 임의로 바꾼다","인수 대장의 작성자·시각과 실제 봉인 상태를 대조한다","봉투를 열고 내용을 추측한다","번호가 익숙하다는 이유로 폐기한다"],a:1,e:"봉인 번호와 인수 기록을 대조해야 자료가 같은 건인지, 인계가 이어졌는지 확인할 수 있습니다."},
{title:"인계 순서",story:"가상의 표본을 채취하고 실험실로 보내는 절차가 적혀 있다. 채취, 봉인, 인계 서명, 실험실 접수 순으로 진행해야 한다.",q:"가장 타당한 절차 순서는?",o:["실험실 접수 → 채취 → 봉인 → 인계 서명","채취 → 봉인 → 인계 서명 → 실험실 접수","봉인 → 실험실 접수 → 채취 → 인계 서명","인계 서명 → 채취 → 실험실 접수 → 봉인"],a:1,e:"자료의 출처와 보관 경로를 확인하려면 채취부터 봉인, 인계, 접수까지 순서가 이어져야 합니다."},
{title:"지도 축척",story:"가상의 지도는 1cm가 실제 거리 2km를 나타낸다. 기록관 직원이 지도에서 두 지점 사이 3.5cm를 측정했다.",q:"두 지점 사이의 실제 거리는?",o:["5km","6km","7km","8km"],a:2,e:"1cm가 2km이므로 3.5cm는 7km입니다."},
{title:"말한 사실과 일어난 일",story:"한 메모에는 '직원이 파란 불빛을 보았다고 말했다'고 적혀 있다. 불빛을 촬영한 사진이나 다른 관찰 자료는 첨부되지 않았다.",q:"이 메모가 직접 입증하는 것은?",o:["파란 불빛의 물리적 정체","직원이 그렇게 말했다고 기록된 사실","불빛이 실제로 존재한 시간과 위치","불빛을 만든 장치의 종류"],a:1,e:"메모는 발언이 기록됐다는 점을 보여줍니다. 발언의 대상이 실제로 존재했는지는 별도 자료가 필요합니다."},
{title:"비어 있는 시각",story:"출입 대장에는 10:10과 10:40이 적혀 있지만 그 사이 한 줄의 시각이 비어 있다. 빈칸에 관한 별도 메모는 없다.",q:"가장 정확한 처리 방법은?",o:["10:25라고 임의로 채운다","빈칸을 누락으로 표시하고 원본과 다른 사본을 확인한다","누군가 기록을 조작했다고 단정한다","앞뒤 기록을 모두 삭제한다"],a:1,e:"빈칸은 기록이 없다는 사실만 보여줍니다. 누락의 내용과 원인은 원본·사본·작성 이력을 확인해야 합니다."},
{title:"시계 보정",story:"벽시계는 실제보다 3분 빠르다. 벽시계에 10:10이라고 표시됐다면 보정한 시각은?",q:"보정한 시각은?",o:["10:07","10:10","10:13","10:30"],a:0,e:"시계가 3분 빠르므로 표시 시각에서 3분을 빼면 10:07입니다."},
{title:"독립된 목격",story:"두 보고서가 같은 문장을 사용한다. 두 작성자는 모두 같은 온라인 게시물을 출처로 적었다.",q:"두 보고서를 독립된 목격 두 건으로 세기 어려운 이유는?",o:["문장이 길기 때문","두 보고서의 정보가 같은 게시물에서 왔기 때문","작성 날짜가 다르기 때문","문서가 종이로 출력됐기 때문"],a:1,e:"같은 원출처를 반복한 보고서는 독립된 관찰을 두 번 확인한 것과 다릅니다."},
{title:"문서의 버전",story:"문서 A는 초안 표시가 있고 서명이 없다. 문서 B는 같은 내용에 최종 승인 서명과 발행 날짜가 있다.",q:"현재 효력이 있는 공식 기록을 찾을 때 우선 검토할 자료는?",o:["서명이 없는 초안 A","최종 승인 서명과 날짜가 있는 문서 B","둘 중 더 짧은 문서","파일명이 먼저인 문서"],a:1,e:"최종 승인과 발행 정보가 확인되는 문서가 공식 기록인지 검증하기에 더 적합합니다."},
{title:"단서의 등급",story:"수사 기록에는 '짙은 색 차량을 봤다는 제보가 접수됐다'고 적혀 있다. 차량을 촬영한 사진이나 번호판은 없다.",q:"이 내용을 분류하는 가장 정확한 방법은?",o:["확인된 차량의 신원","제보로 접수된 수사 단서","법원에서 확정한 사실","차량과 관련 없는 정보"],a:1,e:"제보는 수사 단서입니다. 사진·등록 정보·독립된 확인 자료가 없으면 특정 차량의 존재나 관련성을 확정할 수 없습니다."},
{title:"결론의 범위",story:"세 명이 같은 문서를 읽었다. 한 명은 '가능성이 있다', 두 명은 '확정할 수 없다'고 기록했다. 추가 자료는 아직 없다.",q:"현재 자료에 가장 잘 맞는 결론은?",o:["가능성이 있으므로 사실로 확정한다","추가 자료가 없으므로 판단을 유보하고 불확실성을 표시한다","다수 의견을 사실로 바꾼다","가장 단정적인 문장을 선택한다"],a:1,e:"의견의 수나 표현의 강도는 증거를 대신하지 않습니다. 자료가 부족하면 판단을 유보해야 합니다."},
{title:"마지막 서랍",story:"기록관장은 세 칸을 남겼다. 첫 칸은 확인된 사실, 둘째 칸은 설명 후보, 셋째 칸은 아직 모르는 내용이다. 문을 여는 열쇠는 세 칸을 섞지 않는 것이다.",q:"가장 신뢰할 수 있는 최종 정리 방식은?",o:["빈칸을 상상으로 채운다","설명 후보를 확인된 사실로 바꾼다","사실·가설·미확인 사항을 분리해 기록한다","서로 다른 출처의 차이를 지운다"],a:2,e:"확인된 사실과 설명 후보, 아직 알 수 없는 내용을 구분해야 기록의 신뢰성을 지킬 수 있습니다."}
];
let at=0,score=0,locked=false;const $=id=>document.getElementById(id);
function render(){locked=false;const x=chapters[at];$("label").textContent="CHAPTER "+String(at+1).padStart(2,"0")+" / "+chapters.length;$("score").textContent="정답 "+score+"개";$("bar").style.width=((at+1)/chapters.length*100)+"%";$("title").textContent=x.title;$("story").textContent=x.story;$("question").textContent=x.q;$("options").innerHTML="";x.o.forEach((v,n)=>{const b=document.createElement("button");b.textContent=String.fromCharCode(65+n)+". "+v;b.onclick=()=>answer(n);$("options").appendChild(b)});$("feedback").className="feedback";$("feedback").textContent="";$("next").hidden=true}
function answer(n){if(locked)return;locked=true;const x=chapters[at];if(n===x.a)score++;[...$("options").children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.style.borderColor="#8bc5b6";if(j===n&&n!==x.a)b.style.borderColor="#c37d74"});$("feedback").textContent=(n===x.a?"기록이 맞아떨어졌습니다. ":"다른 단서를 다시 살펴보세요. ")+x.e;$("feedback").classList.add("show");$("score").textContent="정답 "+score+"개";$("next").hidden=false;$("next").textContent=at===chapters.length-1?"기록실 최종 확인":"다음 장면 →"}
$("next").onclick=()=>{if(at<chapters.length-1){at++;render()}else{$("label").textContent="ARCHIVE COMPLETE";$("title").textContent="기록관의 마지막 문";$("story").textContent="기록관장은 확인된 사실을 사실란에, 설명 후보를 가설란에, 아직 확인되지 않은 내용은 빈칸 그대로 남겼다. 기록관의 문은 답을 많이 아는 사람보다 모르는 것을 정확히 표시한 사람에게 열렸다.";$("question").textContent=chapters.length+"개 퍼즐 중 "+score+"개 정답";$("options").innerHTML='<a href="/asha-degree.html" style="color:#e5bd82">CASE 008 다큐 보기</a> · <a href="/maze.html" style="color:#e5bd82">미궁 목록으로</a>';$("feedback").textContent="모르는 것을 모른다고 기록하는 일도 정확한 결론의 일부입니다.";$("feedback").classList.add("show");$("next").hidden=true;$("bar").style.width="100%"}};
render();
</script></body></html>
